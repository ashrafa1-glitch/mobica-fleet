<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracking Agent — موبيكا</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f0f2f5;color:#222;direction:rtl;font-size:14px}

/* LOGIN */
#sc-login{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a237e,#1565c0);padding:20px}
.login-box{background:#fff;border-radius:20px;padding:32px 24px;width:100%;max-width:380px;box-shadow:0 8px 40px rgba(0,0,0,.25)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo .ico{font-size:48px}
.login-logo h1{font-size:20px;font-weight:900;color:#1565c0;margin-top:8px}
.login-logo p{font-size:12px;color:#999;margin-top:4px}
.fg{margin-bottom:14px}
.fg label{font-size:11px;font-weight:700;color:#666;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.fg select,.fg input{width:100%;padding:12px;border:2px solid #e8e8e8;border-radius:10px;font-size:14px;font-family:inherit;direction:rtl;transition:.2s;background:#fafafa}
.fg select:focus,.fg input:focus{border-color:#1565c0;outline:none;background:#fff}
.btn-login{width:100%;padding:14px;background:linear-gradient(135deg,#1565c0,#1a237e);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px}
.login-err{color:#c62828;font-size:12px;margin-bottom:10px;display:none;text-align:center}

/* APP */
#sc-app{display:none}
.header{background:linear-gradient(135deg,#1a237e,#1565c0);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:200;display:flex;justify-content:space-between;align-items:center}
.hdr-info h1{font-size:15px;font-weight:700}
.hdr-info p{font-size:11px;opacity:.75;margin-top:2px}
.btn-out{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 12px;border-radius:8px;font-size:11px;cursor:pointer;font-family:inherit}

/* NAV */
.nav{display:flex;background:#fff;border-bottom:2px solid #f0f2f5;overflow-x:auto;padding:0 8px}
.nav-btn{padding:12px 16px;border:none;background:none;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;color:#999;border-bottom:3px solid transparent;margin-bottom:-2px;font-family:inherit;transition:.2s}
.nav-btn.active{color:#1565c0;border-bottom-color:#1565c0}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px 14px}
.kpi-card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.08);text-align:center;cursor:pointer;transition:.15s;border:2px solid transparent}
.kpi-card:active{transform:scale(.97)}
.kpi-card.sel{border-color:#1565c0}
.kpi-card .n{font-size:30px;font-weight:900;line-height:1}
.kpi-card .l{font-size:11px;color:#777;margin-top:4px}
.kpi-card .sub{font-size:10px;margin-top:2px;font-weight:600}
.c-blue .n{color:#1565c0} .c-green .n{color:#2e7d32}
.c-orange .n{color:#e65100} .c-red .n{color:#c62828}
.c-purple .n{color:#6a1b9a}

/* SECTIONS */
.pad{padding:0 14px}
.sec-title{font-weight:700;font-size:13px;color:#1565c0;margin:12px 0 8px;display:flex;justify-content:space-between;align-items:center}

/* ALERTS */
.alert{background:#fff3f3;border-radius:10px;padding:12px;margin:0 14px 8px;border-right:4px solid #c62828}
.alert-hdr{font-weight:700;color:#c62828;font-size:12px;margin-bottom:4px}
.alert-item{font-size:12px;color:#555;padding:2px 0}

/* TEAM PROGRESS */
.team-box{background:#fff;border-radius:12px;padding:14px;margin:0 14px 10px;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.team-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f5}
.team-row:last-child{border:none}
.t-name{font-weight:600;font-size:12px;min-width:85px}
.t-bar{flex:1;height:8px;background:#eee;border-radius:4px;overflow:hidden}
.t-fill{height:100%;border-radius:4px}
.t-pct{font-size:11px;font-weight:700;min-width:35px;text-align:left}
.t-badges{display:flex;gap:3px}

/* CONTRACTS */
.contract-card{background:#fff;border-radius:12px;margin-bottom:8px;box-shadow:0 1px 5px rgba(0,0,0,.07);overflow:hidden;border-right:4px solid #ccc}
.cc-full{border-right-color:#2e7d32}
.cc-partial{border-right-color:#1565c0}
.cc-zero{border-right-color:#e65100}
.cc-head{padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.cc-head:active{background:#fafafa}
.cc-info{flex:1}
.cc-title{font-weight:700;font-size:13px;color:#111;line-height:1.4}
.cc-sub{font-size:11px;color:#888;margin-top:3px}
.cc-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.badge{padding:3px 8px;border-radius:20px;font-size:10px;font-weight:600}
.bg{background:#e8f5e9;color:#2e7d32} .bb{background:#e3f2fd;color:#1565c0}
.bo{background:#fff3e0;color:#e65100} .br{background:#ffebee;color:#c62828}
.bp{background:#f3e5f5;color:#6a1b9a} .bgy{background:#f5f5f5;color:#555}
.byel{background:#fffde7;color:#e65100}
.prog{height:6px;background:#f0f0f0;border-radius:3px;margin-top:8px;overflow:hidden}
.prog-f{height:100%;border-radius:3px}
.prog-lbl{font-size:10px;margin-top:3px;font-weight:600}
.cc-body{display:none;padding:0 14px 14px;border-top:1px solid #f8f8f8}
.cc-body.sh{display:block}
.irow{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #fafafa;font-size:12px}
.il{color:#aaa;min-width:90px;flex-shrink:0}
.iv{font-weight:600;flex:1}
.items-tbl{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.items-tbl th{background:#f0f4ff;padding:6px 8px;text-align:right;color:#1565c0;font-weight:700;font-size:10px}
.items-tbl td{padding:6px 8px;border-bottom:1px solid #f5f5f5}
.items-tbl tr:last-child td{border:none}
.pct-bar{height:4px;background:#eee;border-radius:2px;overflow:hidden;margin-top:3px}
.pct-f{height:100%;border-radius:2px;background:#1565c0}
.act-bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.btn{padding:8px 14px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-p{background:#1565c0;color:#fff} .btn-s{background:#2e7d32;color:#fff}
.btn-w{background:#e65100;color:#fff} .btn-d{background:#c62828;color:#fff}
.btn-g{background:#f0f2f5;color:#555}

/* UPDATES */
.upd-item{background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-right:3px solid #1565c0;font-size:12px}
.upd-item.iss{border-right-color:#c62828;background:#fff8f8}
.upd-item.del{border-right-color:#2e7d32;background:#f8fff8}
.upd-item.ir{border-right-color:#6a1b9a;background:#faf8ff}
.upd-meta{color:#aaa;margin-top:5px;font-size:11px}

/* FILTERS */
.fbar{display:flex;gap:6px;padding:0 14px 8px;flex-wrap:wrap}
.fbar input,.fbar select{padding:8px 10px;border:1px solid #e0e0e0;border-radius:8px;font-size:12px;font-family:inherit;background:#fff;direction:rtl}
.fbar input{flex:1;min-width:130px}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;align-items:flex-end;justify-content:center}
.ov.sh{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:700;color:#1565c0;margin-bottom:4px}
.modal .sub{font-size:11px;color:#888;margin-bottom:14px}
.mfg{margin-bottom:12px}
.mfg label{font-size:11px;font-weight:700;color:#666;display:block;margin-bottom:5px}
.mfg select,.mfg textarea,.mfg input{width:100%;padding:10px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:13px;font-family:inherit;direction:rtl}
.mfg textarea{min-height:75px;resize:vertical}
.mbtns{display:flex;gap:8px;margin-top:4px}
.mbtns .btn{flex:1;padding:12px;font-size:13px}
.range-wrap{display:flex;align-items:center;gap:10px}
.range-wrap input{flex:1}
.range-val{font-weight:900;color:#1565c0;min-width:40px;text-align:center;font-size:16px}

/* EMPTY / TOAST */
.empty{text-align:center;padding:50px 20px;color:#bbb;font-size:13px}
.empty .ico{font-size:40px;margin-bottom:10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;z-index:500;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.sh{opacity:1}
.section{padding:0 14px 90px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="sc-login">
<div class="login-box">
  <div class="login-logo">
    <div class="ico">📋</div>
    <h1>Tracking Agent</h1>
    <p>نظام متابعة أوامر التركيب — موبيكا</p>
  </div>
  <div class="fg">
    <label>اختار اسمك</label>
    <select id="lu">
      <option value="">— اختار —</option>
      <optgroup label="👑 إدارة التركيبات">
        <option value="ashraf|admin">أشرف قاسم — مدير التخطيط</option>
        <option value="fathy|admin">محمد فتحي — مدير التركيبات</option>
        <option value="khaled|admin">خالد علي — إدارة</option>
        <option value="mokhtar|viewer">محمد مختار — متابعة</option>
        <option value="amr|viewer">عمرو الورداني — متابعة</option>

        <option value="ahmed|manager">أحمد حسن — مجموعة A</option>
        <option value="P1|manager">سامى فؤاد — مجموعة B</option>
        <option value="109962|manager">هشام جمال — مجموعة D</option>
        <option value="P4|manager">حازم قاعود — مجموعة C</option>
        <option value="A4|manager">محمد وسيم</option>

        <option value="emad|delivery">عماد عبدالواحد — تسليم</option>

  <div class="fg">

    <input type="password" id="lp" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">

  <div class="login-err" id="lerr">❌ كلمة المرور غير صحيحة</div>
  <button class="btn-login" onclick="login()">🔐 دخول</button>
</div>
</div>

<!-- APP -->
<div id="sc-app">
  <div class="header">
    <div class="hdr-info">
      <h1 id="hdr-title">📋 Tracking Agent</h1>
      <p id="hdr-sub"></p>
    </div>
    <button class="btn-out" onclick="logout()">خروج ←</button>
  </div>
  <div class="nav" id="main-nav"></div>
  <div id="page"></div>
</div>

<!-- MODALS -->
<div class="ov" id="m-update">
<div class="modal">
  <h2>🔄 تحديث حالة التركيب</h2>
  <div class="sub" id="mu-info"></div>
  <div class="mfg">
    <label>الحالة</label>
    <select id="mu-status">
      <option value="Open">⏳ لم يبدأ</option>
      <option value="Being processed">🔵 جارى التركيب</option>
      <option value="Completed">✅ مكتمل</option>
      <option value="Stopped">🔴 متوقف مؤقتاً</option>
    </select>
  </div>
  <div class="mfg">
    <label>نسبة الإنجاز</label>
    <div class="range-wrap">
      <input type="range" id="mu-pct" min="0" max="100" step="10" value="0" oninput="document.getElementById('mu-pv').textContent=this.value+'%'">
      <div class="range-val" id="mu-pv">0%</div>
    </div>
  </div>
  <div class="mfg">
    <label>ملاحظة</label>
    <textarea id="mu-note" placeholder="ملاحظة اختيارية..."></textarea>
  </div>
  <div class="mbtns">
    <button class="btn btn-p" onclick="submitUpdate()">💾 حفظ</button>
    <button class="btn btn-g" onclick="close_('m-update')">إلغاء</button>
  </div>
</div>
</div>

<div class="ov" id="m-issue">
<div class="modal">
  <h2>⚠️ إبلاغ عن مشكلة</h2>
  <div class="sub" id="mi-info"></div>
  <div class="mfg">
    <label>نوع المشكلة</label>
    <select id="mi-type">
      <option value="نقص في التوريد">📦 نقص في التوريد</option>
      <option value="عيب في المنتج">🔴 عيب في المنتج → سيُفتح Snag</option>
      <option value="مشكلة في الموقع">🏗️ مشكلة في الموقع</option>
      <option value="تأخير من العميل">⏰ تأخير من العميل</option>
      <option value="مشكلة مقاس">📐 مشكلة مقاس</option>
      <option value="أخرى">📝 أخرى</option>
    </select>
  </div>
  <div class="mfg">
    <label>الخطورة</label>
    <select id="mi-sev">
      <option value="low">🟢 بسيطة</option>
      <option value="medium">🟡 متوسطة</option>
      <option value="urgent">🔴 عاجلة</option>
    </select>
  </div>
  <div class="mfg">
    <label>وصف المشكلة</label>
    <textarea id="mi-desc" placeholder="اشرح المشكلة بالتفصيل..."></textarea>
  </div>
  <div class="mbtns">
    <button class="btn btn-w" onclick="submitIssue()">📤 إرسال</button>
    <button class="btn btn-g" onclick="close_('m-issue')">إلغاء</button>
  </div>
</div>
</div>

<div class="ov" id="m-ir">
<div class="modal">
  <h2>📋 إضافة محضر تسليم</h2>
  <div class="sub" id="ir-info"></div>
  <div class="mfg">
    <label>نوع المحضر</label>
    <select id="ir-type">
      <option value="IR">📋 IR — Inspection Report</option>
      <option value="مستخلص جزئي">💰 مستخلص جزئي</option>
      <option value="تسليم نهائي">✅ تسليم نهائي</option>
    </select>
  </div>
  <div class="mfg">
    <label>رقم المحضر</label>

  </div>
  <div class="mfg">
    <label>قيمة المستخلص (اختياري)</label>
    <input type="number" id="ir-val" placeholder="بالجنيه المصري">
  </div>
  <div class="mfg">
    <label>ملاحظة</label>
    <textarea id="ir-note" placeholder="ملاحظات المحضر..."></textarea>
  </div>
  <div class="mbtns">
    <button class="btn btn-s" onclick="submitIR()">✅ حفظ المحضر</button>
    <button class="btn btn-g" onclick="close_('m-ir')">إلغاء</button>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>

}
function myOrders(){
  if(U.role==='admin'||U.role==='viewer'||U.role==='delivery') return ORDERS;
  return ORDERS.filter(o=>o.team_code===U.uid);
}
function getUpds(order_no){return UPDATES.filter(u=>u.order_no===String(order_no)).sort((a,b)=>b.ts-a.ts)}
function lastStatus(order_no,def){
  const u=getUpds(order_no).find(x=>x.type==='status');
  return u?{status:u.status,pct:u.pct}:{status:def,pct:def==='Completed'?100:def==='Being processed'?50:0};
}
function isDelayed(o){
  if(!o.plan_finish||lastStatus(o.order_no,o.overall).status==='Completed') return false;
  return new Date(o.plan_finish)<new Date();
}
function daysLate(o){return Math.max(0,Math.floor((new Date()-new Date(o.plan_finish))/(864e5)))}
function cPct(c){return c.delivery_pct||0}
function cCls(c){return c.status==='fully_delivered'?'cc-full':c.status==='partially_delivered'?'cc-partial':'cc-zero'}
function fmtVal(v){return v?'EGP '+Number(v).toLocaleString():'—'}
function pCol(p){return p>=80?'#2e7d32':p>=50?'#1565c0':p>=20?'#e65100':'#c62828'}

// ══════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════
function renderDash(){
  const ords=myOrders().map(o=>({...o,...lastStatus(o.order_no,o.overall)}));
  const cons=myContracts();
  const tot=ords.length,done=ords.filter(o=>o.status==='Completed').length;
  const proc=ords.filter(o=>o.status==='Being processed').length;
  const del=ords.filter(o=>isDelayed(o)).length;
  const totalVal=cons.reduce((s,c)=>s+c.total_value,0);
  const delivPct=cons.length?Math.round(cons.reduce((s,c)=>s+c.delivery_pct,0)/cons.length):0;

  let h=`<div class="kpi-grid">
    <div class="kpi-card c-blue" onclick="go('orders')"><div class="n">${tot}</div><div class="l">أوامر التركيب</div></div>
    <div class="kpi-card c-green" onclick="go('orders')"><div class="n">${done}</div><div class="l">✅ مكتملة</div><div class="sub" style="color:#2e7d32">${tot?Math.round(done/tot*100):0}% إنجاز</div></div>
    <div class="kpi-card c-orange" onclick="go('delayed')"><div class="n">${del}</div><div class="l">⚠️ متأخرة</div></div>
    <div class="kpi-card c-purple" onclick="go('contracts')"><div class="n">${cons.length}</div><div class="l">عقد نشط</div><div class="sub" style="color:#6a1b9a">${delivPct}% مورّد</div></div>
  </div>`;

  // Alert delayed
  const delOrds=ords.filter(o=>isDelayed(o)).sort((a,b)=>daysLate(b)-daysLate(a));
  if(delOrds.length) h+=`<div class="alert" style="margin:0 14px 8px">
    <div class="alert-hdr">⚠️ ${delOrds.length} أمر تجاوز الموعد</div>
    ${delOrds.slice(0,3).map(o=>`<div class="alert-item">• ${o.customer} — تأخر ${daysLate(o)} يوم</div>`).join('')}
    ${delOrds.length>3?`<div class="alert-item" style="color:#1565c0;cursor:pointer" onclick="go('delayed')">عرض الكل ←</div>`:''}
  </div>`;

  // Team progress (admin/viewer)
  if(U.role==='admin'||U.role==='viewer'){
    h+='<div class="team-box"><div class="sec-title" style="margin:0 0 8px">📊 إنجاز الفرق</div>';
    ['P1','109962','P4','A4'].forEach(tc=>{
      const t=ords.filter(o=>o.team_code===tc);
      if(!t.length) return;
      const d=t.filter(o=>o.status==='Completed').length;
      const p=Math.round(d/t.length*100);
      const dl=t.filter(o=>isDelayed(o)).length;
      const col=pCol(p);
      h+=`<div class="team-row">
        <span class="t-name">${TNAMES[tc]||tc}</span>
        <div class="t-bar"><div class="t-fill" style="width:${p}%;background:${col}"></div></div>
        <span class="t-pct" style="color:${col}">${p}%</span>
        <div class="t-badges">${dl?`<span class="badge br">⚠️${dl}</span>`:''}<span class="badge bgy">${d}/${t.length}</span></div>
      </div>`;
    });
    h+='</div>';
  }

  // Recent updates
  const recUpds=[...UPDATES].sort((a,b)=>b.ts-a.ts).slice(0,4);
  if(recUpds.length){
    h+='<div class="pad"><div class="sec-title">🔔 آخر التحديثات</div>';
    recUpds.forEach(u=>{
      const cls=u.type==='issue'?'iss':u.type==='ir'?'ir':u.status==='Completed'?'del':'';
      const ico=u.type==='issue'?'⚠️':u.type==='ir'?'📋':u.type==='delivery'?'📦':'🔄';
      h+=`<div class="upd-item ${cls}">
        <b>${ico} ${u.contract_no||u.order_no}</b> — ${u.customer||''}
        <br>${u.type==='status'?'حالة: <b>'+u.status+'</b>'+(u.pct?' ('+u.pct+'%)':''):
             u.type==='issue'?'مشكلة: <b>'+u.issue_type+'</b>':
             u.type==='ir'?u.ir_type+': <b>'+u.ir_no+'</b>':
             'توريد: '+u.delivery_status}
        ${u.note?`<br><i style="color:#888">${u.note}</i>`:''}
        <div class="upd-meta">👤 ${u.by} | ${new Date(u.ts).toLocaleString('ar-EG')}</div>
      </div>`;
    });
    h+='</div>';
  }

  return h+'<div style="height:80px"></div>';
}

function renderContracts(filter){
  const cons=myContracts();
  let h=`<div class="fbar">
    <input type="text" id="cq" placeholder="🔍 بحث بالعميل أو رقم العقد..." oninput="filterContracts()">
    <select id="cdf" onchange="filterContracts()">
      <option value="">كل التوريدات</option>
      <option value="fully_delivered">✅ مكتمل</option>
      <option value="partially_delivered">🔵 جزئي</option>
      <option value="pending">⏳ لم يبدأ</option>
    </select>
  </div><div class="section" id="c-list">`;
  h+=renderContractCards(cons)+'</div>';
  return h;
}

function filterContracts(){
  const q=document.getElementById('cq')?.value.toLowerCase()||'';
  const f=document.getElementById('cdf')?.value||'';
  const cons=myContracts().filter(c=>{
    if(q && !c.customer.toLowerCase().includes(q) && !c.contract_no.includes(q)) return false;
    if(f && c.status!==f) return false;
    return true;
  });
  document.getElementById('c-list').innerHTML=renderContractCards(cons);
}

function renderContractCards(cons){
  if(!cons.length) return '<div class="empty"><div class="ico">📄</div>لا توجد عقود</div>';
  return cons.map((c,i)=>{
    const p=c.delivery_pct;
    const col=pCol(p);
    const canEdit=U.role==='admin'||U.role==='supply'||c.team===U.uid;
    const irCount=UPDATES.filter(u=>u.type==='ir'&&u.contract_no===c.contract_no).length;
    return `<div class="contract-card ${cCls(c)}">
      <div class="cc-head" onclick="tog('cc${i}')">
        <div class="cc-info">
          <div class="cc-title">${c.customer}</div>
          <div class="cc-sub">📋 ${c.contract_no} | ${c.team_name} | ${fmtVal(c.total_value)}</div>
          <div class="cc-badges">
            ${p===100?'<span class="badge bg">✅ توريد مكتمل</span>':p>0?`<span class="badge bb">📦 ${p}% مورّد</span>`:'<span class="badge bo">📦 لم يورد بعد</span>'}
            <span class="badge bgy">📦 ${c.total_delivered_qty}/${c.total_contract_qty} قطعة</span>
            ${c.remaining_qty?`<span class="badge bo">⏳ ${c.remaining_qty} باقي</span>`:''}
            ${irCount?`<span class="badge bp">📋 ${irCount} محضر</span>`:''}
            ${c.end_date?`<span class="badge bp">📅 ${c.end_date}</span>`:''}
          </div>
          <div class="prog"><div class="prog-f" style="width:${p}%;background:${col}"></div></div>
          <div class="prog-lbl" style="color:${col}">${p}% من إجمالي العقد مورّد</div>
        </div>
        <span style="font-size:18px;color:#ddd">▾</span>
      </div>
      <div class="cc-body" id="cc${i}">
        <div class="irow"><span class="il">العنوان</span><span class="iv">${c.address}</span></div>
        <div class="irow"><span class="il">الفريق</span><span class="iv">${c.team_name}</span></div>
        <div class="irow"><span class="il">مهندس البيع</span><span class="iv">${c.sales_engineer}</span></div>
        <div class="irow"><span class="il">هاتف</span><span class="iv"><a href="tel:${c.telephone}">${c.telephone}</a></span></div>
        <div class="irow"><span class="il">بداية / نهاية</span><span class="iv">${c.start_date} ← ${c.end_date}</span></div>
        <div class="irow"><span class="il">القيمة الإجمالية</span><span class="iv" style="color:#1565c0;font-size:14px">${fmtVal(c.total_value)}</span></div>
        <div class="sec-title" style="margin-top:12px">📦 البنود (${c.items.length})</div>
        <table class="items-tbl">
          <tr><th>البند</th><th>المتعاقد</th><th>المورّد</th><th>الباقي</th></tr>
          ${c.items.map(it=>{
            const pct=it.contract_qty?Math.round(it.delivered_qty/it.contract_qty*100):0;
            return `<tr>
              <td>${it.desc}<br><span style="color:#aaa;font-size:10px">${it.group}</span></td>
              <td style="text-align:center">${it.contract_qty}</td>
              <td style="text-align:center"><b style="color:${pct===100?'#2e7d32':pct>0?'#1565c0':'#aaa'}">${it.delivered_qty}</b>
                <div class="pct-bar"><div class="pct-f" style="width:${pct}%;background:${pCol(pct)}"></div></div>
              </td>
              <td style="text-align:center;color:${it.contract_qty-it.delivered_qty?'#e65100':'#2e7d32'}">${it.contract_qty-it.delivered_qty}</td>
            </tr>`;
          }).join('')}
        </table>
        ${canEdit?`<div class="act-bar">
          <button class="btn btn-p" onclick="openIssue('${c.contract_no}','${c.customer.replace(/'/g,"\'")}')">⚠️ مشكلة</button>
          ${(U.role==='delivery'||U.role==='admin')?`<button class="btn btn-s" onclick="openIR('${c.contract_no}','${c.customer.replace(/'/g,"\'")}')">📋 محضر تسليم</button>`:''}
        </div>`:''}
      </div>
    </div>`;
  }).join('');
}

function renderOrders(){

    <input type="text" id="oq" placeholder="🔍 بحث..." oninput="filterOrders()">
    <select id="osf" onchange="filterOrders()">
      <option value="">كل الحالات</option>
      <option value="Open">⏳ لم يبدأ</option>
      <option value="Being processed">🔵 جارى</option>
      <option value="Completed">✅ مكتمل</option>
    </select>
  </div><div class="section" id="o-list">`;
  h+=renderOrderCards(ords)+'</div>';
  return h;
}

function filterOrders(){
  const q=document.getElementById('oq')?.value.toLowerCase()||'';
  const sf=document.getElementById('osf')?.value||'';
  const ords=myOrders().filter(o=>{
    const s=lastStatus(o.order_no,o.overall);
    if(q && !o.customer.toLowerCase().includes(q) && !String(o.order_no).includes(q)) return false;
    if(sf && s.status!==sf) return false;
    return true;
  });
  document.getElementById('o-list').innerHTML=renderOrderCards(ords);
}

function renderOrderCards(ords){
  if(!ords.length) return '<div class="empty"><div class="ico">🔧</div>لا توجد أوامر</div>';
  return ords.map((o,i)=>{
    const s=lastStatus(o.order_no,o.overall);
    const qty=o.items.reduce((a,it)=>a+it.qty,0);
    const cls=isDelayed(o)?'cc-zero':s.status==='Completed'?'cc-full':s.status==='Being processed'?'cc-partial':'';
    const col=pCol(s.pct);
    const upds=getUpds(o.order_no);
    const canEdit=U.role==='admin'||U.role==='manager'&&o.team_code===U.uid;
    return `<div class="contract-card ${cls}">
      <div class="cc-head" onclick="tog('oc${i}')">
        <div class="cc-info">
          <div class="cc-title">${o.customer}</div>
          <div class="cc-sub">أمر: ${o.order_no} | ${TNAMES[o.team_code]||o.team_code}</div>
          <div class="cc-badges">
            ${sBadge(s.status)}<span class="badge bgy">📦 ${qty}</span>
            ${o.plan_finish?`<span class="badge bp">📅 ${o.plan_finish}</span>`:''}
            ${isDelayed(o)?`<span class="badge br">⚠️ تأخر ${daysLate(o)}ي</span>`:''}
            ${upds.length?`<span class="badge bgy">🔔 ${upds.length}</span>`:''}
          </div>
          <div class="prog"><div class="prog-f" style="width:${s.pct}%;background:${col}"></div></div>
          <div class="prog-lbl" style="color:${col}">${s.pct}% إنجاز</div>
        </div>
        <span style="font-size:18px;color:#ddd">▾</span>
      </div>
      <div class="cc-body" id="oc${i}">
        ${o.address?`<div class="irow"><span class="il">العنوان</span><span class="iv">${o.address}</span></div>`:''}
        <div class="irow"><span class="il">الموعد المخطط</span><span class="iv" style="${isDelayed(o)?'color:#c62828;font-weight:900':''}">${o.plan_finish||'—'}</span></div>
        <div class="irow"><span class="il">التوريد</span><span class="iv">${o.delivery}</span></div>
        <div class="irow"><span class="il">مهندس البيع</span><span class="iv">${o.sales_engineer||'—'}</span></div>
        <div class="sec-title">📦 البنود (${o.items.length})</div>
        ${o.items.map(it=>`<div style="background:#f8f9fa;border-radius:8px;padding:8px;margin-bottom:4px;font-size:11px">
          <b>${it.desc}</b><br><span style="color:#888">${it.qty} قطعة | ${it.group}${it.actual_finish?' | ✅ انتهى':''}</span>
        </div>`).join('')}
        ${upds.length?`<div class="sec-title">🔔 التحديثات (${upds.length})</div>
        ${upds.map(u=>`<div class="upd-item ${u.type==='issue'?'iss':u.status==='Completed'?'del':''}">
          ${u.type==='status'?'🔄 '+u.status+(u.pct?' ('+u.pct+'%)':''):u.type==='issue'?'⚠️ '+u.issue_type:'📦 '+u.delivery_status}
          ${u.note?`<br><i>${u.note}</i>`:''}
          <div class="upd-meta">👤 ${u.by} | ${new Date(u.ts).toLocaleString('ar-EG')}</div>
        </div>`).join('')}`:''}
        ${canEdit?`<div class="act-bar">
          <button class="btn btn-p" onclick="openUpdate('${o.order_no}','${o.customer.replace(/'/g,"\'")}','${s.status}',${s.pct})">🔄 تحديث</button>
          <button class="btn btn-w" onclick="openIssue('${o.order_no}','${o.customer.replace(/'/g,"\'")}')">⚠️ مشكلة</button>
        </div>`:''}
      </div>
    </div>`;
  }).join('');
}

// DELAYED

function renderDelayed(){
  const ords=myOrders().filter(o=>isDelayed(o)).sort((a,b)=>daysLate(b)-daysLate(a));

  return `<div style="padding:10px 14px 4px;font-size:12px;color:#c62828;font-weight:700">⚠️ ${ords.length} أمر تجاوز الموعد المخطط</div>
  <div class="section">${renderOrderCards(ords)}</div>`;
}

      <b>${ico} ${u.contract_no||u.order_no}</b> — ${u.customer||''}

// ══════════════════════════════════════════
// MODALS
// ══════════════════════════════════════════
function openUpdate(no,cust,status,pct){
  _cur={order_no:no,customer:cust};
  document.getElementById('mu-info').textContent=cust+' | أمر: '+no;
  document.getElementById('mu-status').value=status||'Open';
  document.getElementById('mu-pct').value=pct||0;
  document.getElementById('mu-pv').textContent=(pct||0)+'%';
  document.getElementById('mu-note').value='';
  open_('m-update');
}
function openIssue(no,cust){
  _cur={order_no:no,customer:cust};
  document.getElementById('mi-info').textContent=cust+' | '+no;
  document.getElementById('mi-desc').value='';
  open_('m-issue');
}
function openIR(cno,cust){
  _cur={contract_no:cno,customer:cust};
  document.getElementById('ir-info').textContent=cust?(cust+' | '+cno):'اختر العقد من القائمة';
  document.getElementById('ir-no').value='';
  document.getElementById('ir-val').value='';
  document.getElementById('ir-note').value='';
  open_('m-ir');
}

function submitUpdate(){
  const u={type:'status',order_no:_cur.order_no,customer:_cur.customer,
    status:document.getElementById('mu-status').value,
    pct:parseInt(document.getElementById('mu-pct').value),
    note:document.getElementById('mu-note').value,
    by:U.name,ts:Date.now()};
  save(u); close_('m-update'); toast('✅ تم حفظ التحديث'); go(_page);
}
function submitIssue(){
  const d=document.getElementById('mi-desc').value;
  if(!d){toast('اكتب وصف المشكلة');return;}
  const u={type:'issue',order_no:_cur.order_no,customer:_cur.customer,
    issue_type:document.getElementById('mi-type').value,
    severity:document.getElementById('mi-sev').value,
    note:d,by:U.name,ts:Date.now()};
  save(u); close_('m-issue'); toast('⚠️ تم إرسال المشكلة'); go(_page);
}
function submitIR(){
  const no=document.getElementById('ir-no').value;
  if(!no){toast('أدخل رقم المحضر');return;}
  const u={type:'ir',contract_no:_cur.contract_no,customer:_cur.customer,
    ir_type:document.getElementById('ir-type').value,
    ir_no:no,ir_val:document.getElementById('ir-val').value,
    note:document.getElementById('ir-note').value,
    by:U.name,ts:Date.now()};
  save(u); close_('m-ir'); toast('📋 تم حفظ المحضر'); go(_page);
}

function save(u){
  UPDATES.unshift(u);
  localStorage.setItem(SK+'_upd',JSON.stringify(UPDATES));
}
function open_(id){document.getElementById(id).classList.add('sh')}
function close_(id){document.getElementById(id).classList.remove('sh')}
function tog(id){document.getElementById(id)?.classList.toggle('sh')}
function sBadge(s){
  if(s==='Completed') return '<span class="badge bg">✅ مكتمل</span>';
  if(s==='Being processed') return '<span class="badge bb">🔵 جارى</span>';
  if(s==='Stopped') return '<span class="badge br">🔴 متوقف</span>';
  return '<span class="badge bo">⏳ لم يبدأ</span>';
}
function toast(m){
  const t=document.getElementById('toast');
  t.textContent=m;t.classList.add('sh');
  setTimeout(()=>t.classList.remove('sh'),2500);
}
document.querySelectorAll('.ov').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('sh')}));
