<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracking Agent — موبيكا</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f0f2f5;color:#222;direction:rtl}

/* LOGIN */
#sc-login{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a237e,#1565c0);padding:20px}
.lbox{background:#fff;border-radius:20px;padding:32px 24px;width:100%;max-width:380px;box-shadow:0 8px 40px rgba(0,0,0,.25)}
.llogo{text-align:center;margin-bottom:24px}
.llogo .ico{font-size:44px}
.llogo h1{font-size:20px;font-weight:900;color:#1565c0;margin-top:6px}
.llogo p{font-size:12px;color:#999;margin-top:3px}
.fg label{font-size:11px;font-weight:700;color:#666;display:block;margin-bottom:5px}
.fg select,.fg input{width:100%;padding:11px;border:2px solid #eee;border-radius:10px;font-size:14px;font-family:inherit;direction:rtl;margin-bottom:12px;background:#fafafa}
.fg select:focus,.fg input:focus{border-color:#1565c0;outline:none;background:#fff}
.btn-login{width:100%;padding:13px;background:linear-gradient(135deg,#1565c0,#1a237e);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.lerr{color:#c62828;font-size:12px;text-align:center;margin-bottom:8px;display:none}

/* HEADER */
#sc-app{display:none}
.hdr{background:linear-gradient(135deg,#1a237e,#1565c0);color:#fff;padding:13px 16px;position:sticky;top:0;z-index:200;display:flex;justify-content:space-between;align-items:center}
.hdr h1{font-size:15px;font-weight:700}
.hdr p{font-size:11px;opacity:.75;margin-top:2px}
.btn-out{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 11px;border-radius:7px;font-size:11px;cursor:pointer;font-family:inherit}

/* NAV */
.nav{display:flex;background:#fff;border-bottom:2px solid #f0f2f5;overflow-x:auto;padding:0 8px}
.nav-btn{padding:11px 14px;border:none;background:none;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;color:#aaa;border-bottom:3px solid transparent;margin-bottom:-2px;font-family:inherit}
.nav-btn.on{color:#1565c0;border-bottom-color:#1565c0}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px 14px}
.kpi{background:#fff;border-radius:12px;padding:13px;box-shadow:0 1px 6px rgba(0,0,0,.08);text-align:center;cursor:pointer;border:2px solid transparent;transition:.15s}
.kpi.sel{border-color:#1565c0}
.kpi .n{font-size:28px;font-weight:900;line-height:1}
.kpi .l{font-size:10px;color:#777;margin-top:3px}
.kpi .s{font-size:10px;font-weight:600;margin-top:2px}
.cb .n{color:#1565c0} .cg .n{color:#2e7d32} .co .n{color:#e65100}
.cr .n{color:#c62828} .cp .n{color:#6a1b9a} .cy .n{color:#f57f17}

/* CARDS */
.card{background:#fff;border-radius:12px;margin-bottom:8px;box-shadow:0 1px 5px rgba(0,0,0,.07);overflow:hidden;border-right:4px solid #ccc}
.card.gc{border-right-color:#2e7d32}
.card.bc{border-right-color:#1565c0}
.card.oc{border-right-color:#e65100}
.card.rc{border-right-color:#c62828}
.card.pc{border-right-color:#6a1b9a}
.ch{padding:12px 14px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.ch:active{background:#fafafa}
.ci{flex:1}
.ct{font-weight:700;font-size:13px;color:#111;line-height:1.4}
.cs{font-size:11px;color:#888;margin-top:3px}
.cbadges{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.b{padding:3px 8px;border-radius:20px;font-size:10px;font-weight:600}
.bg{background:#e8f5e9;color:#2e7d32} .bb{background:#e3f2fd;color:#1565c0}
.bo{background:#fff3e0;color:#e65100} .br{background:#ffebee;color:#c62828}
.bp{background:#f3e5f5;color:#6a1b9a} .bgy{background:#f5f5f5;color:#555}
.by{background:#fffde7;color:#e65100}
.pb{height:6px;background:#f0f0f0;border-radius:3px;margin-top:7px;overflow:hidden}
.pbf{height:100%;border-radius:3px;transition:.4s}
.pl{font-size:10px;margin-top:3px;font-weight:600}
.cb2{display:none;padding:0 14px 14px;border-top:1px solid #f8f8f8}
.cb2.sh{display:block}
.ir{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #fafafa;font-size:12px}
.il{color:#bbb;min-width:85px;flex-shrink:0}
.iv{font-weight:600;flex:1}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.tbl th{background:#f0f4ff;padding:6px 6px;text-align:right;color:#1565c0;font-weight:700;font-size:10px}
.tbl td{padding:5px 6px;border-bottom:1px solid #f5f5f5;vertical-align:top}
.tbl tr:last-child td{border:none}
.mini-bar{height:3px;background:#eee;border-radius:2px;overflow:hidden;margin-top:2px}
.mini-f{height:100%;border-radius:2px}

/* WORKLOAD */
.wl-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:8px;box-shadow:0 1px 5px rgba(0,0,0,.07)}
.wl-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.wl-name{font-weight:700;font-size:14px}
.wl-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.wl-lbl{min-width:80px;color:#888}
.wl-bar{flex:1;height:10px;background:#eee;border-radius:5px;overflow:hidden}
.wl-fill{height:100%;border-radius:5px}
.wl-val{min-width:60px;text-align:left;font-weight:700;font-size:12px}

/* ACTION BUTTONS */
.abar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btn{padding:8px 13px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.bp2{background:#1565c0;color:#fff} .bs{background:#2e7d32;color:#fff}
.bw{background:#e65100;color:#fff} .bd{background:#c62828;color:#fff}
.bgr{background:#f0f2f5;color:#555}

/* UPDATES */
.ui{background:#fff;border-radius:10px;padding:11px;margin-bottom:7px;box-shadow:0 1px 4px rgba(0,0,0,.06);border-right:3px solid #1565c0;font-size:12px}
.ui.iss{border-right-color:#c62828;background:#fff8f8}
.ui.del{border-right-color:#2e7d32;background:#f8fff8}
.ui.ir2{border-right-color:#6a1b9a;background:#faf8ff}
.um{color:#aaa;margin-top:4px;font-size:11px}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:none;align-items:flex-end;justify-content:center}
.ov.sh{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto}
.mh{font-size:16px;font-weight:700;color:#1565c0;margin-bottom:4px}
.msub{font-size:11px;color:#aaa;margin-bottom:14px;background:#f5f5f5;padding:8px;border-radius:8px}
.mfg label{font-size:11px;font-weight:700;color:#666;display:block;margin-bottom:5px}
.mfg select,.mfg textarea,.mfg input[type=text],.mfg input[type=number]{width:100%;padding:10px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:13px;font-family:inherit;direction:rtl;margin-bottom:10px}
.mfg textarea{min-height:72px;resize:vertical}
.rw{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rw input[type=range]{flex:1}
.rv{font-weight:900;color:#1565c0;min-width:42px;text-align:center;font-size:16px}
.mbtns{display:flex;gap:8px}
.mbtns .btn{flex:1;padding:12px;font-size:13px}

/* IMPORT */
.import-box{background:#fff;border-radius:12px;padding:20px;margin:14px;border:2px dashed #1565c0;text-align:center}
.import-box p{font-size:13px;color:#666;margin-bottom:12px}
.import-box label{display:inline-block;background:#1565c0;color:#fff;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}

/* MISC */
.sec{padding:0 14px}
.stitle{font-weight:700;font-size:13px;color:#1565c0;margin:10px 0 7px;display:flex;justify-content:space-between}
.fbar{display:flex;gap:6px;padding:0 14px 8px;flex-wrap:wrap}
.fbar input,.fbar select{padding:8px 10px;border:1px solid #e0e0e0;border-radius:8px;font-size:12px;font-family:inherit;background:#fff;direction:rtl}
.fbar input{flex:1;min-width:130px}
.alert{background:#fff3f3;border-radius:10px;padding:11px;margin:0 14px 8px;border-right:4px solid #c62828;font-size:12px}
.al-hdr{font-weight:700;color:#c62828;margin-bottom:4px}
.empty{text-align:center;padding:50px 20px;color:#ccc}
.empty .ei{font-size:36px;margin-bottom:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;z-index:500;opacity:0;transition:.3s;pointer-events:none}
.toast.sh{opacity:1}
.pad80{height:80px}
</style>
</head>

// HELPERS

function myOrders(){
  if(U.role==='admin'||U.role==='viewer'||U.role==='delivery'||U.role==='supply') return ORDERS;
  return ORDERS.filter(o=>o.team_code===U.uid);
}
function myContracts(){
  if(U.role==='admin'||U.role==='viewer'||U.role==='delivery'||U.role==='supply') return CONTRACTS;
  return CONTRACTS.filter(c=>c.team===U.uid);
}
function lastUpd(no){
  return UPD.filter(u=>u.order_no===String(no)&&u.type==='status').sort((a,b)=>b.ts-a.ts)[0];
}
function oStatus(o){
  const u=lastUpd(o.order_no);
  return u?{status:u.status,pct:u.pct}:{status:o.overall,pct:o.overall==='Completed'?100:o.overall==='Being processed'?50:0};
}
function isLate(o){
  if(!o.plan_finish||oStatus(o).status==='Completed') return false;
  return new Date(o.plan_finish)<new Date();
}
function dLate(o){return Math.max(0,Math.floor((Date.now()-new Date(o.plan_finish))/864e5))}
function pc(p){return p>=80?'#2e7d32':p>=50?'#1565c0':p>=20?'#e65100':'#c62828'}
function fv(v){return v?'EGP '+Number(v).toLocaleString():'—'}
function sb(s){
  if(s==='Completed') return '<span class="b bg">✅ مكتمل</span>';
  if(s==='Being processed') return '<span class="b bb">🔵 جارى</span>';
  if(s==='Stopped') return '<span class="b br">🔴 متوقف</span>';
  return '<span class="b bo">⏳ لم يبدأ</span>';
}
function db(d){
  if(d==='Fully delivered') return '<span class="b bg">📦 كامل</span>';
  if(d==='Partially delivered') return '<span class="b bb">📦 جزئي</span>';
  return '<span class="b br">📦 لم يورد</span>';
}

  let h=`<div class="fbar">
    <input type="text" id="cq" placeholder="🔍 بحث..." oninput="fContracts()">
    <select id="cdf" onchange="fContracts()">
      <option value="">كل التوريدات</option>
      <option value="fully_delivered">✅ كامل</option>
      <option value="partially_delivered">🔵 جزئي</option>
      <option value="pending">⏳ لم يبدأ</option>
    </select>
  </div><div class="sec" id="cl">`;
  return h+conCards(myContracts())+'</div><div class="pad80"></div>';
}
function fContracts(){
  const q=(document.getElementById('cq')||{}).value?.toLowerCase()||'';
  const f=(document.getElementById('cdf')||{}).value||'';
  document.getElementById('cl').innerHTML=conCards(
    myContracts().filter(c=>(!q||(c.customer.toLowerCase().includes(q)||c.contract_no.includes(q)))&&(!f||c.status===f))
  );
}
function conCards(cons){
  if(!cons.length) return '<div class="empty"><div class="ei">📄</div>لا توجد عقود</div>';
  return cons.map((c,i)=>{
    const p=c.delivery_pct, col=pc(p);
    const cls=p===100?'gc':p>0?'bc':'oc';
    const irC=UPD.filter(u=>u.type==='ir'&&u.contract_no===c.contract_no).length;
    const canE=U.role==='admin'||U.role==='supply'||c.team===U.uid||U.role==='delivery';
    return `<div class="card ${cls}">
      <div class="ch" onclick="tog('c${i}')">
        <div class="ci">
          <div class="ct">${c.customer}</div>
          <div class="cs">${c.contract_no} | ${c.team_name} | ${fv(c.total_value)}</div>
          <div class="cbadges">
            ${p===100?'<span class="b bg">✅ توريد مكتمل</span>':p>0?`<span class="b bb">📦 ${p}% مورّد</span>`:'<span class="b bo">📦 لم يورد</span>'}
            <span class="b bgy">📦 ${c.total_delivered_qty}/${c.total_contract_qty}</span>
            ${c.remaining_qty?`<span class="b bo">⏳ ${c.remaining_qty} باقي</span>`:''}
            ${irC?`<span class="b bp">📋 ${irC} محضر</span>`:''}
            ${c.end_date?`<span class="b bp">📅 ${c.end_date}</span>`:''}
          </div>
          <div class="pb"><div class="pbf" style="width:${p}%;background:${col}"></div></div>
          <div class="pl" style="color:${col}">${p}% من العقد مورّد</div>
        </div>
        <span style="font-size:18px;color:#ddd">▾</span>
      </div>
      <div class="cb2" id="c${i}">
        <div class="ir"><span class="il">العنوان</span><span class="iv">${c.address}</span></div>
        <div class="ir"><span class="il">الفريق</span><span class="iv">${c.team_name}</span></div>
        <div class="ir"><span class="il">مهندس البيع</span><span class="iv">${c.sales_engineer}</span></div>
        <div class="ir"><span class="il">هاتف</span><span class="iv"><a href="tel:${c.telephone}">${c.telephone}</a></span></div>
        <div class="ir"><span class="il">بداية ← نهاية</span><span class="iv">${c.start_date} ← ${c.end_date}</span></div>
        <div class="ir"><span class="il">القيمة</span><span class="iv" style="color:#1565c0">${fv(c.total_value)}</span></div>
        <div class="stitle">📦 البنود</div>
        <table class="tbl">
          <tr><th>البند</th><th>عقد</th><th>مورّد</th><th>باقي</th></tr>
          ${c.items.map(it=>{
            const pp=it.contract_qty?Math.round(it.delivered_qty/it.contract_qty*100):0;
            return `<tr>
              <td>${it.desc}<br><span style="color:#bbb;font-size:10px">${it.group}</span></td>
              <td style="text-align:center">${it.contract_qty}</td>
              <td style="text-align:center"><b style="color:${pc(pp)}">${it.delivered_qty}</b>
                <div class="mini-bar"><div class="mini-f" style="width:${pp}%;background:${pc(pp)}"></div></div>
              </td>
              <td style="text-align:center;color:${it.contract_qty-it.delivered_qty?'#e65100':'#2e7d32'}">${it.contract_qty-it.delivered_qty}</td>
            </tr>`;
          }).join('')}
        </table>
        ${canE?`<div class="abar">
          <button class="btn bw" onclick="openIss('${c.contract_no}','${c.customer.replace(/'/g,"\'")}')">⚠️ مشكلة</button>
          ${U.role==='delivery'||U.role==='admin'?`<button class="btn bs" onclick="openIR('${c.contract_no}','${c.customer.replace(/'/g,"\'")}')">📋 محضر</button>`:''}
        </div>`:''}
      </div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════
// ORDERS
// ═══════════════════════════════════════════
function renderOrders(){
  let h=`<div class="fbar">
    <input type="text" id="oq" placeholder="🔍 بحث..." oninput="fOrders()">
    <select id="osf" onchange="fOrders()">
      <option value="">كل الحالات</option>
      <option value="Open">⏳ لم يبدأ</option>
      <option value="Being processed">🔵 جارى</option>
      <option value="Completed">✅ مكتمل</option>
      <option value="Stopped">🔴 متوقف</option>
    </select>
  </div><div class="sec" id="ol">`;
  return h+ordCards(myOrders())+'</div><div class="pad80"></div>';
}
function fOrders(){
  const q=(document.getElementById('oq')||{}).value?.toLowerCase()||'';
  const sf=(document.getElementById('osf')||{}).value||'';
  document.getElementById('ol').innerHTML=ordCards(
    myOrders().filter(o=>{
      const s=oStatus(o);
      return (!q||(o.customer.toLowerCase().includes(q)||String(o.order_no).includes(q)))&&(!sf||s.status===sf);
    })
  );
}
function ordCards(ords){
  if(!ords.length) return '<div class="empty"><div class="ei">🔧</div>لا توجد أوامر</div>';
  return ords.map((o,i)=>{
    const s=oStatus(o);
    const qty=o.total_qty||o.items.reduce((a,it)=>a+it.qty,0);
    const units=Math.round(o.total_units||0);
    const cls=isLate(o)?'rc':s.status==='Completed'?'gc':s.status==='Being processed'?'bc':'';
    const col=pc(s.pct);
    const upds=UPD.filter(u=>u.order_no===String(o.order_no));
    const canE=U.role==='admin'||(U.role==='manager'&&o.team_code===U.uid);
    return `<div class="card ${cls}">
      <div class="ch" onclick="tog('o${i}')">
        <div class="ci">
          <div class="ct">${o.customer}</div>
          <div class="cs">أمر: ${o.order_no} | ${TN[o.team_code]||o.team_code}</div>
          <div class="cbadges">
            ${sb(s.status)}${db(o.delivery)}
            <span class="b bgy">📦 ${qty} قطعة</span>
            <span class="b bp">⏱️ ${units.toLocaleString()} وحدة</span>
            ${o.plan_finish?`<span class="b bp">📅 ${o.plan_finish}</span>`:''}
            ${isLate(o)?`<span class="b br">⚠️ ${dLate(o)} يوم</span>`:''}
            ${upds.length?`<span class="b bgy">🔔${upds.length}</span>`:''}
          </div>
          <div class="pb"><div class="pbf" style="width:${s.pct}%;background:${col}"></div></div>
          <div class="pl" style="color:${col}">${s.pct}% إنجاز | ${Math.round(units*s.pct/100).toLocaleString()}/${units.toLocaleString()} وحدة</div>
        </div>
        <span style="font-size:18px;color:#ddd">▾</span>
      </div>
      <div class="cb2" id="o${i}">
        ${o.address?`<div class="ir"><span class="il">العنوان</span><span class="iv">${o.address}</span></div>`:''}
        <div class="ir"><span class="il">الموعد</span><span class="iv" style="${isLate(o)?'color:#c62828;font-weight:900':''}">${o.plan_finish||'—'}</span></div>
        <div class="ir"><span class="il">التوريد</span><span class="iv">${o.delivery}</span></div>
        <div class="ir"><span class="il">مهندس البيع</span><span class="iv">${o.sales_engineer||'—'}</span></div>
        <div class="stitle">📦 البنود (${o.items.length})</div>
        <table class="tbl">
          <tr><th>البند</th><th>قطع</th><th>وحدة</th><th>إجمالي</th></tr>
          ${o.items.map(it=>`<tr>
            <td>${it.desc}<br><span style="color:#bbb;font-size:10px">${it.group}</span></td>
            <td style="text-align:center">${it.qty}</td>
            <td style="text-align:center">${it.units_per_item||0}</td>
            <td style="text-align:center"><b style="color:#1565c0">${it.total_units||0}</b></td>
          </tr>`).join('')}
          <tr style="background:#f0f4ff">
            <td colspan="2"><b>الإجمالي</b></td>
            <td colspan="2" style="text-align:center"><b style="color:#1565c0">${units.toLocaleString()} وحدة</b></td>
          </tr>
        </table>
        ${upds.length?`<div class="stitle">🔔 التحديثات</div>${upds.sort((a,b)=>b.ts-a.ts).map(u=>updCard(u)).join('')}`:''}
        ${canE?`<div class="abar">
          <button class="btn bp2" onclick="openUpd('${o.order_no}','${o.customer.replace(/'/g,"\'")}','${s.status}',${s.pct})">🔄 تحديث</button>
          <button class="btn bw" onclick="openIss('${o.order_no}','${o.customer.replace(/'/g,"\'")}')">⚠️ مشكلة</button>
        </div>`:''}
      </div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════
// DELAYED
// ═══════════════════════════════════════════
function renderDelayed(){
  const late=myOrders().filter(o=>isLate(o)).sort((a,b)=>dLate(b)-dLate(a));
  if(!late.length) return '<div class="empty" style="padding-top:80px"><div class="ei">🎉</div>لا توجد أوامر متأخرة!</div>';
  return `<div style="padding:10px 14px 4px;font-size:12px;color:#c62828;font-weight:700">⚠️ ${late.length} أمر متأخر</div>
  <div class="sec">${ordCards(late)}</div><div class="pad80"></div>`;
}

// ═══════════════════════════════════════════
// UPDATES FEED
// ═══════════════════════════════════════════
function renderUpdatesFeed(){
  const u=[...UPD].sort((a,b)=>b.ts-a.ts);
  if(!u.length) return '<div class="empty" style="padding-top:80px"><div class="ei">🔔</div>لا توجد تحديثات</div>';
  return '<div style="padding:10px 14px 80px">'+u.map(updCard).join('')+'</div>';
}
function updCard(u){
  const cls=u.type==='issue'?'iss':u.type==='ir'?'ir2':u.status==='Completed'?'del':'';
  const ico=u.type==='issue'?'⚠️':u.type==='ir'?'📋':u.type==='delivery'?'📦':'🔄';
  return `<div class="ui ${cls}">
    <b>${ico} ${u.contract_no||u.order_no}</b> — ${u.customer||''}
    <br>${u.type==='status'?'الحالة: <b>'+u.status+'</b>'+(u.pct?' ('+u.pct+'%)':''):
         u.type==='issue'?'مشكلة: <b>'+u.issue_type+'</b>':
         u.type==='ir'?u.ir_type+' | رقم: <b>'+u.ir_no+'</b>':'توريد: '+u.delivery_status}
    ${u.note?`<br><i style="color:#888">${u.note}</i>`:''}
    <div class="um">👤 ${u.by} | ${new Date(u.ts).toLocaleString('ar-EG')}</div>
  </div>`;
}

// ═══════════════════════════════════════════
// IR PAGE
// ═══════════════════════════════════════════
function renderIR(){
  const irs=UPD.filter(u=>u.type==='ir').sort((a,b)=>b.ts-a.ts);
  let h='<div style="padding:10px 14px 10px"><button class="btn bs" style="width:100%;padding:12px" onclick="openIR('','')">+ إضافة محضر تسليم</button></div>';
  if(!irs.length) h+='<div class="empty"><div class="ei">📋</div>لا توجد محاضر بعد</div>';
  else {
    h+='<div style="padding:0 14px 80px">';
    irs.forEach(u=>{
      h+=`<div class="ui ir2">
        <b>📋 ${u.ir_type}</b> — رقم: <b>${u.ir_no}</b>
        <br>العقد: ${u.contract_no||'—'} | ${u.customer||'—'}
        ${u.ir_vl?`<br>💰 ${Number(u.ir_vl).toLocaleString()} EGP`:''}
        ${u.note?`<br><i>${u.note}</i>`:''}
        <div class="um">👤 ${u.by} | ${new Date(u.ts).toLocaleString('ar-EG')}</div>
      </div>`;
    });
    h+='</div>';
  }
  return h;
}

// ═══════════════════════════════════════════
// IMPORT (ياسر)
// ═══════════════════════════════════════════
function renderImport(){
  return `<div style="padding:20px 14px">
    <div class="import-box">
      <div style="font-size:36px;margin-bottom:10px">📤</div>
      <p>ياسر — ارفع ملف Excel الجديد من SAP<br>النظام هيحدث الكميات تلقائياً ويبعت إشعار لمديري المجموعات</p>
      <label for="xl-file">اختار الملف</label>
      <input type="file" id="xl-file" accept=".xlsx,.xls" onchange="importExcel(this)" style="display:none">
    </div>
    <div id="import-result"></div>
    <div class="card" style="margin-top:14px;padding:14px">
      <div style="font-weight:700;color:#1565c0;margin-bottom:8px">📋 تعليمات الرفع</div>
      <div style="font-size:12px;color:#555;line-height:1.8">
        1. حمّل التقرير من SAP بنفس الشكل المعتاد<br>
        2. اضغط "اختار الملف" واختار الملف<br>
        3. النظام سيقارن الكميات الجديدة بالقديمة<br>
        4. سيُرسل إشعار تلقائي لمديري المجموعات بالتحديثات
      </div>
    </div>
  </div>`;
}

function importExcel(input){
  const file=input.files[0]; if(!file) return;
  document.getElementById('import-result').innerHTML=`<div style="text-align:center;padding:20px;color:#1565c0">⏳ جارى معالجة الملف...</div>`;
  // في النسخة الحقيقية هنا هيتعمل parse للـ Excel
  setTimeout(()=>{
    document.getElementById('import-result').innerHTML=`
      <div class="card" style="margin-top:14px;border-right:4px solid #2e7d32;padding:14px">
        <div style="font-weight:700;color:#2e7d32;margin-bottom:8px">✅ تم رفع الملف بنجاح</div>
        <div style="font-size:12px;color:#555">
          📦 تم تحديث البيانات<br>
          🔔 تم إرسال إشعار لمديري المجموعات<br>
          <i style="color:#888">* في النسخة الكاملة سيتم المقارنة التلقائية مع SAP</i>
        </div>
      </div>`;
  },1500);
}

// ═══════════════════════════════════════════
// MODALS
// ═══════════════════════════════════════════
function openUpd(no,cust,status,pct){
  CUR={order_no:no,customer:cust};
  document.getElementById('mu-info').textContent=cust+' | أمر: '+no;
  document.getElementById('mu-st').value=status||'Open';
  document.getElementById('mu-pct').value=pct||0;
  document.getElementById('mu-pv').textContent=(pct||0)+'%';
  document.getElementById('mu-note').value='';
  opn('m-upd');
}
function openIss(no,cust){
  CUR={order_no:no,customer:cust};
  document.getElementById('mi-info').textContent=cust+' | '+no;
  document.getElementById('mi-ds').value='';
  opn('m-iss');
}
function openIR(cno,cust){
  CUR={contract_no:cno,customer:cust};
  document.getElementById('ir-info').textContent=cust||(cno?cno:'اختر العقد من الصفحة السابقة');
  document.getElementById('ir-no').value='';
  document.getElementById('ir-vl').value='';
  document.getElementById('ir-nt').value='';
  opn('m-ir');
}

function subUpd(){
  const u={type:'status',order_no:CUR.order_no,customer:CUR.customer,
    status:document.getElementById('mu-st').value,
    pct:parseInt(document.getElementById('mu-pct').value),
    note:document.getElementById('mu-note').value,
    by:U.name,ts:Date.now()};
  save(u); cls('m-upd'); toast('✅ تم حفظ التحديث'); go(PG);
}
function subIss(){
  const d=document.getElementById('mi-ds').value;
  if(!d){toast('اكتب وصف المشكلة');return;}
  const u={type:'issue',order_no:CUR.order_no,customer:CUR.customer,
    issue_type:document.getElementById('mi-tp').value,
    severity:document.getElementById('mi-sv').value,
    note:d,by:U.name,ts:Date.now()};
  save(u); cls('m-iss'); toast('⚠️ تم إرسال المشكلة'); go(PG);
}
function subIR(){
  const no=document.getElementById('ir-no').value;
  if(!no){toast('أدخل رقم المحضر');return;}
  const u={type:'ir',contract_no:CUR.contract_no,customer:CUR.customer,
    ir_type:document.getElementById('ir-tp').value,
    ir_no:no,ir_vl:document.getElementById('ir-vl').value,
    note:document.getElementById('ir-nt').value,
    by:U.name,ts:Date.now()};
  save(u); cls('m-ir'); toast('📋 تم حفظ المحضر'); go(PG);
}

function save(u){UPD.unshift(u);localStorage.setItem(SK+'_u',JSON.stringify(UPD));}
function opn(id){document.getElementById(id).classList.add('sh')}
function cls(id){document.getElementById(id).classList.remove('sh')}
function tog(id){document.getElementById(id)?.classList.toggle('sh')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('sh');setTimeout(()=>t.classList.remove('sh'),2500)}
document.querySelectorAll('.ov').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('sh')}));
</script>
</body>
