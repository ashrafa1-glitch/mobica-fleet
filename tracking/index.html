<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f0f2f5;color:#222;direction:rtl}

/* LOGIN */
#screen-login{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1565c0,#0d47a1);padding:20px}
.login-box{background:#fff;border-radius:20px;padding:32px 24px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo h1{font-size:22px;color:#1565c0;font-weight:900}
.login-logo p{font-size:13px;color:#888;margin-top:4px}
.form-group{margin-bottom:14px}
.form-group label{font-size:12px;font-weight:600;color:#555;display:block;margin-bottom:6px}
.form-group select,.form-group input{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:10px;font-size:14px;font-family:inherit;direction:rtl;transition:.2s}
.form-group select:focus,.form-group input:focus{border-color:#1565c0;outline:none}
.btn-login{width:100%;padding:14px;background:#1565c0;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-login:active{background:#0d47a1}

/* APP */
#screen-app{display:none}
.header{background:linear-gradient(135deg,#1565c0,#0d47a1);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:16px;font-weight:700}
.header-sub{font-size:11px;opacity:.8;margin-top:2px}
.btn-logout{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit}

/* TABS */
.tab-bar{display:flex;overflow-x:auto;padding:10px 14px 6px;gap:6px;background:#fff;border-bottom:1px solid #eee}
.tab-btn{padding:7px 14px;border:none;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;background:#f0f2f5;color:#555;font-family:inherit}
.tab-btn.active{background:#1565c0;color:#fff}

/* KPIs */
.kpi-row{display:flex;gap:8px;padding:12px 14px;overflow-x:auto}
.kpi{background:#fff;border-radius:12px;padding:12px;min-width:100px;flex:1;box-shadow:0 1px 4px rgba(0,0,0,.08);text-align:center;cursor:pointer}
.kpi .num{font-size:26px;font-weight:900;line-height:1}
.kpi .lbl{font-size:10px;color:#666;margin-top:3px}
.kpi.blue .num{color:#1565c0}
.kpi.green .num{color:#2e7d32}
.kpi.orange .num{color:#e65100}
.kpi.red .num{color:#c62828}
.kpi.active{box-shadow:0 0 0 2px #1565c0}

/* FILTERS */
.filters{padding:0 14px 8px;display:flex;gap:8px;flex-wrap:wrap}
.filters input,.filters select{padding:8px 10px;border:1px solid #e0e0e0;border-radius:8px;font-size:13px;font-family:inherit;background:#fff;direction:rtl}
.filters input{flex:1;min-width:140px}

/* TEAM SUMMARY */
.summary-box{background:#fff;border-radius:12px;padding:12px 14px;margin:0 14px 10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.summary-title{font-weight:700;font-size:13px;color:#1565c0;margin-bottom:8px}
.team-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f5f5f5;font-size:12px}
.team-row:last-child{border:none}
.team-name{font-weight:600;min-width:90px}
.prog-wrap{flex:1;height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;transition:.5s}
.team-pct{font-weight:700;min-width:40px;text-align:left}

/* CARDS */
.section{padding:0 14px 90px}
.order-card{background:#fff;border-radius:12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.07);overflow:hidden;border-right:4px solid #ccc}
.order-card.completed{border-right-color:#2e7d32}
.order-card.processing{border-right-color:#1565c0}
.order-card.open{border-right-color:#e65100}
.order-card.delayed{border-right-color:#c62828}
.card-head{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-head:active{background:#fafafa}
.card-title{font-weight:700;font-size:13px;color:#1a1a2e;line-height:1.4}
.card-sub{font-size:11px;color:#888;margin-top:3px}
.card-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.badge{padding:3px 8px;border-radius:20px;font-size:10px;font-weight:600}
.b-green{background:#e8f5e9;color:#2e7d32}
.b-blue{background:#e3f2fd;color:#1565c0}
.b-orange{background:#fff3e0;color:#e65100}
.b-red{background:#ffebee;color:#c62828}
.b-gray{background:#f5f5f5;color:#555}
.b-purple{background:#f3e5f5;color:#6a1b9a}
.b-yellow{background:#fffde7;color:#f57f17}
.prog-bar{height:5px;background:#f0f0f0;border-radius:3px;margin-top:8px;overflow:hidden}
.prog-bar-fill{height:100%;border-radius:3px;transition:.3s}

/* CARD BODY */
.card-body{display:none;padding:0 14px 14px;border-top:1px solid #f5f5f5}
.card-body.show{display:block}
.irow{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #f8f8f8;font-size:12px}
.ilbl{color:#999;min-width:90px;flex-shrink:0}
.ival{font-weight:600;flex:1}
.items-hdr{font-weight:700;font-size:12px;margin:10px 0 6px;color:#1565c0;display:flex;justify-content:space-between;align-items:center}
.item-row{background:#f8f9fa;border-radius:8px;padding:8px;margin-bottom:4px;font-size:11px}
.item-desc{font-weight:600;margin-bottom:2px}
.item-meta{color:#777;line-height:1.7}

/* ACTION BUTTONS */
.action-bar{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.btn{padding:8px 14px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-primary{background:#1565c0;color:#fff}
.btn-success{background:#2e7d32;color:#fff}
.btn-warning{background:#e65100;color:#fff}
.btn-danger{background:#c62828;color:#fff}
.btn-gray{background:#f0f2f5;color:#555}
.btn:active{opacity:.8}

/* UPDATES LOG */
.update-log{margin-top:10px}
.update-item{background:#f0f4ff;border-radius:8px;padding:8px;margin-bottom:4px;font-size:11px;border-right:3px solid #1565c0}
.update-item.issue{background:#fff3f3;border-right-color:#c62828}
.update-item.done{background:#f0fff4;border-right-color:#2e7d32}
.update-meta{color:#888;margin-top:3px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;color:#1565c0}
.modal textarea,.modal input,.modal select{width:100%;padding:10px;border:1px solid #e0e0e0;border-radius:8px;font-size:13px;font-family:inherit;direction:rtl;margin-bottom:10px}
.modal textarea{min-height:80px;resize:vertical}
.modal-btns{display:flex;gap:8px}
.modal-btns .btn{flex:1;padding:12px;font-size:14px}

/* ALERT BANNER */
.alert-banner{background:#ffebee;border-radius:12px;padding:12px 14px;margin:0 14px 8px;border-right:4px solid #c62828;font-size:12px}
.alert-title{font-weight:700;color:#c62828;margin-bottom:4px}
.alert-item{color:#555;padding:2px 0}

/* FAB */
.fab{position:fixed;bottom:20px;left:20px;background:#1565c0;color:#fff;border:none;border-radius:50%;width:52px;height:52px;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(21,101,192,.4);z-index:200}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:#aaa;font-size:13px}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:400;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>

// ── AUTH ──
function doLogin(){
  const sel = document.getElementById('login-user').value;
  const pass = document.getElementById('login-pass').value;
  if(!sel){toast('اختار اسمك');return;}
  if(PASSWORDS[sel] !== pass){
    document.getElementById('login-err').style.display='block';return;
  }
  document.getElementById('login-err').style.display='none';
  const [uid, role] = sel.split('|');
  U = {uid, role, name: USER_NAMES[uid]||uid, team: ['P1','109962','P4','A4'].includes(uid)?uid:null};
  document.getElementById('screen-login').style.display='none';
  document.getElementById('screen-app').style.display='block';
  document.getElementById('hdr-name').textContent = U.name + ' | ' + (U.role==='admin'?'إدارة':'مدير مجموعة');
  // Load updates from server
  loadUpdates();
  renderTab('dash');
}

function logout(){
  U=null; _tab='dash'; _kpiFilter=null;
  document.getElementById('screen-app').style.display='none';
  document.getElementById('screen-login').style.display='flex';
  document.getElementById('login-pass').value='';
}

// ── DATA ──
function getMyOrders(){
  if(U.role==='admin') return ORDERS;
  return ORDERS.filter(o=>o.team_code===U.uid);
}

function getOrderWithUpdates(o){
  const upds = UPDATES.filter(u=>u.order_no===o.order_no).sort((a,b)=>b.ts-a.ts);
  const lastUpd = upds.find(u=>u.type==='status');
  return {
    ...o,
    overall: lastUpd ? lastUpd.status : o.overall,
    pct: lastUpd ? lastUpd.pct : (o.overall==='Completed'?100:o.overall==='Being processed'?50:0),
    updates: upds
  };
}

function isDelayed(o){
  if(!o.plan_finish || o.overall==='Completed') return false;
  return new Date(o.plan_finish) < new Date();
}

function daysDelayed(o){
  if(!o.plan_finish) return 0;
  return Math.floor((new Date()-new Date(o.plan_finish))/(1000*3600*24));
}

// ── TABS ──
function setTab(t,btn){
  _tab=t; _kpiFilter=null;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTab(t);
}

function renderTab(t){
  const orders = getMyOrders().map(o=>getOrderWithUpdates(o));
  const el = document.getElementById('tab-content');
  if(t==='dash') el.innerHTML = renderDash(orders);
  else if(t==='orders') el.innerHTML = renderOrders(orders);
  else if(t==='delayed') el.innerHTML = renderDelayed(orders);
  else if(t==='updates') el.innerHTML = renderUpdatesFeed();
}

// ── DASHBOARD ──
function renderDash(orders){
  const total=orders.length, done=orders.filter(o=>o.overall==='Completed').length;
  const proc=orders.filter(o=>o.overall==='Being processed').length;
  const open=orders.filter(o=>o.overall==='Open').length;
  const delayed=orders.filter(o=>isDelayed(o)).length;
  const teams=['P1','109962','P4','A4'];

  let html = `<div class="kpi-row">
    <div class="kpi blue" onclick="filterKpi('all')"><div class="num">${total}</div><div class="lbl">إجمالي</div></div>
    <div class="kpi green" onclick="filterKpi('done')"><div class="num">${done}</div><div class="lbl">✅ مكتمل</div></div>
    <div class="kpi blue" onclick="filterKpi('proc')"><div class="num">${proc}</div><div class="lbl">🔵 جارى</div></div>
    <div class="kpi orange" onclick="filterKpi('open')"><div class="num">${open}</div><div class="lbl">⏳ مفتوح</div></div>
    <div class="kpi red" onclick="filterKpi('delayed')"><div class="num">${delayed}</div><div class="lbl">⚠️ متأخر</div></div>
  </div>`;

  // Delayed alert
  const delOrders = orders.filter(o=>isDelayed(o)).sort((a,b)=>daysDelayed(b)-daysDelayed(a));
  if(delOrders.length){
    html += `<div class="alert-banner"><div class="alert-title">⚠️ ${delOrders.length} أمر تجاوز الموعد المخطط</div>`;
    delOrders.slice(0,3).forEach(o=>{
      html += `<div class="alert-item">• ${o.customer} — تأخر ${daysDelayed(o)} يوم</div>`;
    });
    if(delOrders.length>3) html+=`<div class="alert-item" style="color:#1565c0;cursor:pointer" onclick="document.querySelectorAll('.tab-btn')[2].click()">عرض الكل ←</div>`;
    html += '</div>';
  }

  // Team summary (admin only)
  if(U.role==='admin'){
    html += '<div class="summary-box"><div class="summary-title">📊 إنجاز الفرق</div>';
    teams.forEach(tc=>{
      const t=orders.filter(o=>o.team_code===tc);
      if(!t.length) return;
      const d=t.filter(o=>o.overall==='Completed').length;
      const dl=t.filter(o=>isDelayed(o)).length;
      const pct=Math.round(d/t.length*100);
      const col=pct>=80?'#2e7d32':pct>=50?'#e65100':'#c62828';
      html+=`<div class="team-row">
        <span class="team-name">${TEAM_NAMES[tc]}</span>
        <div class="prog-wrap"><div class="prog-fill" style="width:${pct}%;background:${col}"></div></div>
        <span class="team-pct" style="color:${col}">${pct}%</span>
        ${dl?`<span class="badge b-red">⚠️${dl}</span>`:''}
      </div>`;
    });
    html += '</div>';
  }

  // Last updates
  const lastUpds = [...UPDATES].sort((a,b)=>b.ts-a.ts).slice(0,5);
  if(lastUpds.length){
    html += '<div class="summary-box" style="margin:0 14px 80px"><div class="summary-title">🔔 آخر التحديثات</div>';
    lastUpds.forEach(u=>{
      const cls = u.type==='issue'?'issue':u.status==='Completed'?'done':'';
      const ico = u.type==='issue'?'⚠️':u.type==='delivery'?'📦':'🔄';
      html+=`<div class="update-item ${cls}">
        <b>${ico} ${u.order_no}</b> — ${u.customer||''}<br>
        ${u.type==='status'?'حالة: '+u.status+(u.pct?` (${u.pct}%)`:''):u.type==='issue'?'مشكلة: '+u.issue_type:'توريد: '+u.delivery_status}
        ${u.note?`<br><i>${u.note}</i>`:''}
        <div class="update-meta">👤 ${u.by} | 🕐 ${new Date(u.ts).toLocaleString('ar-EG')}</div>
      </div>`;
    });
    html += '</div>';
  } else {
    html += '<div style="padding:0 14px 80px"></div>';
  }

  return html;
}

// ── ORDERS LIST ──
function renderOrders(orders){
  let html = `<div class="filters">
    <input type="text" id="q" placeholder="🔍 بحث بالعميل أو رقم الأمر..." oninput="applyFilter()">
    <select id="sf" onchange="applyFilter()">
      <option value="">كل الحالات</option>
      <option value="Open">⏳ مفتوحة</option>
      <option value="Being processed">🔵 جارية</option>
      <option value="Completed">✅ مكتملة</option>
      <option value="Stopped">🔴 متوقفة</option>
    </select>
    <select id="df" onchange="applyFilter()">
      <option value="">كل التوريدات</option>
      <option value="Not delivered">لم يورد</option>
      <option value="Partially delivered">جزئي</option>
      <option value="Fully delivered">كامل</option>
    </select>
  </div><div class="section" id="cards-wrap">`;
  html += renderCards(orders) + '</div>';
  return html;
}

function applyFilter(){
  const q=(document.getElementById('q')||{}).value?.toLowerCase()||'';
  const sf=(document.getElementById('sf')||{}).value||'';
  const df=(document.getElementById('df')||{}).value||'';
  const orders = getMyOrders().map(o=>getOrderWithUpdates(o)).filter(o=>{
    if(q && !o.customer.toLowerCase().includes(q) && !String(o.order_no).includes(q)) return false;
    if(sf && o.overall!==sf) return false;
    if(df && o.delivery!==df) return false;
    return true;
  });
  document.getElementById('cards-wrap').innerHTML = renderCards(orders);
}

function filterKpi(f){
  setTab('orders', document.querySelectorAll('.tab-btn')[1]);
  setTimeout(()=>{
    const sf=document.getElementById('sf');
    if(sf){
      if(f==='done') sf.value='Completed';
      else if(f==='proc') sf.value='Being processed';
      else if(f==='open') sf.value='Open';
      applyFilter();
    }
  },100);
}

function renderCards(orders){

    const qty = o.items.reduce((s,it)=>s+it.qty,0);
    const pct = o.pct||0;
    const pctCol = pct>=80?'#2e7d32':pct>=50?'#1565c0':'#e65100';
    const canEdit = U.role==='admin' || o.team_code===U.uid;
    return `<div class="order-card ${cls}">
      <div class="card-head" onclick="tog('bd${i}')">
        <div style="flex:1">
          <div class="card-title">${o.customer}</div>
          <div class="card-sub">📋 ${o.order_no} &nbsp;|&nbsp; ${TEAM_NAMES[o.team_code]||o.team_code}</div>
          <div class="card-badges">
            ${statusBadge(o.overall)}
            ${deliveryBadge(o.delivery)}
            <span class="badge b-gray">📦 ${qty}</span>
            ${o.plan_finish?'<span class="badge b-purple">📅 '+o.plan_finish+'</span>':''}
            ${isDelayed(o)?`<span class="badge b-red">⚠️ تأخر ${daysDelayed(o)} يوم</span>`:''}
          </div>
          <div class="prog-bar"><div class="prog-bar-fill" style="width:${pct}%;background:${pctCol}"></div></div>
          <div style="font-size:10px;color:${pctCol};margin-top:2px;font-weight:600">${pct}% إنجاز</div>
        </div>
        <span style="font-size:18px;color:#ccc">▾</span>
      </div>
      <div class="card-body" id="bd${i}">
        ${o.address?`<div class="irow"><span class="ilbl">العنوان</span><span class="ival">${o.address}</span></div>`:''}
        <div class="irow"><span class="ilbl">أول توريد</span><span class="ival">${o.first_delivery||'—'}</span></div>
        <div class="irow"><span class="ilbl">الموعد المخطط</span><span class="ival" style="${isDelayed(o)?'color:#c62828;font-weight:900':''}">${o.plan_finish||'—'}</span></div>
        <div class="irow"><span class="ilbl">مهندس البيع</span><span class="ival">${o.sales_engineer||'—'}</span></div>
        ${o.telephone?`<div class="irow"><span class="ilbl">هاتف</span><span class="ival"><a href="tel:${o.telephone}">${o.telephone}</a></span></div>`:''}

          <span>📦 البنود (${o.items.length} بند)</span>
        </div>
        ${o.items.map(it=>`<div class="item-row">
          <div class="item-desc">${it.desc}</div>
          <div class="item-meta">الكمية: <b>${it.qty}</b> | ${it.group} | ${it.main_group}${it.actual_finish?' | <b style=color:#2e7d32>✅ انتهى</b>':''}</div>
        </div>`).join('')}
        ${o.updates&&o.updates.length?`<div class="items-hdr"><span>🔔 التحديثات (${o.updates.length})</span></div>
        <div class="update-log">${o.updates.map(u=>`<div class="update-item ${u.type==='issue'?'issue':u.status==='Completed'?'done':''}">
          ${u.type==='status'?'🔄 '+u.status+(u.pct?' ('+u.pct+'%)':''):u.type==='issue'?'⚠️ '+u.issue_type:'📦 '+u.delivery_status}
          ${u.note?`<br><i>${u.note}</i>`:''}

        </div>`).join('')}</div>`:''}
        ${canEdit?`<div class="action-bar">

  }).join('');
}

// ── DELAYED ──
function renderDelayed(orders){
  const del = orders.filter(o=>isDelayed(o)).sort((a,b)=>daysDelayed(b)-daysDelayed(a));
  if(!del.length) return '<div class="empty" style="padding-top:60px">🎉 لا توجد أوامر متأخرة!</div>';
  let html = `<div style="padding:10px 14px 4px;font-size:12px;color:#c62828;font-weight:600">⚠️ ${del.length} أمر تجاوز الموعد المخطط</div>`;
  html += '<div class="section">' + renderCards(del) + '</div>';
  return html;
}

// ── UPDATES FEED ──
function renderUpdatesFeed(){
  const upds = [...UPDATES].sort((a,b)=>b.ts-a.ts);
  if(!upds.length) return '<div class="empty" style="padding-top:60px">لا توجد تحديثات بعد</div>';
  let html = '<div style="padding:10px 14px 80px">';
  upds.forEach(u=>{
    const cls = u.type==='issue'?'issue':u.status==='Completed'?'done':'';
    const ico = u.type==='issue'?'⚠️':u.type==='delivery'?'📦':'🔄';
    html+=`<div class="update-item ${cls}" style="margin-bottom:8px">
      <b>${ico} ${u.order_no}</b> — ${u.customer||''}
      <br>${u.type==='status'?'الحالة: <b>'+u.status+'</b>'+(u.pct?' ('+u.pct+'%)':''):u.type==='issue'?'مشكلة: <b>'+u.issue_type+'</b>':'توريد: <b>'+u.delivery_status+'</b>'}
      ${u.note?`<br><i style="color:#666">${u.note}</i>`:''}
      <div class="update-meta">👤 ${u.by} | 🕐 ${new Date(u.ts).toLocaleString('ar-EG')}</div>
    </div>`;
  });
  html += '</div>';
  return html;
}

// ── MODALS ──
function openUpdate(no, cust){
  _curOrder={order_no:no, customer:cust};
  const o = getOrderWithUpdates(ORDERS.find(x=>String(x.order_no)===String(no)));
  document.getElementById('modal-order-info').innerHTML = `<b>${cust}</b><br>أمر: ${no} | الحالة الحالية: ${o.overall}`;
  document.getElementById('upd-status').value = o.overall;
  document.getElementById('upd-pct').value = o.pct||0;
  document.getElementById('pct-val').textContent = (o.pct||0)+'%';
  document.getElementById('upd-note').value='';
  document.getElementById('modal-update').classList.add('show');
}

function openIssue(no, cust){
  _curOrder={order_no:no, customer:cust};
  document.getElementById('issue-order-info').innerHTML = `<b>${cust}</b><br>أمر: ${no}`;
  document.getElementById('issue-desc').value='';
  document.getElementById('modal-issue').classList.add('show');
}

function openDelivery(no, cust){
  _curOrder={order_no:no, customer:cust};
  document.getElementById('del-order-info').innerHTML = `<b>${cust}</b><br>أمر: ${no}`;
  document.getElementById('del-note').value='';
  document.getElementById('modal-delivery').classList.add('show');
}

function closeModal(id){ document.getElementById(id).classList.remove('show'); }

function submitUpdate(){
  const upd = {
    type:'status', order_no:_curOrder.order_no, customer:_curOrder.customer,
    status: document.getElementById('upd-status').value,
    pct: parseInt(document.getElementById('upd-pct').value),
    note: document.getElementById('upd-note').value,
    by: U.name, ts: Date.now()
  };
  saveUpdate(upd);
  closeModal('modal-update');
  toast('✅ تم حفظ التحديث');
  renderTab(_tab);
}

function submitIssue(){
  const desc = document.getElementById('issue-desc').value;
  if(!desc){toast('اكتب وصف المشكلة');return;}
  const upd = {
    type:'issue', order_no:_curOrder.order_no, customer:_curOrder.customer,
    issue_type: document.getElementById('issue-type').value,
    severity: document.getElementById('issue-sev').value,
    note: desc, by: U.name, ts: Date.now()
  };
  saveUpdate(upd);
  closeModal('modal-issue');
  toast('⚠️ تم إرسال المشكلة للإدارة');
  renderTab(_tab);
}

function submitDelivery(){
  const upd = {
    type:'delivery', order_no:_curOrder.order_no, customer:_curOrder.customer,
    delivery_status: document.getElementById('del-status').value,
    note: document.getElementById('del-note').value,
    by: U.name, ts: Date.now()
  };
  saveUpdate(upd);
  closeModal('modal-delivery');
  toast('📦 تم تأكيد التوريد');
  renderTab(_tab);
}

function saveUpdate(upd){
  UPDATES.unshift(upd);
  localStorage.setItem(SK+'_updates', JSON.stringify(UPDATES));
  // Send to server
  if(API_URL && !API_URL.includes('PASTE')){
    fetch(API_URL+'?payload='+encodeURIComponent(JSON.stringify({action:'addUpdate',...upd}))).catch(()=>{});
  }
}

function loadUpdates(){
  if(API_URL && !API_URL.includes('PASTE')){
    fetch(API_URL+'?action=getUpdates').then(r=>r.json()).then(d=>{
      if(d.updates && d.updates.length){
        UPDATES = d.updates;
        localStorage.setItem(SK+'_updates', JSON.stringify(UPDATES));
        renderTab(_tab);
      }
    }).catch(()=>{});
  }
}

// ── HELPERS ──
function statusBadge(s){
  if(s==='Completed') return '<span class="badge b-green">✅ مكتمل</span>';
  if(s==='Being processed') return '<span class="badge b-blue">🔵 جارى</span>';
  if(s==='Stopped') return '<span class="badge b-red">🔴 متوقف</span>';
  return '<span class="badge b-orange">⏳ مفتوح</span>';
}
function deliveryBadge(d){
  if(d==='Fully delivered') return '<span class="badge b-green">📦 كامل</span>';
  if(d==='Partially delivered') return '<span class="badge b-orange">📦 جزئي</span>';
  return '<span class="badge b-red">📦 لم يورد</span>';
}
function tog(id){document.getElementById(id)?.classList.toggle('show')}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// Close modals on backdrop click
document.querySelectorAll('.modal-overlay').forEach(m=>{
  m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show')});
});
</script>
