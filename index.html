<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1565c0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حملة موبيكا">
<title>حملة موبيكا 🚐</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;background:#f0f4f8;color:#222;min-height:100vh}
/* LOGIN */
#pg-login{min-height:100vh;background:linear-gradient(160deg,#1565c0,#0d47a1);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.login-logo{font-size:60px;margin-bottom:12px}
.login-title{color:#fff;font-size:24px;font-weight:800;margin-bottom:4px}
.login-sub{color:rgba(255,255,255,.75);font-size:14px;margin-bottom:28px}
.login-box{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:360px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.lbl{font-size:13px;color:#555;font-weight:700;margin-bottom:8px;display:block}
.txt-inp{width:100%;padding:13px 14px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;font-family:inherit;margin-bottom:16px}
.txt-inp:focus{outline:none;border-color:#1565c0}
.choice-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.choice-btn{padding:12px 8px;border:2px solid #e0e0e0;border-radius:10px;background:#fff;font-size:13px;font-family:inherit;font-weight:600;color:#555;cursor:pointer;text-align:center;transition:all .15s}
.choice-btn.sel{border-color:#1565c0;background:#e3f2fd;color:#1565c0}
.choice-btn.full{grid-column:1/-1}
.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
#team-section{display:none}
.login-btn{width:100%;padding:14px;background:#1565c0;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
.login-btn:active{opacity:.85}
/* APP */
#pg-app{display:none;min-height:100vh;flex-direction:column}
.topbar{background:#1565c0;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.topbar-name{font-size:16px;font-weight:700}
.topbar-role{font-size:12px;opacity:.8;margin-top:2px}
.content{padding:16px;padding-bottom:90px;flex:1}
/* CARDS */
.card{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:16px;margin-bottom:14px}
.card-title{font-size:15px;font-weight:700;color:#1565c0;margin-bottom:14px;display:flex;align-items:center;gap:8px}
/* FORM */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:#555;font-weight:600;margin-bottom:6px}
.field select,.field input{width:100%;padding:12px 14px;border:2px solid #e0e0e0;border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:#222}
.field select:focus,.field input:focus{outline:none;border-color:#1565c0}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* BUTTONS */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:10px;font-size:15px;font-weight:700;font-family:inherit;border:none;cursor:pointer;width:100%;transition:opacity .15s}
.btn:active{opacity:.8}
.btn-blue{background:#1565c0;color:#fff}
.btn-green{background:#2e7d32;color:#fff}
.btn-orange{background:#f57c00;color:#fff}
.btn-outline{background:#fff;border:2px solid #1565c0;color:#1565c0}
.btn-sm{padding:9px 14px;font-size:13px;width:auto}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
/* TABS */
.tabs{display:flex;background:#fff;border-radius:12px;padding:4px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.tab{flex:1;text-align:center;padding:10px 4px;border-radius:9px;font-size:13px;font-weight:600;color:#999;cursor:pointer}
.tab.act{background:#1565c0;color:#fff}
/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:12px;padding:14px 8px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.stat-n{font-size:26px;font-weight:800;color:#1565c0}
.stat-l{font-size:11px;color:#888;margin-top:2px}
/* REQ CARD */
.req{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;border-right:4px solid #ddd;box-shadow:0 2px 6px rgba(0,0,0,.07)}
.req.pending{border-color:#f57c00}
.req.assigned{border-color:#2e7d32}
.req-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.req-team{font-weight:700;font-size:14px}
.req-route{font-size:13px;color:#555;margin-bottom:3px}
.req-info{font-size:12px;color:#888}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-p{background:#fff3e0;color:#e65100}
.badge-a{background:#e8f5e9;color:#2e7d32}
/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;box-shadow:0 -2px 8px rgba(0,0,0,.08);z-index:50}
.nav-i{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 12px;font-size:11px;color:#bbb;cursor:pointer}
.nav-i.act{color:#1565c0}
.nav-i span{font-size:22px;margin-bottom:2px}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-end}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:20px;width:100%;max-height:85vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:700;color:#1565c0;margin-bottom:14px}
/* EMPTY */
.empty{text-align:center;padding:36px 20px;color:#bbb}
.empty span{font-size:48px;display:block;margin-bottom:10px}
/* MERGE */
.merge-card{background:#fff8e1;border:2px solid #ffc107;border-radius:12px;padding:14px;margin-bottom:12px}
.before-after{display:flex;justify-content:space-around;align-items:center;margin:10px 0}
.ba-num{text-align:center}
.ba-big{font-size:32px;font-weight:900}
.ba-lbl{font-size:11px;color:#888}
.cap-wrap{background:#eee;border-radius:6px;height:9px;overflow:hidden;margin:6px 0}
.cap-bar{height:9px;border-radius:6px}
/* TOAST */
#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;z-index:200;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="pg-login">
  <div class="login-logo">🚐</div>
  <div class="login-title">حملة موبيكا</div>
  <div class="login-sub">إدارة نقل الفنيين</div>
  <div class="login-box">

    <!-- STEP 1: NAME -->
    <div id="step1">
      <label class="lbl">👤 اكتب اسمك</label>
      <input class="txt-inp" id="inp-name" type="text" placeholder="الاسم الكامل">
      <button class="login-btn" onclick="goStep2()">التالي ←</button>
    </div>

    <!-- STEP 2: ROLE -->
    <div id="step2" style="display:none">
      <label class="lbl">🎯 اختر دورك</label>
      <button class="choice-btn full" style="margin-bottom:10px;padding:16px" onclick="pickRole('engineer',this)">👷 مهندس / مدير مجموعة</button>
      <button class="choice-btn full" style="padding:16px" onclick="pickRole('fleet_manager',this)">🚐 مسؤول الحملة (عماد)</button>
    </div>

    <!-- STEP 3: TEAM -->
    <div id="step3" style="display:none">
      <label class="lbl">👥 اختر مجموعتك</label>
      <button class="choice-btn full" style="margin-bottom:10px;padding:14px" onclick="pickTeam('A — أحمد حسن',this)">مجموعة A — أحمد حسن</button>
      <button class="choice-btn full" style="margin-bottom:10px;padding:14px" onclick="pickTeam('B — سامى فؤاد',this)">مجموعة B — سامى فؤاد</button>
      <button class="choice-btn full" style="margin-bottom:10px;padding:14px" onclick="pickTeam('C — حازم قاعود',this)">مجموعة C — حازم قاعود</button>
      <button class="choice-btn full" style="padding:14px" onclick="pickTeam('D — هشام جمال',this)">مجموعة D — هشام جمال</button>
    </div>

  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="pg-app" style="display:none;flex-direction:column;min-height:100vh">
  <div class="topbar">
    <div>
      <div class="topbar-name" id="tb-name"></div>
      <div class="topbar-role" id="tb-role"></div>
    </div>
    <div style="font-size:13px;opacity:.8" id="tb-date"></div>
  </div>

  <!-- ENGINEER -->
  <div id="view-eng" class="content" style="display:none">
    <div class="card">
      <div class="card-title">➕ طلب نقل جديد</div>

      <div class="field">
        <label>المجموعة</label>
        <select id="e-team">
          <option value="">— اختر —</option>
          <option>A — أحمد حسن</option>
          <option>B — سامى فؤاد</option>
          <option>C — حازم قاعود</option>
          <option>D — هشام جمال</option>
        </select>
      </div>

      <div class="field-row">
        <div class="field">
          <label>مكان التحرك</label>
          <select id="e-from"><option value="">— اختر —</option></select>
        </div>
        <div class="field">
          <label>مكان الوصول</label>
          <select id="e-dest"><option value="">— اختر —</option></select>
        </div>
      </div>

      <div class="field">
        <label>عدد الأفراد</label>
        <input id="e-techs" type="number" min="1" placeholder="0" inputmode="numeric">
      </div>

      <button class="btn btn-blue" id="submit-btn" onclick="submitReq()">📤 إرسال الطلب</button>
    </div>

    <div class="card">
      <div class="card-title">📋 طلباتي اليوم</div>
      <div id="my-list"></div>
    </div>
  </div>

  <!-- FLEET MANAGER -->
  <div id="view-fm" class="content" style="display:none">
    <div class="stats">
      <div class="stat"><div class="stat-n" id="s-total">0</div><div class="stat-l">طلبات</div></div>
      <div class="stat"><div class="stat-n" id="s-pend">0</div><div class="stat-l">انتظار</div></div>
      <div class="stat"><div class="stat-n" id="s-done">0</div><div class="stat-l">محددة</div></div>
    </div>
    <div class="tabs">
      <div class="tab act" onclick="fmTab('reqs',this)">الطلبات</div>
      <div class="tab" onclick="fmTab('merge',this)">💡 تحسين</div>
      <div class="tab" onclick="fmTab('order',this)">📄 إيجار</div>
    </div>
    <div id="fm-reqs"></div>
    <div id="fm-merge" style="display:none"></div>
    <div id="fm-order" style="display:none">
      <div class="card">
        <div class="card-title">📄 أمر الإيجار</div>
        <div id="order-body"></div>
        <button class="btn btn-blue" style="margin-top:12px" onclick="printOrder()">🖨️ طباعة</button>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-i act" onclick="goHome(this)"><span>🏠</span>الرئيسية</div>
    <div class="nav-i" onclick="doRefresh(this)"><span>🔄</span>تحديث</div>
    <div class="nav-i" onclick="doLogout()"><span>🚪</span>خروج</div>
  </div>
</div>

<!-- ASSIGN MODAL -->
<div class="overlay" id="assign-modal">
  <div class="modal">
    <div class="modal-title">🔑 تحديد السيارة</div>
    <div id="assign-info" style="background:#f5f5f5;border-radius:8px;padding:10px;margin-bottom:14px;font-size:13px;line-height:1.6"></div>
    <div class="field"><label>رقم السيارة</label><input id="a-plate" type="text" placeholder="اللوحة"></div>
    <div class="field"><label>اسم السائق</label><input id="a-driver" type="text" placeholder="الاسم"></div>
    <div class="field">
      <label>نوع السيارة</label>
      <select id="a-type">
        <option value="sedan5">سيدان 5 راكب</option>
        <option value="suv7">SUV 7 راكب</option>
        <option value="micro14">ميكروباص 14 راكب</option>
      </select>
    </div>
    <div class="btn-row">
      <button class="btn btn-green" onclick="confirmAssign()">✅ تأكيد</button>
      <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ══ CONFIG ══
const API_URL = 'PASTE_APPS_SCRIPT_URL_HERE';

// ══ LOCATIONS ══
const LOCS = ['القاهرة','مدينة نصر','مصر الجديدة','المعادي','المقطم','حلوان','التجمع الأول','التجمع الخامس','القاهرة الجديدة','مدينتي','المستقبل سيتي','بدر','العبور','الشروق','الرحاب','الشيخ زايد','6 أكتوبر','السادس من أكتوبر','الحرم','فيصل','إمبابة','عين شمس','المطرية','شبرا','السلام','النزهة','العباسية','وسط البلد','الزمالك','المهندسين','الدقي','الجيزة','الهرم','10 رمضان','15 مايو','الإسكندرية','العجمي','المنتزه','محرم بك','سيدي بشر','ميامي','الجمرك','سيدي جابر','الرمل','أبوقير','برج العرب','القليوبية','بنها','شبرا الخيمة','المحلة الكبرى','طنطا','كفر الشيخ','المنصورة','دمياط','الزقازيق','بنى سويف','المنيا','أسيوط','سوهاج','قنا','الأقصر','أسوان','الفيوم','بورسعيد','الإسماعيلية','السويس','العريش','الغردقة','دمنهور','شبين الكوم','المنطقة الصناعية 6 أكتوبر','المنطقة الصناعية 10 رمضان','المنطقة الصناعية برج العرب','المنطقة الصناعية العبور'];

const CAR_CAP  = {sedan5:4, suv7:6, micro14:13};
const CAR_COST = {sedan5:1, suv7:1.5, micro14:2.2};
const CAR_LBL  = {sedan5:'سيدان 5 راكب', suv7:'SUV 7 راكب', micro14:'ميكروباص 14 راكب'};

// ══ STATE ══
let user = null;
let selectedRole = '';
let selectedTeam = '';
let reqs = [];
let assignIds = [];

// ══ INIT ══
// Clear old service workers
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
}

window.onload = function() {
  // Populate location selects
  ['e-from','e-dest'].forEach(id => {
    const sel = document.getElementById(id);
    LOCS.forEach(l => { const o = document.createElement('option'); o.value = o.textContent = l; sel.appendChild(o); });
  });
  // Date
  document.getElementById('tb-date').textContent = new Date().toLocaleDateString('ar-EG',{weekday:'short',day:'numeric',month:'short'});
  // Restore session
  try {
    const s = localStorage.getItem('fleet_u');
    if (s) { user = JSON.parse(s); launchApp(); }
  } catch(e) {}
};

// ══ LOGIN ══
function goStep2() {
  const name = (document.getElementById('inp-name').value||'').trim();
  if (!name) { alert('اكتب اسمك أولاً'); return; }
  document.getElementById('step1').style.display = 'none';
  document.getElementById('step2').style.display = '';
}

function pickRole(r, btn) {
  selectedRole = r;
  document.querySelectorAll('#step2 .choice-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  document.getElementById('step2').style.display = 'none';
  if (r === 'engineer') {
    document.getElementById('step3').style.display = '';
  } else {
    // fleet_manager — ادخل مباشرة
    const name = (document.getElementById('inp-name').value||'').trim() || 'مسؤول الحملة';
    user = { name, role: 'fleet_manager', team: '' };
    try { localStorage.setItem('fleet_u', JSON.stringify(user)); } catch(e){}
    launchApp();
  }
}

function pickTeam(t, btn) {
  selectedTeam = t;
  document.querySelectorAll('#step3 .choice-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  setTimeout(() => doLogin(), 200);
}

function doLogin() {
  const name = (document.getElementById('inp-name').value||'').trim();
  user = { name, role: selectedRole, team: selectedTeam };
  try { localStorage.setItem('fleet_u', JSON.stringify(user)); } catch(e){}
  launchApp();
}

function doLogout() {
  localStorage.removeItem('fleet_u');
  location.reload();
}

function launchApp() {
  document.getElementById('pg-login').style.display = 'none';
  document.getElementById('pg-app').style.display   = 'flex';
  document.getElementById('tb-name').textContent = user.name;
  document.getElementById('tb-role').textContent = user.role === 'engineer' ? ('مهندس — ' + user.team) : 'مسؤول الحملة';
  if (user.role === 'engineer') {
    document.getElementById('view-eng').style.display = '';
    if (user.team) document.getElementById('e-team').value = user.team;
    loadMyReqs();
  } else {
    document.getElementById('view-fm').style.display = '';
    loadAllReqs();
  }
}

// ══ ENGINEER ══
async function submitReq() {
  const team  = document.getElementById('e-team').value;
  const from  = document.getElementById('e-from').value;
  const dest  = document.getElementById('e-dest').value;
  const techs = parseInt(document.getElementById('e-techs').value)||0;
  if (!team)  return toast('✋ اختر المجموعة');
  if (!from)  return toast('✋ اختر مكان التحرك');
  if (!dest)  return toast('✋ اختر مكان الوصول');
  if (!techs) return toast('✋ أدخل عدد الأفراد');

  const btn = document.getElementById('submit-btn');
  btn.textContent = '⏳ جاري الإرسال...';
  btn.disabled = true;

  try {
    const r = await api('addRequest', { team, from_loc:from, dest, techs, created_by:user.name, date:todayStr() });
    if (r.ok) { toast('✅ تم الإرسال — سيُخطر عماد فوراً'); document.getElementById('e-techs').value=''; loadMyReqs(); }
    else toast('❌ ' + (r.error||'خطأ'));
  } catch(e) { toast('❌ تعذّر الاتصال'); }

  btn.textContent = '📤 إرسال الطلب';
  btn.disabled = false;
}

async function loadMyReqs() {
  const el = document.getElementById('my-list');
  el.innerHTML = '<div style="text-align:center;padding:20px;color:#bbb">⏳ جاري التحميل...</div>';
  try {
    const r = await apiGet('getRequests', {date:todayStr()});
    reqs = r.requests || [];
    const mine = reqs.filter(x => x.team === user.team || x.created_by === user.name);
    el.innerHTML = mine.length ? mine.map(x => reqHTML(x, false)).join('') : empty('لا توجد طلبات اليوم');
  } catch(e) { el.innerHTML = empty('تعذّر التحميل'); }
}

// ══ FLEET MANAGER ══
async function loadAllReqs() {
  document.getElementById('fm-reqs').innerHTML = '<div style="text-align:center;padding:24px;color:#bbb">⏳ جاري التحميل...</div>';
  try {
    const r = await apiGet('getRequests', {date:todayStr()});
    reqs = r.requests || [];
    renderStats(); renderReqs(); renderMerge(); renderOrder();
  } catch(e) { document.getElementById('fm-reqs').innerHTML = empty('تعذّر التحميل'); }
}

function renderStats() {
  document.getElementById('s-total').textContent = reqs.length;
  document.getElementById('s-pend').textContent  = reqs.filter(r=>r.status==='pending').length;
  document.getElementById('s-done').textContent  = reqs.filter(r=>r.status==='assigned').length;
}

function renderReqs() {
  const el = document.getElementById('fm-reqs');
  el.innerHTML = reqs.length ? reqs.map(r=>reqHTML(r,true)).join('') : empty('لا توجد طلبات اليوم');
}

function reqHTML(r, canAssign) {
  const isPend = r.status === 'pending';
  const badge  = isPend ? '<span class="badge badge-p">⏳ انتظار</span>' : '<span class="badge badge-a">✅ محدد</span>';
  const vehicle= !isPend ? `<div style="font-size:12px;color:#2e7d32;margin-top:4px">🔑 ${r.plate||''} — ${r.driver||''} (${CAR_LBL[r.car_type]||''})</div>` : '';
  const btn    = canAssign && isPend ? `<button class="btn btn-orange btn-sm" style="margin-top:10px" onclick="openAssign('${r.id}')">🔑 تحديد السيارة</button>` : '';
  return `<div class="req ${r.status||'pending'}">
    <div class="req-top"><div class="req-team">👷 ${r.team||'—'}</div>${badge}</div>
    <div class="req-route">📍 ${r.from_loc||'—'} ➜ ${r.dest||'—'}</div>
    <div class="req-info">👥 ${r.techs||0} فرد | ${r.created_by||'—'}</div>
    ${vehicle}${btn}
  </div>`;
}

// ══ ASSIGN ══
function openAssign(id) {
  const r = reqs.find(x=>x.id===id);
  if (!r) return;
  assignIds = [id];
  document.getElementById('assign-info').innerHTML = `👷 ${r.team}<br>📍 ${r.from_loc} ➜ ${r.dest}<br>👥 ${r.techs} فرد`;
  const t = parseInt(r.techs)||0;
  document.getElementById('a-type').value = t<=4?'sedan5':t<=6?'suv7':'micro14';
  document.getElementById('a-plate').value = '';
  document.getElementById('a-driver').value = '';
  document.getElementById('assign-modal').classList.add('open');
}

function openAssignGroup(ids, info) {
  assignIds = ids;
  document.getElementById('assign-info').innerHTML = info;
  document.getElementById('a-plate').value = '';
  document.getElementById('a-driver').value = '';
  document.getElementById('assign-modal').classList.add('open');
}

function closeModal() { document.getElementById('assign-modal').classList.remove('open'); }

async function confirmAssign() {
  const plate  = document.getElementById('a-plate').value.trim();
  const driver = document.getElementById('a-driver').value.trim();
  const type   = document.getElementById('a-type').value;
  if (!plate)  return toast('✋ أدخل رقم السيارة');
  if (!driver) return toast('✋ أدخل اسم السائق');
  try {
    const r = await api('assignVehicle', {ids:assignIds, plate, driver, car_type:type, car_type_label:CAR_LBL[type]});
    if (r.ok) { toast('✅ تم تحديد السيارة'); closeModal(); loadAllReqs(); }
    else toast('❌ ' + (r.error||'خطأ'));
  } catch(e) { toast('❌ تعذّر الاتصال'); }
}

// ══ MERGE ══
function renderMerge() {
  const el = document.getElementById('fm-merge');
  if (!reqs.length) { el.innerHTML = empty('لا توجد طلبات'); return; }

  // Group by from+dest
  const groups = [];
  reqs.forEach(r => {
    const g = groups.find(x => x.from===r.from_loc && x.dest===r.dest);
    if (g) { g.ids.push(r.id); g.techs += parseInt(r.techs)||0; g.rows.push(r); }
    else groups.push({ from:r.from_loc, dest:r.dest, ids:[r.id], techs:parseInt(r.techs)||0, rows:[r] });
  });

  const cards = groups.map((g,i) => {
    const costSep = g.rows.reduce((s,r) => s + bestFit(parseInt(r.techs)||0).cost, 0);
    const carsSep = g.rows.reduce((s,r) => s + bestFit(parseInt(r.techs)||0).count, 0);
    const best    = bestFit(g.techs);
    const saving  = Math.round((costSep - best.cost) / costSep * 100) || 0;
    const cap     = CAR_CAP[best.type];
    const pct     = Math.min(Math.round(g.techs/cap*100), 100);
    const col     = g.techs>cap ? '#c62828' : g.techs>cap*.8 ? '#f57c00' : '#2e7d32';
    const info    = `${g.rows.length} فريق — ${g.techs} فرد<br>📍 ${g.from||'—'} ➜ ${g.dest||'—'}`;
    return `<div class="merge-card">
      <div style="font-weight:700;font-size:14px;margin-bottom:8px">📍 ${g.from||'—'} ➜ ${g.dest||'—'}</div>
      <div style="font-size:12px;color:#555;margin-bottom:8px">${g.rows.map(r=>`👷 ${r.team} (${r.techs} فرد)`).join(' | ')}</div>
      <div class="before-after">
        <div class="ba-num"><div class="ba-big" style="color:#e65100">${carsSep}</div><div class="ba-lbl">منفردة</div></div>
        <div style="font-size:24px">→</div>
        <div class="ba-num"><div class="ba-big" style="color:#2e7d32">${best.count}</div><div class="ba-lbl">بعد الدمج</div></div>
      </div>
      <div style="font-size:13px;margin-bottom:6px">🚐 ${CAR_LBL[best.type]} | 👥 ${g.techs} فرد</div>
      <div class="cap-wrap"><div class="cap-bar" style="background:${col};width:${pct}%"></div></div>
      <div style="font-size:12px;color:${col};margin-bottom:10px">${g.techs}/${cap} مقعد</div>
      ${saving>0?`<div style="background:#2e7d32;color:#fff;display:inline-block;padding:3px 12px;border-radius:20px;font-size:12px;margin-bottom:10px">توفير ${saving}%</div>`:''}
      <button class="btn btn-orange btn-sm" onclick="openAssignGroup(${JSON.stringify(g.ids).replace(/"/g,"'")}, '${info.replace(/'/g,'').replace(/<br>/g,' | ')}')">🔑 تعيين سيارة للمجموعة</button>
    </div>`;
  });

  el.innerHTML = cards.join('') || empty('التوزيع مثالي ✅');
}

function bestFit(techs) {
  let best = {type:'micro14', count:Math.ceil(techs/13)||1, cost:0};
  best.cost = best.count * 2.2;
  ['sedan5','suv7','micro14'].forEach(t => {
    const c = Math.ceil(techs/CAR_CAP[t])||1;
    const ci = c * CAR_COST[t];
    if (ci < best.cost) best = {type:t, count:c, cost:ci};
  });
  return best;
}

  document.querySelectorAll('.nav-i').forEach(n=>n.classList.remove('act'));

// ══ API ══
async function api(action, data) {
  if (API_URL.includes('PASTE')) return demoPost(action, data);
  const r = await fetch(API_URL, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...data})});
  return r.json();
}
async function apiGet(action, params) {
  if (API_URL.includes('PASTE')) return demoGet(action, params);
  const q = new URLSearchParams({action,...params});
  const r = await fetch(API_URL+'?'+q);
  return r.json();
}

// DEMO mode
let _demo = JSON.parse(localStorage.getItem('demo')||'[]');
function saveDemo(){ localStorage.setItem('demo', JSON.stringify(_demo)); }
function demoPost(action, data) {
  if (action==='addRequest') {
    const id='R'+Date.now().toString(36).toUpperCase();
    _demo.push({id,status:'pending',created_at:new Date().toISOString(),...data});
    saveDemo(); return Promise.resolve({ok:true,id});
  }
  if (action==='assignVehicle') {
    (data.ids||[]).forEach(id=>{const r=_demo.find(x=>x.id===id);if(r){r.plate=data.plate;r.driver=data.driver;r.car_type=data.car_type;r.status='assigned';}});
    saveDemo(); return Promise.resolve({ok:true,updated:data.ids.length});
  }
  return Promise.resolve({ok:false});
}
function demoGet(action, params) {
  const list = _demo.filter(r => !params.date || r.date===params.date);
  return Promise.resolve({ok:true, requests:list});
}

// ══ UTILS ══
function todayStr(){ return new Date().toISOString().split('T')[0]; }
function empty(msg){ return `<div class="empty"><span>📭</span>${msg}</div>`; }
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.opacity='1';
  clearTimeout(el._t); el._t=setTimeout(()=>el.style.opacity='0',3000);
}
