<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1565c0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حملة موبيكا">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>حملة موبيكا 🚐</title>
<style>
:root {
  --primary: #1565c0;
  --primary-light: #e3f2fd;
  --success: #2e7d32;
  --warning: #f57c00;
  --danger: #c62828;
  --gray: #757575;
  --bg: #f5f5f5;
  --card: #ffffff;
  --radius: 12px;
  --shadow: 0 2px 8px rgba(0,0,0,.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: #222; min-height: 100vh; }

/* ── TOP BAR ── */
.topbar { background: var(--primary); color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
.topbar-title { font-size: 17px; font-weight: 700; }
.topbar-sub { font-size: 12px; opacity: .8; margin-top: 2px; }
.topbar-date { font-size: 12px; opacity: .75; text-align: left; }

/* ── CONTENT ── */
.content { padding: 16px; padding-bottom: 80px; max-width: 500px; margin: 0 auto; }

/* ── CARDS ── */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.card-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--primary); display: flex; align-items: center; gap: 8px; }

/* ── FORM ── */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 600; }
.field select, .field input { width: 100%; padding: 11px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 15px; font-family: inherit; background: #fff; color: #222; appearance: none; -webkit-appearance: none; }
.field select:focus, .field input:focus { outline: none; border-color: var(--primary); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ── BUTTONS ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 20px; border-radius: 8px; font-size: 15px; font-weight: 600; font-family: inherit; border: none; cursor: pointer; transition: opacity .15s; width: 100%; }
.btn:active { opacity: .75; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-success { background: var(--success); color: #fff; }
.btn-warning { background: var(--warning); color: #fff; }
.btn-danger  { background: var(--danger);  color: #fff; }
.btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
.btn-sm { padding: 8px 14px; font-size: 13px; width: auto; }
.btn-row { display: flex; gap: 8px; }

/* ── LOGIN ── */
#screen-login { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; background: linear-gradient(160deg, #1565c0 0%, #0d47a1 100%); }
.login-logo { font-size: 56px; margin-bottom: 12px; }
.login-title { color: #fff; font-size: 22px; font-weight: 800; margin-bottom: 4px; }
.login-sub { color: rgba(255,255,255,.75); font-size: 14px; margin-bottom: 32px; }
.login-card { background: #fff; border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.login-card .field label { color: #333; }
.login-card .btn { margin-top: 8px; }

/* ── REQUEST CARDS ── */
.req-card { background: var(--card); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; border-right: 4px solid #ddd; box-shadow: var(--shadow); }
.req-card.pending  { border-color: var(--warning); }
.req-card.assigned { border-color: var(--success); }
.req-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
.req-team { font-weight: 700; font-size: 14px; }
.req-route { font-size: 13px; color: #555; margin-bottom: 4px; }
.req-techs { font-size: 12px; color: #888; }

/* ── BADGE ── */
.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.badge-pending  { background: #fff3e0; color: #e65100; }
.badge-assigned { background: #e8f5e9; color: #2e7d32; }
.badge-blue     { background: #e3f2fd; color: #1565c0; }

/* ── TABS ── */
.tabs { display: flex; background: #fff; border-radius: 10px; padding: 4px; margin-bottom: 16px; box-shadow: var(--shadow); }
.tab { flex: 1; text-align: center; padding: 9px 6px; border-radius: 8px; font-size: 13px; font-weight: 600; color: #888; cursor: pointer; transition: all .2s; }
.tab.active { background: var(--primary); color: #fff; }

/* ── STATS ── */
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.stat { background: var(--card); border-radius: 10px; padding: 12px; text-align: center; box-shadow: var(--shadow); }
.stat-val { font-size: 24px; font-weight: 800; color: var(--primary); }
.stat-lbl { font-size: 11px; color: #888; margin-top: 2px; }

/* ── MERGE BOX ── */
.merge-box { background: #fff8e1; border: 1.5px solid #ffc107; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.merge-box-title { font-weight: 700; font-size: 14px; margin-bottom: 8px; color: #e65100; }

/* ── CAPACITY BAR ── */
.cap-bar-wrap { background: #eee; border-radius: 6px; height: 8px; margin: 6px 0; overflow: hidden; }
.cap-bar { height: 8px; border-radius: 6px; transition: width .3s; }

/* ── EMPTY STATE ── */
.empty { text-align: center; padding: 40px 20px; color: #aaa; }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-size: 14px; }

/* ── LOADING ── */
.spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── TOAST ── */
#toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity .3s; z-index: 999; white-space: nowrap; pointer-events: none; }

/* ── BOTTOM NAV ── */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #eee; display: flex; z-index: 100; box-shadow: 0 -2px 8px rgba(0,0,0,.08); }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 6px 8px; font-size: 11px; color: #aaa; cursor: pointer; transition: color .2s; }
.nav-item.active { color: var(--primary); }
.nav-icon { font-size: 22px; margin-bottom: 2px; }

/* ── MODAL ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; display: flex; align-items: flex-end; }
.modal { background: #fff; border-radius: 16px 16px 0 0; padding: 20px; width: 100%; max-height: 90vh; overflow-y: auto; }
.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: var(--primary); }
.modal-close { float: left; background: none; border: none; font-size: 22px; cursor: pointer; color: #888; }

/* ── SUGGESTION CARD ── */
.sugg-card { background: #e8f5e9; border-radius: 10px; padding: 12px; margin-bottom: 10px; border: 1.5px solid #a5d6a7; }
.sugg-before-after { display: flex; align-items: center; justify-content: space-around; margin: 8px 0; }
.sugg-num { text-align: center; }
.sugg-num .big { font-size: 28px; font-weight: 900; }
.sugg-num .lbl { font-size: 11px; color: #777; }
.sugg-arrow { font-size: 22px; color: #2e7d32; }

/* screens */
.screen { display: none; }
.screen.active { display: block; }
#screen-login.active { display: flex; }
</style>
</head>
<body>

<!-- ══════════ LOGIN ══════════ -->
<div id="screen-login" class="screen active">
  <div class="login-logo">🚐</div>
  <div class="login-title">حملة موبيكا</div>
  <div class="login-sub">إدارة نقل الفنيين</div>
  <div class="login-card">
    <div class="field">
      <label>الاسم</label>
      <input id="login-name" type="text" placeholder="اكتب اسمك">
    </div>
    <div class="field">
      <label>الدور</label>
      <select id="login-role">
        <option value="">— اختر —</option>
        <option value="engineer">مهندس / مدير مجموعة</option>
        <option value="fleet_manager">مسؤول الحملة (عماد)</option>
      </select>
    </div>
    <div class="field" id="login-team-wrap" style="display:none">
      <label>المجموعة</label>
      <select id="login-team">
        <option value="">— اختر —</option>
        <option value="A — أحمد حسن">مجموعة A — أحمد حسن</option>
        <option value="B — سامى فؤاد">مجموعة B — سامى فؤاد</option>
        <option value="C — حازم قاعود">مجموعة C — حازم قاعود</option>
        <option value="D — هشام جمال">مجموعة D — هشام جمال</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="doLogin()">دخول</button>
  </div>
</div>

<!-- ══════════ MAIN APP ══════════ -->
<div id="screen-app" class="screen">
  <div class="topbar">
    <div>
      <div class="topbar-title">🚐 حملة موبيكا</div>
      <div class="topbar-sub" id="topbar-user"></div>
    </div>
    <div class="topbar-date" id="topbar-date"></div>
  </div>

  <!-- Engineer View -->
  <div id="view-engineer" style="display:none">
    <div class="content">
      <!-- Add Request -->
      <div class="card" id="card-add-req">
        <div class="card-title">➕ طلب نقل جديد</div>
        <div class="field">
          <label>المجموعة</label>
          <select id="req-team">
            <option value="">— اختر —</option>
            <option value="A — أحمد حسن">مجموعة A — أحمد حسن</option>
            <option value="B — سامى فؤاد">مجموعة B — سامى فؤاد</option>
            <option value="C — حازم قاعود">مجموعة C — حازم قاعود</option>
            <option value="D — هشام جمال">مجموعة D — هشام جمال</option>
          </select>
        </div>
        <div class="field-row">
          <div class="field">
            <label>مكان التحرك</label>
            <select id="req-from"><option value="">— اختر —</option></select>
          </div>
          <div class="field">
            <label>مكان الوصول</label>
            <select id="req-dest"><option value="">— اختر —</option></select>
          </div>
        </div>
        <div class="field">
          <label>عدد الأفراد</label>

        </button>

      <!-- Today's Requests -->

        <div class="card-title">📋 طلباتي اليوم</div>

    </div>
  </div>

  <!-- Fleet Manager View (عماد) -->
  <div id="view-fleet-manager" style="display:none">
    <div class="content">
      <!-- Stats -->
      <div class="stats" id="fm-stats">
        <div class="stat"><div class="stat-val" id="st-total">0</div><div class="stat-lbl">طلبات</div></div>
        <div class="stat"><div class="stat-val" id="st-pending">0</div><div class="stat-lbl">انتظار</div></div>
        <div class="stat"><div class="stat-val" id="st-assigned">0</div><div class="stat-lbl">محددة</div></div>

      <!-- Tabs -->
      <div class="tabs">
        <div class="tab active" onclick="fmTab('requests',this)">الطلبات</div>
        <div class="tab" onclick="fmTab('merge',this)">💡 تحسين</div>

      <!-- Tab: Requests -->
      <div id="fm-tab-requests">
        <div id="fm-requests-list"></div>
      </div>

      <!-- Tab: Merge -->
      <div id="fm-tab-merge" style="display:none">
        <div id="merge-content"></div>
      </div>

      <!-- Tab: Order -->
      <div id="fm-tab-order" style="display:none">
        <div class="card">
          <div class="card-title">📄 أمر الإيجار</div>
          <div id="order-preview"></div>
          <button class="btn btn-primary" style="margin-top:12px" onclick="printOrder()">🖨️ طباعة</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav" id="bottom-nav" style="display:none">
    <div class="nav-item active" onclick="navTo('home',this)" id="nav-home">
      <div class="nav-icon">🏠</div>الرئيسية
    </div>
    <div class="nav-item" onclick="navTo('refresh',this)">
      <div class="nav-icon">🔄</div>تحديث
    </div>
    <div class="nav-item" onclick="doLogout()">
      <div class="nav-icon">🚪</div>خروج
    </div>
  </div>
</div>

<!-- ══════════ ASSIGN MODAL ══════════ -->
<div id="assign-modal" class="modal-overlay" style="display:none" onclick="closeAssignModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeAssignModal()">✕</button>
    <div class="modal-title">🔑 تحديد السيارة</div>
    <div id="assign-req-info" style="background:#f5f5f5;border-radius:8px;padding:10px;margin-bottom:14px;font-size:13px"></div>
    <div class="field">
      <label>رقم السيارة</label>
      <input id="assign-plate" type="text" placeholder="اللوحة">
    </div>
    <div class="field">
      <label>اسم السائق</label>
      <input id="assign-driver" type="text" placeholder="الاسم الكامل">
    </div>
    <div class="field">
      <label>نوع السيارة</label>
      <select id="assign-type">
        <option value="sedan5">سيدان 5 راكب</option>
        <option value="suv7">SUV 7 راكب</option>
        <option value="micro14">ميكروباص 14 راكب</option>
      </select>
    </div>
    <button class="btn btn-success" onclick="confirmAssign()">✅ تأكيد</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════
// CONFIG — ضع هنا الـ URL بعد deploy الـ Apps Script
// ══════════════════════════════════════════════════════════
const API_URL = 'PASTE_APPS_SCRIPT_URL_HERE';

// ══════════════════════════════════════════════════════════
// EGYPT LOCATIONS
// ══════════════════════════════════════════════════════════
const LOCATIONS = [
  'القاهرة','مدينة نصر','مصر الجديدة','هليوبوليس','المعادي','المقطم','حلوان',
  'التجمع الأول','التجمع الخامس','القاهرة الجديدة','مدينتي','المستقبل سيتي',
  'بدر','العبور','الشروق','الرحاب','الشيخ زايد','6 أكتوبر','السادس من أكتوبر',
  'الحرم','فيصل','إمبابة','المنيل','عين شمس','المطرية','شبرا','السلام',
  'النزهة','العباسية','وسط البلد','الزمالك','المهندسين','الدقي','الجيزة',
  'الهرم','المنصورية','أوسيم','كرداسة','10 رمضان','15 مايو',
  'الإسكندرية','العجمي','المنتزه','محرم بك','سيدي بشر','المندرة','ميامي',
  'الجمرك','سيدي جابر','الرمل','أبوقير','برج العرب',
  'القليوبية','بنها','شبرا الخيمة','المحلة الكبرى','طنطا','كفر الشيخ',
  'المنصورة','دمياط','الزقازيق','بنى سويف','المنيا','أسيوط',
  'سوهاج','قنا','الأقصر','أسوان','الفيوم',
  'بورسعيد','الإسماعيلية','السويس','العريش',
  'الغردقة','دمنهور','شبين الكوم',
  'المنطقة الصناعية — 6 أكتوبر','المنطقة الصناعية — العاشر من رمضان',
  'المنطقة الصناعية — برج العرب','المنطقة الصناعية — العبور',
];

const CAR_CAPS  = { sedan5:4, suv7:6, micro14:13 };
const CAR_COST  = { sedan5:1, suv7:1.5, micro14:2.2 };
const CAR_LABEL = { sedan5:'سيدان 5 راكب', suv7:'SUV 7 راكب', micro14:'ميكروباص 14 راكب' };

// ══════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════
let currentUser = null; // { name, role, team }
let allRequests = [];
let assignTarget = []; // IDs being assigned

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  // Populate location selects
  ['req-from','req-dest'].forEach(id => {
    const sel = document.getElementById(id);
    LOCATIONS.forEach(l => {
      const o = document.createElement('option');
      o.value = o.textContent = l;
      sel.appendChild(o);
    });
  });

  // Role change → show/hide team
  document.getElementById('login-role').addEventListener('change', function() {
    document.getElementById('login-team-wrap').style.display =
      this.value === 'engineer' ? '' : 'none';
  });

  // Date
  document.getElementById('topbar-date').textContent =
    new Date().toLocaleDateString('ar-EG', {weekday:'short',day:'numeric',month:'long'});

  // Restore session
  const saved = localStorage.getItem('fleet_user');
  if (saved) { currentUser = JSON.parse(saved); initApp(); }
});

// ══════════════════════════════════════════════════════════
// LOGIN / LOGOUT
// ══════════════════════════════════════════════════════════
function doLogin() {
  const name = document.getElementById('login-name').value.trim();
  const role = document.getElementById('login-role').value;
  const team = document.getElementById('login-team').value;
  if (!name) return toast('أدخل اسمك');
  if (!role) return toast('اختر الدور');
  if (role === 'engineer' && !team) return toast('اختر المجموعة');
  currentUser = { name, role, team };
  localStorage.setItem('fleet_user', JSON.stringify(currentUser));
  initApp();
}

function doLogout() {
  localStorage.removeItem('fleet_user');
  location.reload();
}

function initApp() {
  show('screen-login', false);
  show('screen-app', true);
  document.getElementById('topbar-user').textContent =
    currentUser.name + (currentUser.team ? ' — ' + currentUser.team : '');
  document.getElementById('bottom-nav').style.display = 'flex';
  if (currentUser.role === 'engineer') {
    show('view-engineer', true);
    if (currentUser.team) document.getElementById('req-team').value = currentUser.team;
    loadMyRequests();
  } else {
    show('view-fleet-manager', true);
    loadAllRequests();
  }
}

// ══════════════════════════════════════════════════════════
// ENGINEER
// ══════════════════════════════════════════════════════════
async function submitRequest() {
  const team  = document.getElementById('req-team').value;
  const from  = document.getElementById('req-from').value;
  const dest  = document.getElementById('req-dest').value;
  const techs = parseInt(document.getElementById('req-techs').value) || 0;
  const notes = document.getElementById('req-notes').value;

  if (!team)  return toast('اختر المجموعة');
  if (!from)  return toast('اختر مكان التحرك');
  if (!dest)  return toast('اختر مكان الوصول');
  if (!techs) return toast('أدخل عدد الأفراد');

  const btn = document.getElementById('btn-submit-req');
  btn.innerHTML = '<div class="spinner"></div>';
  btn.disabled = true;

  try {
    const res = await api('addRequest', {
      team, from_loc: from, dest, techs,
      notes, created_by: currentUser.name,
      date: todayStr()
    });
    if (res.ok) {
      toast('✅ تم إرسال الطلب — سيُخطر عماد فوراً');
      document.getElementById('req-techs').value = '';
      document.getElementById('req-notes').value = '';
      document.getElementById('req-from').value = '';
      document.getElementById('req-dest').value = '';
      loadMyRequests();
    } else {
      toast('❌ خطأ: ' + (res.error || 'حاول تاني'));
    }
  } catch(e) {
    toast('❌ تعذّر الاتصال — تحقق من النت');
  }

  btn.innerHTML = '📤 إرسال الطلب';
  btn.disabled = false;
}

async function loadMyRequests() {
  const el = document.getElementById('my-requests-list');
  el.innerHTML = '<div style="text-align:center;padding:20px;color:#aaa"><div class="spinner" style="border-color:#ddd;border-top-color:#1565c0;margin:auto"></div></div>';
  try {
    const res = await apiGet('getRequests', { date: todayStr() });
    allRequests = res.requests || [];
    const mine = allRequests.filter(r => r.team === currentUser.team || r.created_by === currentUser.name);
    if (!mine.length) {
      el.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">لا توجد طلبات اليوم</div></div>';
      return;
    }
    el.innerHTML = mine.map(r => reqCard(r, false)).join('');
  } catch(e) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">تعذّر تحميل الطلبات</div></div>';
  }
}

// ══════════════════════════════════════════════════════════
// FLEET MANAGER
// ══════════════════════════════════════════════════════════
async function loadAllRequests() {
  const el = document.getElementById('fm-requests-list');
  el.innerHTML = '<div style="text-align:center;padding:20px"><div class="spinner" style="border-color:#ddd;border-top-color:#1565c0;margin:auto"></div></div>';
  try {
    const res = await apiGet('getRequests', { date: todayStr() });
    allRequests = res.requests || [];
    updateStats();
    renderFmRequests();
    renderMergeSuggestions();
    renderOrderPreview();
  } catch(e) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">تعذّر تحميل البيانات</div></div>';
  }
}

function updateStats() {
  const total    = allRequests.length;
  const pending  = allRequests.filter(r => r.status === 'pending').length;
  const assigned = allRequests.filter(r => r.status === 'assigned').length;
  document.getElementById('st-total').textContent    = total;
  document.getElementById('st-pending').textContent  = pending;
  document.getElementById('st-assigned').textContent = assigned;
}

function renderFmRequests() {
  const el = document.getElementById('fm-requests-list');
  if (!allRequests.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">لا توجد طلبات اليوم</div></div>';
    return;
  }
  el.innerHTML = allRequests.map(r => reqCard(r, true)).join('');
}

function reqCard(r, canAssign) {
  const isPending  = r.status === 'pending';
  const badge = isPending
    ? '<span class="badge badge-pending">⏳ انتظار</span>'
    : '<span class="badge badge-assigned">✅ محدد</span>';
  const vehicle = !isPending
    ? `<div style="font-size:12px;color:#2e7d32;margin-top:4px">🔑 ${r.plate} — ${r.driver} (${CAR_LABEL[r.car_type]||r.car_type})</div>`
    : '';
  const assignBtn = canAssign && isPending
    ? `<button class="btn btn-warning btn-sm" style="margin-top:8px" onclick="openAssignModal('${r.id}')">🔑 تحديد السيارة</button>`
    : '';
  return `<div class="req-card ${r.status}">
    <div class="req-header">
      <div class="req-team">👷 ${r.team||'—'}</div>
      ${badge}
    </div>
    <div class="req-route">📍 ${r.from_loc||'—'} ➜ ${r.dest||'—'}</div>
    <div class="req-techs">👥 ${r.techs} فرد &nbsp;|&nbsp; 👤 ${r.created_by||'—'}</div>
    ${vehicle}
    ${assignBtn}
  </div>`;
}

// ── Assign Modal ──────────────────────────────────────────
function openAssignModal(id) {
  const r = allRequests.find(x => x.id === id);
  if (!r) return;
  assignTarget = [id];
  document.getElementById('assign-req-info').innerHTML =
    `👷 ${r.team} &nbsp;|&nbsp; 📍 ${r.from_loc} ➜ ${r.dest} &nbsp;|&nbsp; 👥 ${r.techs} فرد`;
  // suggest car type
  const t = parseInt(r.techs)||0;
  const type = t<=4?'sedan5': t<=6?'suv7':'micro14';
  document.getElementById('assign-type').value = type;
  document.getElementById('assign-plate').value  = '';
  document.getElementById('assign-driver').value = '';
  document.getElementById('assign-modal').style.display = 'flex';
}

function openAssignModalGroup(ids) {
  assignTarget = ids;
  const grouped = allRequests.filter(r => ids.includes(r.id));
  const totalTechs = grouped.reduce((s,r)=>s+(parseInt(r.techs)||0),0);
  const type = totalTechs<=4?'sedan5': totalTechs<=6?'suv7':'micro14';
  document.getElementById('assign-req-info').innerHTML =
    `${grouped.length} طلبات مدمجة &nbsp;|&nbsp; 👥 ${totalTechs} فرد إجمالاً`;
  document.getElementById('assign-type').value = type;
  document.getElementById('assign-plate').value  = '';
  document.getElementById('assign-driver').value = '';
  document.getElementById('assign-modal').style.display = 'flex';
}

function closeAssignModal(e) {
  if (e && e.target !== document.getElementById('assign-modal')) return;
  document.getElementById('assign-modal').style.display = 'none';
}

async function confirmAssign() {
  const plate  = document.getElementById('assign-plate').value.trim();
  const driver = document.getElementById('assign-driver').value.trim();
  const type   = document.getElementById('assign-type').value;
  if (!plate)  return toast('أدخل رقم السيارة');
  if (!driver) return toast('أدخل اسم السائق');
  try {
    const res = await api('assignVehicle', {
      ids: assignTarget, plate, driver,
      car_type: type, car_type_label: CAR_LABEL[type]
    });
    if (res.ok) {
      toast(`✅ تم تحديد السيارة — ${plate} / ${driver}`);
      document.getElementById('assign-modal').style.display = 'none';
      loadAllRequests();
    } else { toast('❌ ' + (res.error||'حاول تاني')); }
  } catch(e) { toast('❌ تعذّر الاتصال'); }
}

// ── Merge / Optimize ──────────────────────────────────────
function renderMergeSuggestions() {
  const el = document.getElementById('merge-content');
  if (!allRequests.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">لا توجد طلبات</div></div>';
    return;
  }

  // Group by same from+dest
  const groups = [];
  allRequests.forEach(r => {
    const match = groups.find(g =>
      g.from === r.from_loc && g.dest === r.dest
    );
    if (match) { match.ids.push(r.id); match.techs += parseInt(r.techs)||0; }
    else groups.push({ from:r.from_loc, dest:r.dest, ids:[r.id], techs:parseInt(r.techs)||0 });
  });

  const suggestions = [];
  groups.forEach(g => {
    const rows = allRequests.filter(r => g.ids.includes(r.id));
    const costSep = rows.reduce((s,r) => {
      const t = parseInt(r.techs)||0;
      return s + cheapestFit(t).costIndex;
    }, 0);
    const carsSep = rows.reduce((s,r) => s + cheapestFit(parseInt(r.techs)||0).count, 0);
    const best = cheapestFit(g.techs);
    const saving = costSep - best.costIndex;
    if (saving > 0.05 || carsSep > best.count) {
      suggestions.push({ ...g, carsSep, carsMerged:best.count, typeMerged:best.type, savingPct: Math.round(saving/costSep*100)||0 });
    }
  });

  if (!suggestions.length) {
    el.innerHTML = '<div class="card"><div style="text-align:center;padding:16px;color:#2e7d32;font-weight:700">✅ التوزيع الحالي مثالي — لا يوجد توفير ممكن</div></div>';
    return;
  }

  el.innerHTML = suggestions.map((s,i) => {
    const cap = CAR_CAPS[s.typeMerged];
    const pct = Math.min(Math.round(s.techs/cap*100),100);
    const col = s.techs>cap?'#c62828': s.techs>cap*0.8?'#f57c00':'#2e7d32';
    return `<div class="sugg-card">
      <div class="merge-box-title">💡 ${s.from||'—'} ➜ ${s.dest||'—'}</div>
      <div class="sugg-before-after">
        <div class="sugg-num">
          <div class="big" style="color:#e65100">${s.carsSep}</div>
          <div class="lbl">سيارات منفردة</div>
        </div>
        <div class="sugg-arrow">→</div>
        <div class="sugg-num">
          <div class="big" style="color:#2e7d32">${s.carsMerged}</div>
          <div class="lbl">بعد الدمج</div>
        </div>
      </div>
      <div style="font-size:13px;margin-bottom:6px">🚐 ${CAR_LABEL[s.typeMerged]} &nbsp;|&nbsp; 👥 ${s.techs} فرد</div>
      <div class="cap-bar-wrap"><div class="cap-bar" style="background:${col};width:${pct}%"></div></div>
      <div style="font-size:12px;color:${col};margin-bottom:10px">${s.techs}/${cap} مقعد</div>
      ${s.savingPct>0?`<div style="background:#2e7d32;color:#fff;display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;margin-bottom:10px">وفّر ${s.savingPct}% من التكلفة</div>`:''}
      <button class="btn btn-success btn-sm" onclick="applyGroupAssign(${i})">🔑 تعيين سيارة للمجموعة</button>
    </div>`;
  }).join('');

  // store for onclick
  window._suggestions = suggestions;
}

function applyGroupAssign(i) {
  const s = window._suggestions[i];
  if (!s) return;
  openAssignModalGroup(s.ids);
}

function cheapestFit(techs) {
  const n = Math.max(techs, 0);
  let best = { type:'micro14', count:Math.ceil(n/13), costIndex:Math.ceil(n/13)*2.2 };
  ['sedan5','suv7','micro14'].forEach(t => {
    const c = Math.ceil(n/CAR_CAPS[t]);
    const ci = c * CAR_COST[t];
    if (ci < best.costIndex) best = { type:t, count:c, costIndex:ci };
  });
  return best;
}

// ══════════════════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════════════════
function fmTab(name, el) {
  ['requests','merge','order'].forEach(t => {
    document.getElementById('fm-tab-'+t).style.display = t===name?'':'none';
  });
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  if (name==='merge') renderMergeSuggestions();
  if (name==='order') renderOrderPreview();
}

function navTo(action, el) {
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  if (action==='refresh') {
    currentUser.role==='engineer' ? loadMyRequests() : loadAllRequests();
    setTimeout(()=>el.classList.remove('active'),500);
  }
}

// ══════════════════════════════════════════════════════════
// API
// ══════════════════════════════════════════════════════════
async function api(action, data) {
  if (API_URL === 'PASTE_APPS_SCRIPT_URL_HERE') {
    // DEMO MODE — محاكاة محلية
    return demoApi(action, data);
  }
  const r = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action, ...data })
  });
  return r.json();
}

async function apiGet(action, params={}) {
  if (API_URL === 'PASTE_APPS_SCRIPT_URL_HERE') return demoApiGet(action, params);
  const q = new URLSearchParams({ action, ...params });
  const r = await fetch(API_URL + '?' + q);
  return r.json();
}

// ── Demo Mode (بدون Apps Script) ─────────────────────────
let demoData = JSON.parse(localStorage.getItem('demo_requests')||'[]');
function saveDemoData() { localStorage.setItem('demo_requests', JSON.stringify(demoData)); }

function demoApi(action, data) {
  if (action==='addRequest') {
    const id = 'R'+Date.now().toString(36).toUpperCase();
    demoData.push({ id, status:'pending', created_at:new Date().toISOString(), ...data });
    saveDemoData();
    return Promise.resolve({ ok:true, id });
  }
  if (action==='assignVehicle') {
    (data.ids||[]).forEach(id => {
      const r = demoData.find(x=>x.id===id);
      if (r) { r.plate=data.plate; r.driver=data.driver; r.car_type=data.car_type; r.status='assigned'; }
    });
    saveDemoData();
    return Promise.resolve({ ok:true, updated:(data.ids||[]).length });
  }
  return Promise.resolve({ ok:false, error:'unknown' });
}

function demoApiGet(action, params) {
  if (action==='getRequests') {
    const reqs = demoData.filter(r => !params.date || r.date===params.date);
    return Promise.resolve({ ok:true, requests:reqs });
  }
  return Promise.resolve({ ok:true, requests:[] });
}

// ══════════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════════
function show(id, val) {
  const el = document.getElementById(id);
  if (!el) return;
  if (val) el.classList.add('active');
  else     el.classList.remove('active');
}

function todayStr() {
  return new Date().toISOString().split('T')[0];
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.opacity='0', 3000);
}

// ── PWA Service Worker ─────────────────────────────────────
if ('serviceWorker' in navigator) {
  const sw = `
    const CACHE = 'fleet-v1';
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(['/'])));
      self.skipWaiting();
    });
    self.addEventListener('fetch', e => {
      e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
    });`;
  const blob = new Blob([sw], {type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
