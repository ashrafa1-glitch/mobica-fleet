<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1565c0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حملة موبيكا">
<title>حملة موبيكا</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,Tahoma,sans-serif;background:#eef2f7;min-height:100vh;color:#1a1a2e}
/* Login */
.login-wrap{min-height:100vh;background:linear-gradient(160deg,#1565c0,#0d47a1);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.login-icon{font-size:64px;margin-bottom:10px}
.login-h{color:#fff;font-size:26px;font-weight:800}
.login-s{color:rgba(255,255,255,.7);font-size:14px;margin-bottom:28px}
.box{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.box-title{font-size:15px;font-weight:700;color:#555;margin-bottom:14px}
.inp{width:100%;padding:14px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;font-family:inherit;margin-bottom:4px}
.inp:focus{outline:none;border-color:#1565c0}
.big-btn{display:block;width:100%;padding:15px;border:2px solid #e0e0e0;border-radius:12px;background:#fff;font-size:15px;font-family:inherit;font-weight:600;color:#444;cursor:pointer;text-align:center;margin-bottom:10px}
.big-btn:last-child{margin-bottom:0}
.big-btn.sel{border-color:#1565c0;background:#e8f0fe;color:#1565c0}
.go-btn{width:100%;padding:15px;background:#1565c0;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:14px}
.go-btn:active{opacity:.85}
/* App */
.topbar{background:#1565c0;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.tb-l{font-size:17px;font-weight:700}
.tb-s{font-size:12px;opacity:.8;margin-top:1px}
.tb-r{font-size:12px;opacity:.7}
.content{padding:14px;padding-bottom:85px}
/* Cards */
.card{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:16px;margin-bottom:12px}
.ct{font-size:15px;font-weight:700;color:#1565c0;margin-bottom:14px}
/* Form fields */
.fl{margin-bottom:13px}
.fl label{display:block;font-size:13px;color:#666;font-weight:600;margin-bottom:5px}
.fl select,.fl input{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:10px;font-size:15px;font-family:inherit;background:#fff}
.fl select:focus,.fl input:focus{outline:none;border-color:#1565c0}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px;border-radius:10px;font-size:15px;font-weight:700;font-family:inherit;border:none;cursor:pointer;width:100%}
.btn:active{opacity:.8}
.b-blue{background:#1565c0;color:#fff}
.b-green{background:#2e7d32;color:#fff}
.b-orange{background:#e65100;color:#fff}
.b-out{background:#fff;border:2px solid #1565c0;color:#1565c0}
.b-sm{padding:9px 14px;font-size:13px;width:auto}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:#fff;border-radius:12px;padding:13px 8px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.07)}
.sn{font-size:26px;font-weight:800;color:#1565c0}
.sl{font-size:11px;color:#999;margin-top:2px}
/* Tabs */
.tabs{display:flex;background:#fff;border-radius:12px;padding:4px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.07)}
.tab{flex:1;text-align:center;padding:10px 4px;border-radius:9px;font-size:13px;font-weight:600;color:#aaa;cursor:pointer}
.tab.on{background:#1565c0;color:#fff}
/* Request cards */
.rq{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;border-right:4px solid #ddd;box-shadow:0 2px 6px rgba(0,0,0,.07)}
.rq.pending{border-color:#f57c00}
.rq.assigned{border-color:#2e7d32}
.rq-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px}
.rq-team{font-weight:700;font-size:14px}
.rq-route{font-size:13px;color:#555;margin-bottom:3px}
.rq-sub{font-size:12px;color:#999}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.bp{background:#fff3e0;color:#e65100}
.ba{background:#e8f5e9;color:#2e7d32}
/* Merge */
.mc{background:#fff8e1;border:2px solid #ffc107;border-radius:12px;padding:14px;margin-bottom:12px}
.mc-title{font-weight:700;font-size:14px;color:#e65100;margin-bottom:8px}
.ba-row{display:flex;justify-content:space-around;align-items:center;margin:10px 0}
.ba-num{text-align:center}
.ba-big{font-size:32px;font-weight:900}
.ba-lbl{font-size:11px;color:#999}
.cap-bg{background:#e0e0e0;border-radius:6px;height:8px;overflow:hidden;margin:5px 0}
.cap-fill{height:8px;border-radius:6px}
/* Bottom nav */
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;box-shadow:0 -2px 8px rgba(0,0,0,.08);z-index:50}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 12px;font-size:11px;color:#ccc;cursor:pointer}
.ni.on{color:#1565c0}
.ni-ic{font-size:22px;margin-bottom:2px}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-end}
.ov.open{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:20px;width:100%;max-height:88vh;overflow-y:auto}
.mt{font-size:16px;font-weight:700;color:#1565c0;margin-bottom:14px}
/* Empty */
.empty{text-align:center;padding:32px;color:#ccc;font-size:14px}
/* Toast */
#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 22px;border-radius:22px;font-size:13px;opacity:0;transition:opacity .3s;z-index:300;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
</style>
</head>
<body>

<div id="root"></div>
<div class="ov" id="amodal">
  <div class="modal">
    <div class="mt">🔑 تحديد السيارة</div>
    <div id="ainfo" style="background:#f5f5f5;border-radius:8px;padding:10px;margin-bottom:14px;font-size:13px;line-height:1.7"></div>
    <div class="fl"><label>رقم السيارة</label><input id="aplate" type="text" placeholder="اللوحة"></div>
    <div class="fl"><label>اسم السائق</label><input id="adriver" type="text" placeholder="الاسم"></div>
    <div class="fl"><label>نوع السيارة</label>
      <select id="atype">
        <option value="pickup">🛻 باكاب 4 ركاب</option>
        <option value="suzuki">🚙 سوزوكى 7 ركاب</option>
        <option value="micro14">🚐 ميكروباص 14 راكب</option>
        <option value="bus26">🚌 أتوبيس 26 راكب</option>
      </select>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn b-green" onclick="confirmAssign()">✅ تأكيد</button>
      <button class="btn b-out" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
// ══ CONFIG ══
const API_URL = 'PASTE_APPS_SCRIPT_URL_HERE';
// ══ ACTUAL MOBICA FLEET ══
const FLEET = {
  pickup:  { label:'باكاب 4 ركاب',    cap:4,  total:2, cost:0.8, icon:'🛻' },
  suzuki:  { label:'سوزوكى 7 ركاب',   cap:7,  total:6, cost:1.0, icon:'🚙' },
  micro14: { label:'ميكروباص 14 راكب',cap:14, total:2, cost:1.5, icon:'🚐' },
  bus26:   { label:'أتوبيس 26 راكب',  cap:26, total:2, cost:2.5, icon:'🚌' },
};
// legacy aliases
const CAR_CAP  = {pickup:4,suzuki:7,micro14:14,bus26:26};
const CAR_COST = {pickup:0.8,suzuki:1,micro14:1.5,bus26:2.5};
const CAR_LBL  = Object.fromEntries(Object.entries(FLEET).map(([k,v])=>[k,v.label]));
const LOCS = ['القاهرة','مدينة نصر','مصر الجديدة','المعادي','المقطم','حلوان','التجمع الأول','التجمع الخامس','القاهرة الجديدة','مدينتي','المستقبل سيتي','بدر','العبور','الشروق','الرحاب','الشيخ زايد','6 أكتوبر','السادس من أكتوبر','الحرم','فيصل','إمبابة','عين شمس','المطرية','شبرا','السلام','النزهة','العباسية','وسط البلد','الزمالك','المهندسين','الدقي','الجيزة','الهرم','10 رمضان','15 مايو','الإسكندرية','العجمي','المنتزه','محرم بك','سيدي بشر','ميامي','سيدي جابر','الرمل','أبوقير','برج العرب','القليوبية','بنها','شبرا الخيمة','المحلة الكبرى','طنطا','كفر الشيخ','المنصورة','دمياط','الزقازيق','بنى سويف','المنيا','أسيوط','سوهاج','قنا','الأقصر','أسوان','الفيوم','بورسعيد','الإسماعيلية','السويس','العريش','الغردقة','دمنهور','شبين الكوم','المنطقة الصناعية 6 أكتوبر','المنطقة الصناعية 10 رمضان','المنطقة الصناعية برج العرب','المنطقة الصناعية العبور'];

// ══ STATE ══
let U = null; // current user
let REQS = [];
let ASSIGN_IDS = [];
let CUR_TAB = 'reqs';

// ══ BOOTSTRAP ══
window.onload = () => {
  if ('serviceWorker' in navigator)
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
  try { const s = localStorage.getItem('flt_u'); if(s) U = JSON.parse(s); } catch(e){}
  render();
};

// ══ RENDER ══
function render() {
  if (!U) renderLogin(1);
  else    renderApp();
}

function renderLogin(step, data={}) {
  const R = document.getElementById('root');
  if (step === 1) {
    R.innerHTML = `
    <div class="login-wrap">
      <div class="login-icon">🚐</div>
      <div class="login-h">حملة موبيكا</div>
      <div class="login-s">إدارة نقل الفنيين</div>
      <div class="box">
        <div class="box-title">👤 ما اسمك؟</div>
        <input class="inp" id="L1" type="text" placeholder="اكتب اسمك الكامل">
        <button class="go-btn" onclick="step1Next()">التالي ←</button>
      </div>
    </div>`;
    setTimeout(()=>{ const i=document.getElementById('L1'); if(i) i.focus(); },100);
  }
  else if (step === 2) {
    R.innerHTML = `
    <div class="login-wrap">
      <div class="login-icon">🚐</div>
      <div class="login-h">أهلاً ${data.name}</div>
      <div class="login-s">اختر دورك</div>
      <div class="box">
        <div class="box-title">🎯 ما دورك؟</div>
        <button class="big-btn" onclick="chooseRole('engineer','${data.name}')">👷 مهندس / مدير مجموعة</button>
        <button class="big-btn" onclick="chooseRole('fleet_manager','${data.name}')">🚐 مسؤول الحملة (عماد)</button>
      </div>
    </div>`;
  }
  else if (step === 3) {
    R.innerHTML = `
    <div class="login-wrap">
      <div class="login-icon">🚐</div>
      <div class="login-h">اختر مجموعتك</div>
      <div class="login-s">${data.name}</div>
      <div class="box">
        <div class="box-title">👥 المجموعة</div>
        <button class="big-btn" onclick="chooseTeam('A — أحمد حسن','${data.name}')">مجموعة A — أحمد حسن</button>
        <button class="big-btn" onclick="chooseTeam('B — سامى فؤاد','${data.name}')">مجموعة B — سامى فؤاد</button>
        <button class="big-btn" onclick="chooseTeam('C — حازم قاعود','${data.name}')">مجموعة C — حازم قاعود</button>
        <button class="big-btn" onclick="chooseTeam('D — هشام جمال','${data.name}')">مجموعة D — هشام جمال</button>
      </div>
    </div>`;
  }
}

function step1Next() {
  const name = (document.getElementById('L1').value||'').trim();
  if (!name) { toast('✋ اكتب اسمك أولاً'); return; }
  renderLogin(2, {name});
}

function chooseRole(role, name) {
  if (role === 'fleet_manager') {
    U = {name, role, team:''};
    try { localStorage.setItem('flt_u', JSON.stringify(U)); } catch(e){}
    renderApp();
  } else {
    renderLogin(3, {name});
  }
}

function chooseTeam(team, name) {
  U = {name, role:'engineer', team};
  try { localStorage.setItem('flt_u', JSON.stringify(U)); } catch(e){}
  renderApp();
}

// ══ APP ══
function renderApp() {
  const R = document.getElementById('root');
  const date = new Date().toLocaleDateString('ar-EG',{weekday:'short',day:'numeric',month:'short'});
  const roleLabel = U.role === 'engineer' ? ('مهندس — ' + U.team) : 'مسؤول الحملة';

  if (U.role === 'engineer') {
    const locOpts = LOCS.map(l=>`<option value="${l}">${l}</option>`).join('');
    R.innerHTML = `
    <div class="topbar">
      <div><div class="tb-l">🚐 حملة موبيكا</div><div class="tb-s">${U.name} | ${roleLabel}</div></div>
      <div class="tb-r">${date}</div>
    </div>
    <div class="content">
      <div class="card">
        <div class="ct">➕ طلب نقل جديد</div>
        <div class="fl"><label>المجموعة</label>
          <select id="e-team">
            <option value="">— اختر —</option>
            <option value="A — أحمد حسن" ${U.team==='A — أحمد حسن'?'selected':''}>A — أحمد حسن</option>
            <option value="B — سامى فؤاد" ${U.team==='B — سامى فؤاد'?'selected':''}>B — سامى فؤاد</option>
            <option value="C — حازم قاعود" ${U.team==='C — حازم قاعود'?'selected':''}>C — حازم قاعود</option>
            <option value="D — هشام جمال" ${U.team==='D — هشام جمال'?'selected':''}>D — هشام جمال</option>
          </select>
        </div>
        <div class="fr">
          <div class="fl"><label>مكان التحرك</label><select id="e-from"><option value="">— اختر —</option>${locOpts}</select></div>
          <div class="fl"><label>مكان الوصول</label><select id="e-dest"><option value="">— اختر —</option>${locOpts}</select></div>
        </div>
        <div class="fl"><label>عدد الأفراد</label><input id="e-techs" type="number" min="1" placeholder="0" inputmode="numeric"></div>
        <button class="btn b-blue" id="sbtn" onclick="submitReq()">📤 إرسال الطلب</button>
      </div>
      <div class="card">
        <div class="ct">📋 طلباتي اليوم</div>
        <div id="mylist"><div class="empty">⏳ جاري التحميل...</div></div>
      </div>
    </div>
    <div class="bnav">
      <div class="ni on"><div class="ni-ic">🏠</div>الرئيسية</div>
      <div class="ni" onclick="loadMyReqs()"><div class="ni-ic">🔄</div>تحديث</div>
      <div class="ni" onclick="doLogout()"><div class="ni-ic">🚪</div>خروج</div>
    </div>`;
    loadMyReqs();
  } else {
    R.innerHTML = `
    <div class="topbar">
      <div><div class="tb-l">🚐 حملة موبيكا</div><div class="tb-s">${U.name} | ${roleLabel}</div></div>
      <div class="tb-r">${date}</div>
    </div>
    <div class="content">
      <div class="stats">
        <div class="stat"><div class="sn" id="st0">0</div><div class="sl">طلبات</div></div>
        <div class="stat"><div class="sn" id="st1">0</div><div class="sl">انتظار</div></div>
        <div class="stat"><div class="sn" id="st2">0</div><div class="sl">محددة</div></div>
      </div>
      <div style="margin-bottom:12px">
        <button class="btn b-green" onclick="runAutoDistribute()">⚡ توزيع تلقائي</button>
      </div>
      <div class="tabs">
        <div class="tab on"  onclick="switchTab('reqs',this)">الطلبات</div>
        <div class="tab"     onclick="switchTab('merge',this)">💡 تحسين</div>
        <div class="tab"     onclick="switchTab('order',this)">📄 إيجار</div>
      </div>
      <div id="tab-reqs"></div>
      <div id="tab-merge" style="display:none"></div>
      <div id="tab-order" style="display:none"></div>
    </div>
    <div class="bnav">
      <div class="ni on"><div class="ni-ic">🏠</div>الرئيسية</div>
      <div class="ni" onclick="loadAllReqs()"><div class="ni-ic">🔄</div>تحديث</div>
      <div class="ni" onclick="doLogout()"><div class="ni-ic">🚪</div>خروج</div>
    </div>`;
    loadAllReqs();
  }
}

function doLogout() {
  U = null; REQS = [];
  try { localStorage.removeItem('flt_u'); } catch(e){}
  render();
}

// ══ ENGINEER ══
async function submitReq() {
  const team  = document.getElementById('e-team').value;
  const from  = document.getElementById('e-from').value;
  const dest  = document.getElementById('e-dest').value;
  const techs = parseInt(document.getElementById('e-techs').value)||0;
  if (!team)  return toast('✋ اختر المجموعة');
  if (!from)  return toast('✋ اختر مكان التحرك');
  if (!dest)  return toast('✋ اختر مكان الوصول');
  if (!techs) return toast('✋ أدخل عدد الأفراد');
  const btn = document.getElementById('sbtn');
  btn.textContent='⏳ جاري...'; btn.disabled=true;
  try {
    const r = await api('addRequest',{team,from_loc:from,dest,techs,created_by:U.name,date:todayStr()});
    if(r.ok){toast('✅ تم الإرسال — سيُخطر عماد');document.getElementById('e-techs').value='';loadMyReqs();}
    else toast('❌ '+(r.error||'خطأ'));
  } catch(e){toast('❌ تعذّر الاتصال');}
  btn.textContent='📤 إرسال الطلب'; btn.disabled=false;
}

async function loadMyReqs() {
  const el = document.getElementById('mylist');
  if(!el) return;
  el.innerHTML='<div class="empty">⏳ جاري التحميل...</div>';
  try {
    const r = await apiGet('getRequests',{date:todayStr()});
    REQS = r.requests||[];
    const mine = REQS.filter(x=>x.team===U.team||x.created_by===U.name);
    el.innerHTML = mine.length ? mine.map(rqHTML).join('') : '<div class="empty">لا توجد طلبات اليوم 📭</div>';
  } catch(e){el.innerHTML='<div class="empty">⚠️ تعذّر التحميل</div>';}
}

// ══ FLEET MANAGER ══
async function loadAllReqs() {
  const el = document.getElementById('tab-reqs');
  if(!el) return;
  el.innerHTML='<div class="empty">⏳ جاري التحميل...</div>';
  try {
    const r = await apiGet('getRequests',{date:todayStr()});
    REQS = r.requests||[];
    updStats();
    if(CUR_TAB==='reqs')   renderFmReqs();
    if(CUR_TAB==='merge')  renderMerge();
    if(CUR_TAB==='order')  renderOrder();
    else renderFmReqs();
  } catch(e){el.innerHTML='<div class="empty">⚠️ تعذّر التحميل</div>';}
}

function updStats() {
  const t=document.getElementById('st0'),p=document.getElementById('st1'),a=document.getElementById('st2');
  if(t) t.textContent=REQS.length;
  if(p) p.textContent=REQS.filter(r=>r.status==='pending').length;
  if(a) a.textContent=REQS.filter(r=>r.status==='assigned').length;
}

function switchTab(name, btn) {
  CUR_TAB = name;
  ['reqs','merge','order'].forEach(t=>{
    const el=document.getElementById('tab-'+t);
    if(el) el.style.display=t===name?'':'none';
  });
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  if(name==='reqs')  renderFmReqs();
  if(name==='merge') renderMerge();
  if(name==='order') renderOrder();
}

function renderFmReqs() {
  const el=document.getElementById('tab-reqs');
  if(!el) return;
  el.innerHTML = REQS.length ? REQS.map(r=>rqHTML(r,true)).join('') : '<div class="empty">لا توجد طلبات اليوم 📭</div>';
}

function rqHTML(r, mgr=false) {
  const p=r.status==='pending';
  const badge=p?'<span class="badge bp">⏳ انتظار</span>':'<span class="badge ba">✅ محدد</span>';
  const veh=!p?`<div style="font-size:12px;color:#2e7d32;margin-top:4px">🔑 ${r.plate||''} — ${r.driver||''} (${CAR_LBL[r.car_type]||''})</div>`:'';
  const btn=mgr&&p?`<button class="btn b-orange b-sm" style="margin-top:10px" onclick="openAssign('${r.id}')">🔑 تحديد السيارة</button>`:'';

    ${veh}${btn}
  </div>`;
}

function renderMerge() {
  const el=document.getElementById('tab-merge');
  if(!el) return;
  if(!REQS.length){el.innerHTML='<div class="empty">لا توجد طلبات 📭</div>';return;}
  // Group by from+dest
  const gs=[];
  REQS.forEach(r=>{
    const g=gs.find(x=>x.from===r.from_loc&&x.dest===r.dest);
    if(g){g.ids.push(r.id);g.techs+=parseInt(r.techs)||0;g.rows.push(r);}
    else gs.push({from:r.from_loc,dest:r.dest,ids:[r.id],techs:parseInt(r.techs)||0,rows:[r]});
  });
  // store groups globally — no Arabic in onclick
  _groups = gs;
  el.innerHTML = gs.map((g,gi)=>{
    const cSep=g.rows.reduce((s,r)=>s+bf(parseInt(r.techs)||0).cost,0);
    const nSep=g.rows.reduce((s,r)=>s+bf(parseInt(r.techs)||0).cnt,0);
    const best=bf(g.techs);
    const sav=Math.max(0,Math.round((cSep-best.cost)/cSep*100));
    const cap=CAR_CAP[best.type];
    const pct=Math.min(100,Math.round(g.techs/cap*100));
    const col=g.techs>cap?'#c62828':g.techs>cap*.8?'#f57c00':'#2e7d32';
    const multiRow = g.rows.length > 1;
    return `<div class="mc" style="border-color:${multiRow?'#ffc107':'#ddd'}">
      <div class="mc-title">📍 ${g.from||'—'} ➜ ${g.dest||'—'}</div>
      <div style="font-size:12px;color:#666;margin-bottom:8px">${g.rows.map(r=>`👷 ${r.team||'—'} (${r.techs} فرد)`).join('<br>')}</div>
      ${multiRow ? `
      <div class="ba-row">
        <div class="ba-num"><div class="ba-big" style="color:#e65100">${nSep}</div><div class="ba-lbl">سيارات منفردة</div></div>
        <div style="font-size:24px;color:#999">→</div>
        <div class="ba-num"><div class="ba-big" style="color:#2e7d32">${best.cnt}</div><div class="ba-lbl">بعد الدمج</div></div>
      </div>
      ${sav>0?`<div style="background:#2e7d32;color:#fff;display:inline-block;padding:3px 14px;border-radius:20px;font-size:12px;margin-bottom:8px;font-weight:700">💰 توفير ${sav}% من التكلفة</div>`:''}
      ` : ''}
      <div style="font-size:13px;margin-bottom:6px">🚐 ${CAR_LBL[best.type]} | 👥 ${g.techs} فرد</div>
      <div class="cap-bg"><div class="cap-fill" style="background:${col};width:${pct}%"></div></div>
      <div style="font-size:12px;color:${col};margin-bottom:10px">${g.techs} / ${cap} مقعد</div>
      <button class="btn b-orange b-sm" onclick="openAssignGroup(${gi})">🔑 تعيين سيارة للمجموعة</button>
    </div>`;
  }).join('');
}

// Best fit from Mobica fleet
function bf(techs) {
  const types = Object.keys(FLEET).sort((a,b)=>FLEET[a].cap-FLEET[b].cap); // smallest first
  let best = null;
  for (const t of types) {
    const cap = FLEET[t].cap;
    const cnt = Math.ceil(techs/cap);
    const cost = cnt * FLEET[t].cost;
    if (!best || cost < best.cost) best = {type:t, cnt, cost};
  }
  return best || {type:'bus26',cnt:1,cost:2.5};
}

// Auto-distribute all requests optimally using available fleet
function runAutoDistribute() {
  // switch to merge tab first
  CUR_TAB = 'merge';
  ['reqs','merge','order'].forEach(t=>{
    const el=document.getElementById('tab-'+t);
    if(el) el.style.display=t==='merge'?'':'none';
  });
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('on', i===1);
  });
  autoDistribute();
}

function autoDistribute() {
  if (!REQS.length) {
    const el=document.getElementById('tab-merge');
    if(el) el.innerHTML='<div class="empty">⚠️ لا توجد طلبات — اضغط تحديث أولاً</div>';
    return;
  }

  // Count available (unassigned) fleet slots
  const used = {};
  Object.keys(FLEET).forEach(k => used[k] = 0);
  REQS.filter(r=>r.status==='assigned').forEach(r=>{ if(r.car_type&&used[r.car_type]!==undefined) used[r.car_type]++; });

  // Group pending requests by route
  const pending = REQS.filter(r=>r.status==='pending');
  const groups = [];
  pending.forEach(r=>{
    const g=groups.find(x=>x.from===r.from_loc&&x.dest===r.dest);
    if(g){g.ids.push(r.id);g.techs+=parseInt(r.techs)||0;g.rows.push(r);}
    else groups.push({from:r.from_loc,dest:r.dest,ids:[r.id],techs:parseInt(r.techs)||0,rows:[r]});
  });

  // Sort groups largest first
  groups.sort((a,b)=>b.techs-a.techs);

  const plan = [];
  const warnings = [];

  groups.forEach(g=>{
    // Find cheapest available vehicle type that fits
    const types = Object.keys(FLEET).sort((a,b)=>FLEET[a].cap-FLEET[b].cap);
    let assigned = false;
    for (const t of types) {
      const avail = FLEET[t].total - used[t];
      if (avail > 0 && FLEET[t].cap >= g.techs) {
        used[t]++;
        plan.push({ ids:g.ids, type:t, label:FLEET[t].label, icon:FLEET[t].icon, from:g.from, dest:g.dest, techs:g.techs });
        assigned = true;
        break;
      }
    }
    if (!assigned) {
      // Need multiple cars — use largest available
      let remaining = g.techs;
      const types2 = Object.keys(FLEET).sort((a,b)=>FLEET[b].cap-FLEET[a].cap);
      let tempIds = [...g.ids];
      for (const t of types2) {
        while (remaining > 0 && (FLEET[t].total - used[t]) > 0) {
          used[t]++;
          const cap = FLEET[t].cap;
          plan.push({ ids:tempIds.splice(0,1), type:t, label:FLEET[t].label, icon:FLEET[t].icon, from:g.from, dest:g.dest, techs:Math.min(remaining,cap) });
          remaining -= cap;
        }
        if (remaining <= 0) break;
      }
      if (remaining > 0) warnings.push(`⚠️ ${g.from}→${g.dest}: تجاوز الطاقة بـ ${remaining} فرد`);
    }
  });

  // Show plan
  showAutoPlan(plan, warnings);
}

// ══ AUTO PLAN ══
function showAutoPlan(plan, warnings) {
  const el = document.getElementById('tab-merge');
  if (!el) return;

  // Fleet availability summary
  const used = {};
  Object.keys(FLEET).forEach(k=>used[k]=0);
  plan.forEach(p=>{ if(used[p.type]!==undefined) used[p.type]++; });

  const fleetBar = Object.entries(FLEET).map(([k,v])=>{
    const u = used[k]||0;
    const avail = v.total - u;
    const col = avail===0?'#c62828':avail<v.total?'#f57c00':'#2e7d32';
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:13px">
      <span>${v.icon} ${v.label}</span>
      <span style="color:${col};font-weight:700">${u}/${v.total} مستخدمة</span>
    </div>`;
  }).join('');

  const planCards = plan.map((p,i)=>`
    <div style="background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;border-right:4px solid #1565c0;box-shadow:0 1px 4px rgba(0,0,0,.07)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="font-weight:700;font-size:14px">${p.icon} ${p.label}</span>
        <span style="background:#e3f2fd;color:#1565c0;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700">سيارة ${i+1}</span>
      </div>
      <div style="font-size:13px;color:#555">📍 ${p.from||'—'} ➜ ${p.dest||'—'}</div>
      <div style="font-size:12px;color:#888;margin-top:2px">👥 ${p.techs} فرد | سعة ${FLEET[p.type].cap}</div>
    </div>`).join('');

  el.innerHTML = `
    <div class="card">
      <div class="ct">🚗 الأسطول المتاح</div>
      ${fleetBar}
    </div>
    ${warnings.length?`<div style="background:#fff3e0;border:2px solid #f57c00;border-radius:10px;padding:12px;margin-bottom:12px">${warnings.map(w=>`<div style="font-size:13px;color:#e65100">${w}</div>`).join('')}</div>`:''}
    <div class="card">
      <div class="ct">✅ خطة التوزيع التلقائي — ${plan.length} سيارة</div>
      ${planCards}
      ${plan.length?`<button class="btn b-blue" style="margin-top:8px" onclick="applyAutoPlan()">✅ تطبيق الخطة</button>`:'<div class="empty">لا توجد طلبات معلّقة</div>'}
    </div>`;

  // store plan globally
  window._autoPlan = plan;
}

function applyAutoPlan() {
  const plan = window._autoPlan;
  if (!plan||!plan.length) return;
  // Open assign modal for first unassigned — or show batch assign UI
  // For now show plan summary and let عماد assign plates manually per group
  toast('✅ الخطة جاهزة — اضغط على كل مجموعة لإضافة رقم السيارة والسائق');
  renderMergeWithPlan(plan);
}

function renderMergeWithPlan(plan) {
  const el = document.getElementById('tab-merge');
  if (!el) return;
  _groups = plan.map(p=>({ ids:p.ids, from:p.from, dest:p.dest, techs:p.techs, rows: REQS.filter(r=>p.ids.includes(r.id)), suggestedType:p.type }));
  el.innerHTML = plan.map((p,i)=>`
    <div class="mc" style="border-color:#1565c0">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span style="font-weight:700">${p.icon} ${p.label}</span>
        <span style="background:#e3f2fd;color:#1565c0;padding:2px 10px;border-radius:20px;font-size:12px">سيارة ${i+1}</span>
      </div>
      <div style="font-size:13px;color:#555;margin-bottom:4px">📍 ${p.from||'—'} ➜ ${p.dest||'—'}</div>
      <div style="font-size:12px;color:#888;margin-bottom:10px">👥 ${p.techs} فرد</div>
      <button class="btn b-orange b-sm" onclick="openAssignGroup(${i})">🔑 إضافة رقم السيارة والسائق</button>
    </div>`).join('');
}

// ══ MERGE GROUPS STORE ══
let _groups = [];


function openAssign(id) {
  const r=REQS.find(x=>x.id===id);
  if(!r) return;
  ASSIGN_IDS=[id];
  const t=parseInt(r.techs)||0;
  document.getElementById('ainfo').innerHTML=`👷 ${r.team}<br>📍 ${r.from_loc||'—'} ➜ ${r.dest||'—'}<br>👥 ${r.techs} فرد`;
  document.getElementById('atype').selectedIndex=t<=4?0:t<=6?1:2;
  document.getElementById('aplate').value='';
  document.getElementById('adriver').value='';
  document.getElementById('amodal').classList.add('open');
}

function openAssignGroup(gi) {
  const g = _groups[gi];
  if (!g) return;
  ASSIGN_IDS = g.ids;
  const best = bf(g.techs);
  document.getElementById('ainfo').innerHTML =
    `📍 ${g.from||'—'} ➜ ${g.dest||'—'}<br>👥 ${g.techs} فرد إجمالاً<br>` +
    g.rows.map(r=>`👷 ${r.team||'—'}: ${r.techs} فرد`).join('<br>');
  document.getElementById('atype').value = best.type;
  document.getElementById('aplate').value='';
  document.getElementById('adriver').value='';
  document.getElementById('amodal').classList.add('open');
}

function closeModal(){document.getElementById('amodal').classList.remove('open');}

async function confirmAssign(){
  const plate=(document.getElementById('aplate').value||'').trim();
  const driver=(document.getElementById('adriver').value||'').trim();
  const type=document.getElementById('atype').value;
  if(!plate) return toast('✋ أدخل رقم السيارة');
  if(!driver) return toast('✋ أدخل اسم السائق');
  try{
    const r=await api('assignVehicle',{ids:ASSIGN_IDS,plate,driver,car_type:type,car_type_label:CAR_LBL[type]});
    if(r.ok){toast('✅ تم تحديد السيارة');closeModal();loadAllReqs();}
    else toast('❌ '+(r.error||'خطأ'));
  }catch(e){toast('❌ تعذّر الاتصال');}
}

// ══ API ══
async function api(action,data){
  if(API_URL.includes('PASTE')) return demoPost(action,data);
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...data})});
  return r.json();
}
async function apiGet(action,params){
  if(API_URL.includes('PASTE')) return demoGet(action,params);
  const q=new URLSearchParams({action,...params});
  const r=await fetch(API_URL+'?'+q);
  return r.json();
}
let _demo=[];
try{_demo=JSON.parse(localStorage.getItem('demo_r')||'[]');}catch(e){}
function saveD(){try{localStorage.setItem('demo_r',JSON.stringify(_demo));}catch(e){}}
function demoPost(action,data){
  if(action==='addRequest'){const id='R'+Date.now().toString(36).toUpperCase();_demo.push({id,status:'pending',...data});saveD();return Promise.resolve({ok:true,id});}
  if(action==='assignVehicle'){(data.ids||[]).forEach(id=>{const r=_demo.find(x=>x.id===id);if(r){r.plate=data.plate;r.driver=data.driver;r.car_type=data.car_type;r.status='assigned';}});saveD();return Promise.resolve({ok:true});}
  return Promise.resolve({ok:false});
}
function demoGet(action,params){
  return Promise.resolve({ok:true,requests:_demo.filter(r=>!params.date||r.date===params.date)});
}
