<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1565c0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حملة موبيكا">
<title>حملة موبيكا</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,Tahoma,sans-serif;background:#eef2f7;min-height:100vh;color:#1a1a2e}
.login-wrap{min-height:100vh;background:linear-gradient(160deg,#1565c0,#0d47a1);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.login-icon{font-size:64px;margin-bottom:10px}
.login-h{color:#fff;font-size:26px;font-weight:800}
.login-s{color:rgba(255,255,255,.7);font-size:14px;margin-bottom:28px}
.box{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.box-title{font-size:15px;font-weight:700;color:#555;margin-bottom:14px}
.inp{width:100%;padding:14px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;font-family:inherit;margin-bottom:4px}
.inp:focus{outline:none;border-color:#1565c0}
.big-btn{display:block;width:100%;padding:15px;border:2px solid #e0e0e0;border-radius:12px;background:#fff;font-size:15px;font-family:inherit;font-weight:600;color:#444;cursor:pointer;text-align:center;margin-bottom:10px;transition:all .15s}
.big-btn:last-child{margin-bottom:0}
.big-btn.sel,.big-btn:active{border-color:#1565c0;background:#e8f0fe;color:#1565c0}
.go-btn{width:100%;padding:15px;background:#1565c0;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:14px}
.topbar{background:#1565c0;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.tb-l{font-size:17px;font-weight:700}
.tb-s{font-size:12px;opacity:.8;margin-top:1px}
.content{padding:14px;padding-bottom:85px}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:16px;margin-bottom:12px}
.ct{font-size:15px;font-weight:700;color:#1565c0;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.fl{margin-bottom:13px}
.fl label{display:block;font-size:13px;color:#666;font-weight:600;margin-bottom:5px}
.fl select,.fl input{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:10px;font-size:15px;font-family:inherit;background:#fff}
.fl select:focus,.fl input:focus{outline:none;border-color:#1565c0}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px;border-radius:10px;font-size:15px;font-weight:700;font-family:inherit;border:none;cursor:pointer;width:100%;transition:opacity .15s}
.btn:active{opacity:.8}
.b-blue{background:#1565c0;color:#fff}
.b-green{background:#2e7d32;color:#fff}
.b-orange{background:#e65100;color:#fff}
.b-red{background:#c62828;color:#fff}
.b-out{background:#fff;border:2px solid #1565c0;color:#1565c0}
.b-sm{padding:9px 14px;font-size:13px;width:auto}
.b-xs{padding:6px 10px;font-size:12px;width:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:#fff;border-radius:12px;padding:13px 8px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.07)}
.sn{font-size:26px;font-weight:800;color:#1565c0}
.sl{font-size:11px;color:#999;margin-top:2px}
.tabs{display:flex;background:#fff;border-radius:12px;padding:4px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.07);overflow-x:auto}
.tab{flex:1;text-align:center;padding:9px 6px;border-radius:9px;font-size:12px;font-weight:600;color:#aaa;cursor:pointer;white-space:nowrap;min-width:60px}
.tab.on{background:#1565c0;color:#fff}
.rq{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;border-right:4px solid #ddd;box-shadow:0 2px 6px rgba(0,0,0,.07)}
.rq.pending{border-color:#f57c00}
.rq.assigned{border-color:#2e7d32}
.rq.approved{border-color:#1565c0}
.rq-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px}
.rq-team{font-weight:700;font-size:14px}
.rq-route{font-size:13px;color:#555;margin-bottom:3px}
.rq-sub{font-size:12px;color:#999}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.bp{background:#fff3e0;color:#e65100}
.ba{background:#e8f5e9;color:#2e7d32}
.bb{background:#e3f2fd;color:#1565c0}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;box-shadow:0 -2px 8px rgba(0,0,0,.08);z-index:50}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 12px;font-size:10px;color:#ccc;cursor:pointer}
.ni.on{color:#1565c0}
.ni-ic{font-size:20px;margin-bottom:2px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-end}
.ov.open{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:20px;width:100%;max-height:88vh;overflow-y:auto}
.mt{font-size:16px;font-weight:700;color:#1565c0;margin-bottom:14px}
.empty{text-align:center;padding:32px;color:#ccc;font-size:14px}
#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 22px;border-radius:22px;font-size:13px;opacity:0;transition:opacity .3s;z-index:300;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
.veh-row{display:flex;align-items:center;gap:8px;padding:8px;background:#f9f9f9;border-radius:8px;margin-bottom:8px;font-size:13px}
.veh-info{flex:1}
.plan-card{border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.07)}
.plan-company{background:#e8f5e9;border:2px solid #a5d6a7}
.plan-rental{background:#fff3e0;border:2px solid #ffcc80}
.divider{text-align:center;font-size:12px;color:#999;margin:10px 0;position:relative}
.divider::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:#e0e0e0;z-index:0}
.divider span{background:#eef2f7;padding:0 10px;position:relative;z-index:1}
</style>
</head>
<body>
<div id="root"></div>

<!-- Route Modal -->
<div class="ov" id="rmodal">
  <div class="modal" style="max-height:92vh">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="mt" style="margin:0">🗺 خطة الرحلة</div>
      <button style="background:none;border:none;font-size:22px;cursor:pointer;color:#888" onclick="closeModal('rmodal')">✕</button>
    </div>
    <div id="rmodal-body"></div>
  </div>
</div>

<!-- Assign Modal -->
<div class="ov" id="amodal">
  <div class="modal">
    <div class="mt">🔑 تأكيد التعيين</div>
    <div id="ainfo" style="background:#f5f5f5;border-radius:8px;padding:10px;margin-bottom:14px;font-size:13px;line-height:1.7"></div>
    <div class="fl"><label>رقم السيارة</label><input id="aplate" type="text" placeholder="اللوحة"></div>
    <div class="fl"><label>اسم السائق</label><input id="adriver" type="text" placeholder="الاسم"></div>
    <div class="fl"><label>نوع السيارة</label>
      <select id="atype">
        <option value="pickup">🛻 باكاب 4 ركاب</option>
        <option value="suzuki">🚙 سوزوكى 7 ركاب</option>
        <option value="micro14">🚐 ميكروباص 14 راكب</option>
        <option value="bus26">🚌 أتوبيس 26 راكب</option>
      </select>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn b-green" onclick="confirmAssign()">✅ اعتماد</button>
      <button class="btn b-out" onclick="closeModal('amodal')">إلغاء</button>
    </div>
  </div>
</div>

<!-- Vehicle Edit Modal -->
<div class="ov" id="vemodal">
  <div class="modal">
    <div class="mt" id="ve-title">تعديل سيارة</div>
    <div class="fl"><label>رقم اللوحة</label><input id="ve-plate" type="text" placeholder="رقم اللوحة"></div>
    <div class="fl"><label>اسم السائق</label><input id="ve-driver" type="text" placeholder="اسم السائق"></div>
    <div class="fl"><label>النوع</label>
      <select id="ve-type">
        <option value="pickup">🛻 باكاب 4 ركاب</option>
        <option value="suzuki">🚙 سوزوكى 7 ركاب</option>
        <option value="micro14">🚐 ميكروباص 14 راكب</option>
        <option value="bus26">🚌 أتوبيس 26 راكب</option>
      </select>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn b-blue" onclick="saveVehicle()">💾 حفظ</button>
      <button class="btn b-out" onclick="closeModal('vemodal')">إلغاء</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ══ CONFIG ══
const API_URL = 'PASTE_APPS_SCRIPT_URL_HERE';

const FLEET_DEF = {
  pickup:  {label:'باكاب',    cap:4,  icon:'🛻'},
  suzuki:  {label:'سوزوكى',   cap:7,  icon:'🚙'},
  micro14: {label:'ميكروباص', cap:14, icon:'🚐'},
  bus26:   {label:'أتوبيس',   cap:26, icon:'🚌'},
};

const LOCS = [
  // 🏭 مواقع موبيكا
  'مصنع موبيكا — أبورواش','المنطقة الصناعية أبورواش',
  // 🏙 القاهرة الكبرى
  'المنصورية','الهرم','فيصل','الجيزة','الدقي','المهندسين','الزمالك','إمبابة','أوسيم','كرداسة',
  '6 أكتوبر','السادس من أكتوبر','الحرم','المنطقة الصناعية 6 أكتوبر',
  'وسط البلد','العباسية','شبرا','السلام','النزهة','مدينة نصر','عين شمس','المطرية',
  'مصر الجديدة','هليوبوليس','المعادي','المقطم','حلوان','15 مايو',
  'التجمع الأول','التجمع الخامس','القاهرة الجديدة','مدينتي','الشروق','الرحاب',
  'المستقبل سيتي','بدر','العبور','المنطقة الصناعية العبور',
  'الشيخ زايد','10 رمضان','المنطقة الصناعية 10 رمضان',
  'القاهرة','السادات','أبوالنمرس','البدرشين','منشأة القناطر',
  // 🌊 الإسكندرية
  'الإسكندرية','العجمي','المنتزه','محرم بك','سيدي بشر','ميامي','سيدي جابر','الرمل','أبوقير',
  'برج العرب','المنطقة الصناعية برج العرب',
  // 🏙 الدلتا
  'القليوبية','بنها','شبرا الخيمة','المحلة الكبرى','طنطا','كفر الشيخ','دمنهور','شبين الكوم',
  'المنصورة','دمياط','الزقازيق','بلبيس',
  // 🗺 باقى المحافظات
  'بنى سويف','المنيا','أسيوط','سوهاج','قنا','الأقصر','أسوان','الفيوم',
  'بورسعيد','الإسماعيلية','السويس','العريش','الغردقة',
];

// ══ STATE ══
let U = null;
let REQS = [];
let ASSIGN_IDS = [];
let _editVehIdx = -1;
let _autoPlan = [];
let CUR_TAB = 'reqs';

// Default company vehicles
const DEFAULT_VEHICLES = [
  {id:'c1',type:'pickup', plate:'باكاب 1',   driver:'السائق 1'},
  {id:'c2',type:'pickup', plate:'باكاب 2',   driver:'السائق 2'},
  {id:'c3',type:'suzuki', plate:'سوزوكى 1',  driver:'السائق 3'},
  {id:'c4',type:'suzuki', plate:'سوزوكى 2',  driver:'السائق 4'},
  {id:'c5',type:'suzuki', plate:'سوزوكى 3',  driver:'السائق 5'},
  {id:'c6',type:'suzuki', plate:'سوزوكى 4',  driver:'السائق 6'},
  {id:'c7',type:'suzuki', plate:'سوزوكى 5',  driver:'السائق 7'},
  {id:'c8',type:'suzuki', plate:'سوزوكى 6',  driver:'السائق 8'},
  {id:'c9',type:'micro14',plate:'ميكروباص 1', driver:'السائق 9'},
  {id:'c10',type:'micro14',plate:'ميكروباص 2',driver:'السائق 10'},
  {id:'c11',type:'bus26', plate:'أتوبيس 1',  driver:'السائق 11'},
  {id:'c12',type:'bus26', plate:'أتوبيس 2',  driver:'السائق 12'},
];

function getVehicles() {
  try { return JSON.parse(localStorage.getItem('co_vehicles')||'null') || DEFAULT_VEHICLES; } catch(e){ return DEFAULT_VEHICLES; }
}
function saveVehicles(v){ try{localStorage.setItem('co_vehicles',JSON.stringify(v));}catch(e){} }

// ══ BOOTSTRAP ══
window.onload = () => {
  if('serviceWorker' in navigator)
    navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));
  try{ const s=localStorage.getItem('flt_u'); if(s) U=JSON.parse(s); }catch(e){}
  render();
};

// ══ LOGIN ══
function render(){ U ? renderApp() : renderLogin(1); }

function renderLogin(step, data={}) {
  const R = document.getElementById('root');
  if(step===1){
    R.innerHTML=`<div class="login-wrap">
      <div class="login-icon">🚐</div>
      <div class="login-h">حملة موبيكا</div>
      <div class="login-s">إدارة نقل الفنيين</div>
      <div class="box">
        <div class="box-title">👤 ما اسمك؟</div>
        <input class="inp" id="L1" type="text" placeholder="اكتب اسمك الكامل">
        <button class="go-btn" onclick="s1()">التالي ←</button>
      </div></div>`;
    setTimeout(()=>{const i=document.getElementById('L1');if(i)i.focus();},100);
  } else if(step===2){
    R.innerHTML=`<div class="login-wrap">
      <div class="login-icon">🚐</div>
      <div class="login-h">أهلاً ${data.name}</div>
      <div class="login-s">اختر دورك</div>
      <div class="box">
        <div class="box-title">🎯 ما دورك؟</div>
        <button class="big-btn" onclick="chooseRole('engineer','${data.name}')">👷 مهندس / مدير مجموعة</button>
        <button class="big-btn" onclick="chooseRole('fleet_manager','${data.name}')">🚐 مسؤول الحملة</button>
      </div></div>`;
  } else if(step===3){
    R.innerHTML=`<div class="login-wrap">
      <div class="login-icon">🚐</div>
      <div class="login-h">اختر مجموعتك</div>
      <div class="login-s">${data.name}</div>
      <div class="box">
        <div class="box-title">👥 المجموعة</div>
        <button class="big-btn" onclick="chooseTeam('A — أحمد حسن','${data.name}')">مجموعة A — أحمد حسن</button>
        <button class="big-btn" onclick="chooseTeam('B — سامى فؤاد','${data.name}')">مجموعة B — سامى فؤاد</button>
        <button class="big-btn" onclick="chooseTeam('C — حازم قاعود','${data.name}')">مجموعة C — حازم قاعود</button>
        <button class="big-btn" onclick="chooseTeam('D — هشام جمال','${data.name}')">مجموعة D — هشام جمال</button>
      </div></div>`;
  }
}

function s1(){ const n=(document.getElementById('L1').value||'').trim(); if(!n){toast('✋ اكتب اسمك');return;} renderLogin(2,{name:n}); }
function chooseRole(r,n){ if(r==='engineer'){renderLogin(3,{name:n});}else{login(n,r,'');} }
function chooseTeam(t,n){ login(n,'engineer',t); }
function login(name,role,team){ U={name,role,team}; try{localStorage.setItem('flt_u',JSON.stringify(U));}catch(e){} renderApp(); }
function doLogout(){ U=null;REQS=[];try{localStorage.removeItem('flt_u');}catch(e){} render(); }

// ══ RENDER APP ══
function renderApp(){
  const R=document.getElementById('root');
  const date=new Date().toLocaleDateString('ar-EG',{weekday:'short',day:'numeric',month:'short'});
  const roleLabel=U.role==='engineer'?('مهندس — '+U.team):'مسؤول الحملة';
  const isManager=U.role==='fleet_manager';

  if(!isManager){
    // ENGINEER — request form + read-only view
    const locOpts=LOCS.map(l=>`<option value="${l}">${l}</option>`).join('');
    R.innerHTML=`
    <div class="topbar">
      <div><div class="tb-l">🚐 حملة موبيكا</div><div class="tb-s">${U.name} | ${roleLabel}</div></div>
      <div style="font-size:12px;opacity:.7">${date}</div>
    </div>
    <div class="content">
      <div class="card">
        <div class="ct">➕ طلب نقل جديد</div>
        <div class="fl"><label>المجموعة</label>
          <select id="e-team">
            <option value="">— اختر —</option>
            <option value="A — أحمد حسن" ${U.team==='A — أحمد حسن'?'selected':''}>A — أحمد حسن</option>
            <option value="B — سامى فؤاد" ${U.team==='B — سامى فؤاد'?'selected':''}>B — سامى فؤاد</option>
            <option value="C — حازم قاعود" ${U.team==='C — حازم قاعود'?'selected':''}>C — حازم قاعود</option>
            <option value="D — هشام جمال" ${U.team==='D — هشام جمال'?'selected':''}>D — هشام جمال</option>
          </select>
        </div>
        <div class="fr">
          <div class="fl"><label>مكان التحرك</label><select id="e-from"><option value="">— اختر —</option>${locOpts}</select></div>
          <div class="fl"><label>مكان الوصول</label><select id="e-dest"><option value="">— اختر —</option>${locOpts}</select></div>
        </div>
        <div class="fl"><label>عدد الأفراد</label><input id="e-techs" type="number" min="1" placeholder="0" inputmode="numeric"></div>
        <button class="btn b-blue" id="sbtn" onclick="submitReq()">📤 إرسال الطلب</button>
      </div>
      <div class="card">
        <div class="ct">📋 طلباتي اليوم <span style="font-size:12px;color:#999;font-weight:400">(للعرض فقط)</span></div>
        <div id="mylist"><div class="empty">⏳ جاري التحميل...</div></div>
      </div>
    </div>
    <div class="bnav">
      <div class="ni on"><div class="ni-ic">🏠</div>الرئيسية</div>
      <div class="ni" onclick="loadMyReqs()"><div class="ni-ic">🔄</div>تحديث</div>
      <div class="ni" onclick="doLogout()"><div class="ni-ic">🚪</div>خروج</div>
    </div>`;
    loadMyReqs();
  } else {
    // FLEET MANAGER
    R.innerHTML=`
    <div class="topbar">
      <div><div class="tb-l">🚐 حملة موبيكا</div><div class="tb-s">${U.name} | ${roleLabel}</div></div>
      <div style="font-size:12px;opacity:.7">${date}</div>
    </div>
    <div class="content">
      <div class="stats">
        <div class="stat"><div class="sn" id="st0">0</div><div class="sl">طلبات</div></div>
        <div class="stat"><div class="sn" id="st1">0</div><div class="sl">انتظار</div></div>
        <div class="stat"><div class="sn" id="st2">0</div><div class="sl">معتمدة</div></div>
      </div>
      <button class="btn b-green" style="margin-bottom:12px" onclick="runAutoDistribute()">⚡ توزيع تلقائي واعتماد</button>
      <div class="tabs">
        <div class="tab on"  onclick="fmTab('reqs',this)">الطلبات</div>
        <div class="tab"     onclick="fmTab('plan',this)">📋 الخطة</div>
        <div class="tab"     onclick="fmTab('order',this)">📄 إيجار</div>
        <div class="tab"     onclick="fmTab('veh',this)">🚗 الأسطول</div>
      </div>
      <div id="tab-reqs"></div>
      <div id="tab-plan"  style="display:none"></div>
      <div id="tab-order" style="display:none"></div>
      <div id="tab-veh"   style="display:none"></div>
    </div>
    <div class="bnav">
      <div class="ni on"><div class="ni-ic">🏠</div>الرئيسية</div>
      <div class="ni" onclick="loadAllReqs()"><div class="ni-ic">🔄</div>تحديث</div>
      <div class="ni" onclick="doLogout()"><div class="ni-ic">🚪</div>خروج</div>
    </div>`;
    loadAllReqs();
  }
}

// ══ ENGINEER ══
async function submitReq(){
  const team=document.getElementById('e-team').value;
  const from=document.getElementById('e-from').value;
  const dest=document.getElementById('e-dest').value;
  const techs=parseInt(document.getElementById('e-techs').value)||0;
  if(!team) return toast('✋ اختر المجموعة');

// ══ AUTO DISTRIBUTE ══
function runAutoDistribute(){
  if(!REQS.length) return toast('⚠️ لا توجد طلبات — اضغط تحديث أولاً');
  const plan=autoDistribute();
  _autoPlan=plan;
  // switch to plan tab
  fmTab('plan', document.querySelectorAll('.tab')[1]);

function autoDistribute(){
  const vehicles=[...getVehicles()]; // company vehicles
  const available=vehicles.map(v=>({...v,used:false}));

  // Group pending requests by route
  const pending=REQS.filter(r=>r.status==='pending');
  const groups=[];
  pending.forEach(r=>{
    const g=groups.find(x=>x.from===r.from_loc&&x.dest===r.dest);
    if(g){g.ids.push(r.id);g.techs+=parseInt(r.techs)||0;g.rows.push(r);}
    else groups.push({from:r.from_loc,dest:r.dest,ids:[r.id],techs:parseInt(r.techs)||0,rows:[r]});
  });
  groups.sort((a,b)=>b.techs-a.techs);

  const companyAssignments=[];
  const rentalNeeded=[];

  groups.forEach(g=>{
    let remaining=g.techs;
    const assigned=[];

    // Try to fit with company vehicles (smallest fit first)
    const sorted=available.filter(v=>!v.used).sort((a,b)=>FLEET_DEF[a.type].cap-FLEET_DEF[b.type].cap);
    for(const v of sorted){
      if(remaining<=0) break;
      if(FLEET_DEF[v.type].cap>=remaining){
        v.used=true;
        assigned.push({...v,techs:remaining});
        remaining=0;
        break;
      }
    }
    // If still remaining, use largest available
    if(remaining>0){
      const byLarge=available.filter(v=>!v.used).sort((a,b)=>FLEET_DEF[b.type].cap-FLEET_DEF[a.type].cap);
      for(const v of byLarge){
        if(remaining<=0) break;
        v.used=true;
        const cap=FLEET_DEF[v.type].cap;
        assigned.push({...v,techs:Math.min(remaining,cap)});
        remaining-=cap;
      }
    }

    if(assigned.length>0){
      companyAssignments.push({...g, vehicles:assigned, covered:g.techs-Math.max(0,remaining)});
    }
    if(remaining>0){
      rentalNeeded.push({...g, techs:remaining, originalTechs:g.techs});
    }
  });

  return {companyAssignments, rentalNeeded};
}

  'القاهرة':                 {x:0,  y:0},
};

function geoPos(loc){ return GEO[loc] || {x:0,y:0}; }

function geoDistance(a,b){
  const pa=geoPos(a), pb=geoPos(b);
  return Math.sqrt(Math.pow(pa.x-pb.x,2)+Math.pow(pa.y-pb.y,2));
}

// Sort stops along a route (nearest-neighbor from first stop)
function sortStops(stops){
  if(stops.length<=1) return stops;
  const result=[stops[0]];
  const remaining=[...stops.slice(1)];
  while(remaining.length){
    const last=result[result.length-1];
    let minD=Infinity, minI=0;
    remaining.forEach((s,i)=>{
      const d=geoDistance(last.loc,s.loc);
      if(d<minD){minD=d;minI=i;}
    });
    result.push(remaining.splice(minI,1)[0]);
  }
  return result;
}

// ══ MULTI-STOP ROUTE MODAL ══
let _routeStops=[]; // {loc, action:'pickup'|'dropoff', people, id}
let _routeVehicle=null;

function openRouteModal(vehIdx, requestIds){
  const vs=getVehicles();
  _routeVehicle={...vs[vehIdx], cap:FLEET_DEF[vs[vehIdx].type]?.cap||7};
  _routeStops=[];
  // Pre-populate from requests
  const myReqs=REQS.filter(r=>requestIds.includes(r.id));
  const pickupGroups={}, dropGroups={};
  myReqs.forEach(r=>{
    if(!pickupGroups[r.from_loc]) pickupGroups[r.from_loc]=0;
    pickupGroups[r.from_loc]+=parseInt(r.techs)||0;
    if(!dropGroups[r.dest]) dropGroups[r.dest]=0;
    dropGroups[r.dest]+=parseInt(r.techs)||0;
  });
  Object.entries(pickupGroups).forEach(([loc,p])=>_routeStops.push({id:'s'+Date.now()+Math.random(),loc,action:'pickup',people:p}));
  Object.entries(dropGroups).forEach(([loc,p])=>_routeStops.push({id:'s'+Date.now()+Math.random(),loc,action:'dropoff',people:p}));
  _routeStops=sortStops(_routeStops);
  renderRouteModal();
  document.getElementById('rmodal').classList.add('open');
}

function renderRouteModal(){
  const v=_routeVehicle;
  const cap=v.cap;
  const locOpts=LOCS.map(l=>`<option value="${l}">${l}</option>`).join('');
  // Capacity per segment
  let onBoard=0;
  const stopsHTML=_routeStops.map((s,i)=>{
    if(s.action==='pickup') onBoard+=s.people;
    else onBoard-=s.people;
    onBoard=Math.max(0,onBoard);
    const col=onBoard>cap?'#c62828':onBoard>cap*.8?'#f57c00':'#2e7d32';
    const actionLabel=s.action==='pickup'?'🟢 ركوب':'🔴 نزول';
    return `<div style="background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;border-right:4px solid ${s.action==='pickup'?'#2e7d32':'#f57c00'}">
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <span style="font-weight:700;font-size:13px;min-width:20px">${i+1}.</span>
        <select style="flex:1;padding:7px;border:1.5px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit"
          onchange="updateStop('${s.id}','loc',this.value)">
          <option value="">— اختر —</option>${locOpts.replace(`value="${s.loc}"`,`value="${s.loc}" selected`)}
        </select>
        <select style="padding:7px;border:1.5px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit"
          onchange="updateStop('${s.id}','action',this.value)">
          <option value="pickup"  ${s.action==='pickup'?'selected':''}>🟢 ركوب</option>
          <option value="dropoff" ${s.action==='dropoff'?'selected':''}>🔴 نزول</option>
        </select>
        <input type="number" value="${s.people}" min="1" style="width:55px;padding:7px;border:1.5px solid #ddd;border-radius:8px;font-size:13px;text-align:center"
          onchange="updateStop('${s.id}','people',this.value)">
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
        <span style="font-size:12px;color:${col}">على متن السيارة: <b>${onBoard}</b>/${cap}</span>
        <div style="display:flex;gap:4px">
          ${i>0?`<button class="btn b-out b-xs" onclick="moveStop('${s.id}',-1)">↑</button>`:''}
          ${i<_routeStops.length-1?`<button class="btn b-out b-xs" onclick="moveStop('${s.id}',1)">↓</button>`:''}
          <button class="btn b-red b-xs" onclick="removeStop('${s.id}')">✕</button>
        </div>
      </div>
    </div>`;
  }).join('');

  // Evening return (reverse order, pickups become dropoffs)
  const returnStops=[..._routeStops].reverse().map(s=>({...s,action:s.action==='pickup'?'dropoff':'pickup'}));
  const returnHTML=returnStops.map((s,i)=>`
    <div style="display:flex;align-items:center;gap:8px;padding:7px;background:#fff;border-radius:8px;margin-bottom:6px;font-size:13px">
      <span style="font-weight:700">${i+1}.</span>
      <span>${s.action==='pickup'?'🟢':'🔴'} ${s.loc||'—'}</span>
      <span style="color:#888;margin-right:auto">${s.people} فرد</span>
    </div>`).join('');

  document.getElementById('rmodal-body').innerHTML=`
    <div style="background:#f5f5f5;border-radius:8px;padding:10px;margin-bottom:14px;font-size:13px">
      ${FLEET_DEF[v.type]?.icon} ${v.plate} — ${v.driver} | سعة: ${cap} راكب
    </div>
    <div style="font-weight:700;font-size:14px;color:#1565c0;margin-bottom:8px">☀️ رحلة الصباح</div>
    ${stopsHTML}
    <button class="btn b-out b-sm" style="margin-bottom:16px" onclick="addStop()">+ محطة جديدة</button>
    <button class="btn b-blue b-sm" style="margin-bottom:16px;margin-right:8px" onclick="autoSortStops()">🗺 ترتيب تلقائي</button>
    <div style="font-weight:700;font-size:14px;color:#e65100;margin-bottom:8px">🌙 رحلة العودة (تلقائية)</div>
    <div style="background:#fff8e1;border-radius:8px;padding:10px;margin-bottom:14px">${returnHTML||'<div class="empty">لا توجد محطات</div>'}</div>
    <div style="display:flex;gap:8px">
      <button class="btn b-green" onclick="saveRoute()">✅ حفظ الخطة</button>
      <button class="btn b-blue b-sm" onclick="printDriverSheet()">🖨️ ورقة السائق</button>
      <button class="btn b-out" onclick="closeModal('rmodal')">إلغاء</button>
    </div>`;
}

function addStop(){
  _routeStops.push({id:'s'+Date.now(),loc:'',action:'pickup',people:1});
  renderRouteModal();
}

function removeStop(id){
  _routeStops=_routeStops.filter(s=>s.id!==id);
  renderRouteModal();
}

function updateStop(id,field,value){
  const s=_routeStops.find(x=>x.id===id);
  if(s){ s[field]=field==='people'?parseInt(value)||1:value; renderRouteModal(); }
}

function moveStop(id,dir){
  const i=_routeStops.findIndex(s=>s.id===id);
  const j=i+dir;
  if(j<0||j>=_routeStops.length) return;
  [_routeStops[i],_routeStops[j]]=[_routeStops[j],_routeStops[i]];
  renderRouteModal();
}

function autoSortStops(){
  _routeStops=sortStops(_routeStops);
  renderRouteModal();
  toast('✅ تم الترتيب الجغرافي التلقائي');
}

function saveRoute(){
  closeModal('rmodal');
  toast('✅ تم حفظ خطة الرحلة');
}

function printDriverSheet(){
  const v=_routeVehicle;
  const returnStops=[..._routeStops].reverse().map(s=>({...s,action:s.action==='pickup'?'dropoff':'pickup'}));
  let onBoard=0;
  const morningRows=_routeStops.map((s,i)=>{
    if(s.action==='pickup') onBoard+=s.people;
    else onBoard=Math.max(0,onBoard-s.people);
    return `<tr><td>${i+1}</td><td>${s.action==='pickup'?'🟢 ركوب':'🔴 نزول'}</td><td>${s.loc||'—'}</td><td>${s.people}</td><td>${onBoard}</td></tr>`;
  }).join('');
  onBoard=0;
  const eveningRows=returnStops.map((s,i)=>{
    if(s.action==='pickup') onBoard+=s.people;
    else onBoard=Math.max(0,onBoard-s.people);
    return `<tr><td>${i+1}</td><td>${s.action==='pickup'?'🟢 ركوب':'🔴 نزول'}</td><td>${s.loc||'—'}</td><td>${s.people}</td><td>${onBoard}</td></tr>`;
  }).join('');
  const date=new Date().toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'});
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><title>ورقة سائق</title>
  <style>body{font-family:Arial;padding:20px}h2,h3{color:#1565c0}table{width:100%;border-collapse:collapse;margin:10px 0}
  th{background:#1565c0;color:#fff;padding:8px;text-align:right}td{padding:7px 8px;border-bottom:1px solid #ddd}
  tr:nth-child(even){background:#f5f5f5}.header{background:#e3f2fd;padding:12px;border-radius:8px;margin-bottom:16px}
  @media print{button{display:none}}</style></head><body>
  <div class="header">
    <h2>🚗 ورقة السائق — موبيكا</h2>
    <p>📅 ${date} | السيارة: ${v.plate} | السائق: ${v.driver} | السعة: ${v?.cap||'—'} راكب</p>
  </div>
  <h3>☀️ رحلة الصباح</h3>
  <table><thead><tr><th>#</th><th>النشاط</th><th>الموقع</th><th>عدد الأفراد</th><th>على المتن</th></tr></thead><tbody>${morningRows}</tbody></table>
  <h3>🌙 رحلة العودة</h3>
  <table><thead><tr><th>#</th><th>النشاط</th><th>الموقع</th><th>عدد الأفراد</th><th>على المتن</th></tr></thead><tbody>${eveningRows}</tbody></table>
  <br><button onclick="print()" style="padding:10px 24px;background:#1565c0;color:#fff;border:none;border-radius:8px;cursor:pointer">🖨️ طباعة</button>
  </body></html>`);
  w.document.close();
}

// ══ BEST FIT ══
function bestFit(techs){
  const types=Object.keys(FLEET_DEF).sort((a,b)=>FLEET_DEF[a].cap-FLEET_DEF[b].cap);
  for(const t of types){ if(FLEET_DEF[t].cap>=techs) return {type:t}; }
  return {type:'bus26'};
}

// ══ API ══
async function api(action,data){
  if(API_URL.includes('PASTE')) return demoPost(action,data);
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...data})});
  return r.json();
}
async function apiGet(action,params){
  if(API_URL.includes('PASTE')) return demoGet(action,params);
  const q=new URLSearchParams({action,...params});
  const r=await fetch(API_URL+'?'+q);
  return r.json();
}
let _demo=[];
try{_demo=JSON.parse(localStorage.getItem('demo_r')||'[]');}catch(e){}
function saveD(){try{localStorage.setItem('demo_r',JSON.stringify(_demo));}catch(e){}}
function demoPost(action,data){
  if(action==='addRequest'){const id='R'+Date.now().toString(36).toUpperCase();_demo.push({id,status:'pending',...data});saveD();return Promise.resolve({ok:true,id});}
  if(action==='assignVehicle'){(data.ids||[]).forEach(id=>{const r=_demo.find(x=>x.id===id);if(r){r.plate=data.plate;r.driver=data.driver;r.car_type=data.car_type;r.status=data.status||'approved';}});saveD();return Promise.resolve({ok:true});}
  return Promise.resolve({ok:false});
}
function demoGet(action,params){
  return Promise.resolve({ok:true,requests:_demo.filter(r=>!params.date||r.date===params.date)});
}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function todayStr(){return new Date().toISOString().split('T')[0];}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.opacity='1';clearTimeout(el._t);el._t=setTimeout(()=>el.style.opacity='0',3500);}
