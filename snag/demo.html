<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Mobica — Snag Management System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#eef2f7;color:#1a1a2e;min-height:100vh;direction:rtl}
.app{max-width:500px;margin:0 auto;padding:12px;min-height:100vh}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:#fff;border-radius:24px;padding:36px 28px;box-shadow:0 12px 40px rgba(0,0,0,.14);width:100%;max-width:420px}
.login-logo{text-align:center;margin-bottom:6px}
.login-logo img{width:56px}
.login-brand{text-align:center;font-size:22px;font-weight:900;color:#1a237e;letter-spacing:.5px;margin-bottom:2px}
.login-sub{text-align:center;font-size:12px;color:#999;margin-bottom:28px}
.demo-bar{background:#fffde7;border:1px solid #ffe082;border-radius:10px;padding:10px 14px;margin-bottom:20px;font-size:12px;color:#795548;text-align:center}
.demo-bar b{color:#e65100}

/* INPUTS */
.inp{width:100%;border:1.5px solid #e0e0e0;border-radius:12px;padding:12px 15px;font-size:14px;font-family:inherit;direction:rtl;background:#f8f9fc;transition:.2s;outline:none;color:#1a1a2e}
.inp:focus{border-color:#1565c0;background:#fff;box-shadow:0 0 0 3px rgba(21,101,192,.12)}
select.inp{appearance:none;-webkit-appearance:none}
textarea.inp{resize:vertical;min-height:80px;line-height:1.6}
.inp-lbl{font-size:12px;font-weight:700;color:#444;margin-bottom:6px;display:block}
.fld{margin-bottom:16px}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}

/* BUTTONS */
.btn{border:none;border-radius:12px;padding:13px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;width:100%;letter-spacing:.2px}
.btn:active{transform:scale(.97)}
.b-blue{background:#1565c0;color:#fff;box-shadow:0 3px 10px rgba(21,101,192,.3)}
.b-green{background:#2e7d32;color:#fff;box-shadow:0 3px 10px rgba(46,125,50,.3)}
.b-red{background:#c62828;color:#fff}
.b-orange{background:#e65100;color:#fff;box-shadow:0 3px 10px rgba(230,81,0,.25)}
.b-purple{background:#6a1b9a;color:#fff}
.b-teal{background:#00695c;color:#fff}
.b-navy{background:#1a237e;color:#fff}
.b-out{background:#fff;color:#1565c0;border:1.5px solid #1565c0}
.b-out-gray{background:#fff;color:#555;border:1.5px solid #ddd}
.b-xs{padding:7px 12px;font-size:12px;width:auto;border-radius:8px}
.b-sm{padding:10px 15px;font-size:13px;border-radius:10px}
.btn-row{display:flex;gap:8px;margin-top:4px}
.btn-row .btn{flex:1}

/* HEADER */
.hdr{background:linear-gradient(135deg,#1a237e 0%,#1565c0 100%);border-radius:18px;padding:16px 18px;color:#fff;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.hdr-left{display:flex;align-items:center;gap:12px}
.hdr-ic{font-size:30px}
.hdr-title{font-size:16px;font-weight:800;line-height:1.2}
.hdr-sub{font-size:11px;opacity:.75;margin-top:2px}
.hdr-badge{background:rgba(255,255,255,.2);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700}

/* TABS */
.tabs{display:flex;background:#fff;border-radius:14px;padding:5px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.07);gap:3px;overflow-x:auto}
.tab{flex:1;text-align:center;padding:9px 4px;border-radius:10px;font-size:11px;font-weight:700;color:#bbb;cursor:pointer;white-space:nowrap;min-width:60px;transition:.2s}
.tab.on{background:#1565c0;color:#fff;box-shadow:0 2px 6px rgba(21,101,192,.35)}

/* CARDS */
.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:11px;box-shadow:0 2px 10px rgba(0,0,0,.07);transition:.2s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.11)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.snr-id{font-weight:800;font-size:15px;color:#1565c0;letter-spacing:.3px}
.snr-date{font-size:11px;color:#bbb;margin-top:2px}
.badges{display:flex;flex-direction:column;align-items:flex-end;gap:5px}

/* BADGES */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.b-new{background:#e3f2fd;color:#1565c0}
.b-analyzed{background:#f3e5f5;color:#6a1b9a}
.b-approved{background:#e8f5e9;color:#2e7d32}
.b-rejected{background:#ffebee;color:#c62828}
.b-quality{background:#fff8e1;color:#f57f17}
.b-qa-ok{background:#e8f5e9;color:#1b5e20}
.b-production{background:#e8eaf6;color:#3949ab}
.b-ready{background:#f1f8e9;color:#558b2f}
.b-closed{background:#f5f5f5;color:#757575}
.sev-urgent{background:#ffebee;color:#c62828}
.sev-medium{background:#fff8e1;color:#e65100}
.sev-low{background:#e8f5e9;color:#2e7d32}

/* PROGRESS */
.prog-wrap{margin:10px 0 6px}
.prog-labels{display:flex;justify-content:space-between;font-size:9px;color:#ccc;margin-bottom:4px}
.prog{background:#f0f0f0;border-radius:8px;height:7px;overflow:hidden}
.prog-fill{height:100%;border-radius:8px;transition:.5s}
.prog-steps{display:flex;justify-content:space-between;margin-top:6px}
.prog-dot{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.pd-done{background:#1565c0;color:#fff}
.pd-active{background:#fff;border:2px solid #1565c0;color:#1565c0}
.pd-pending{background:#f0f0f0;color:#ccc}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:#fff;border-radius:14px;padding:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.stat-val{font-size:28px;font-weight:900;line-height:1;margin-top:4px}
.stat-lbl{font-size:11px;color:#999;margin-top:4px}
.stat-ic{font-size:20px}

/* TIMELINE */
.timeline{list-style:none;padding:0}
.tl-item{display:flex;gap:12px;padding-bottom:14px;position:relative}
.tl-item:not(:last-child)::after{content:'';position:absolute;right:13px;top:26px;bottom:0;width:2px;background:#f0f0f0}
.tl-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;z-index:1}
.tl-done{background:#e8f5e9;border:2px solid #4caf50}
.tl-active{background:#e3f2fd;border:2px solid #1565c0}
.tl-pending{background:#f5f5f5;border:2px solid #e0e0e0}
.tl-body{flex:1;padding-top:4px}
.tl-title{font-weight:700;font-size:13px;color:#1a1a2e}
.tl-meta{font-size:11px;color:#aaa;margin-top:2px}
.tl-note{font-size:12px;color:#555;margin-top:4px;background:#f8f9fc;border-radius:8px;padding:6px 10px}

/* MODALS */
.ov{position:fixed;inset:0;background:rgba(10,10,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:999;backdrop-filter:blur(3px)}
.modal{background:#fff;border-radius:24px 24px 0 0;padding:22px 20px 30px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto}
.modal-title{font-weight:800;font-size:17px;margin-bottom:18px;color:#1a237e;display:flex;align-items:center;gap:8px}
.modal-info{background:#f8f9fc;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13px;line-height:1.9;border-right:4px solid #1565c0}

/* TOAST */
.toast-box{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:11px 22px;border-radius:24px;font-size:13px;z-index:9999;white-space:nowrap;opacity:0;transition:opacity .3s;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.25)}
.toast-box.show{opacity:1}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:8px 0 14px;z-index:100;box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.bni{display:flex;flex-direction:column;align-items:center;font-size:10px;color:#ccc;cursor:pointer;gap:2px;flex:1;transition:.2s;font-weight:600}
.bni.on{color:#1565c0}
.bni-ic{font-size:22px}
.bni-dot{width:6px;height:6px;border-radius:50%;background:#c62828;margin-top:2px;display:none}
.bni.has-alert .bni-dot{display:block}

/* MISC */
.pb{padding-bottom:85px}
.empty{text-align:center;padding:50px 20px;color:#ccc;font-size:14px}
.empty-ic{font-size:48px;margin-bottom:10px}
.div{height:1px;background:#f0f0f0;margin:10px 0}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#f0f4ff;color:#1565c0;margin-left:4px}
.sec-title{font-weight:800;font-size:14px;color:#1a237e;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #e3f2fd}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f5;font-size:13px}
.info-row:last-child{border-bottom:none}
.info-lbl{color:#888}
.info-val{font-weight:700;color:#1a1a2e}

/* ROLE SWITCHER (DEMO) */
.demo-role-bar{background:#1a237e;border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.demo-role-bar span{color:rgba(255,255,255,.7);font-size:11px;font-weight:700}
.role-chip{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.role-chip.on{background:#fff;color:#1a237e}
.role-chip:hover{background:rgba(255,255,255,.25)}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- LOGIN -->
  <div class="login-wrap" id="loginWrap">
    <div class="login-box">
      <div class="login-logo">🔧</div>
      <div class="login-brand">Mobica Snag System</div>
      <div class="login-sub">نظام إدارة عيوب التركيب — نسخة تجريبية</div>
      <div class="demo-bar">🎯 نسخة العرض — اختر أي دور لتجربة النظام<br><b>كلمة المرور: demo</b></div>
      <div class="fld">
        <label class="inp-lbl">الدور / المستخدم</label>
        <select class="inp" id="ln">
          <option value="">— اختر —</option>
          <optgroup label="👷 الموقع">
            <option value="field">مشرف موقع (فني)</option>
          </optgroup>
          <optgroup label="🧑‍💼 إدارة المجموعة">
            <option value="team_lead_a">أحمد حسن — مدير مجموعة A</option>
            <option value="team_lead_b">سامي فؤاد — مدير مجموعة B</option>
            <option value="team_lead_c">حازم قاعود — مدير مجموعة C</option>
            <option value="team_lead_d">هشام جمال — مدير مجموعة D</option>
          </optgroup>
          <optgroup label="🏢 إدارة التركيبات">
            <option value="ashraf">أشرف قاسم</option>
            <option value="fathy">محمد فتحي</option>
            <option value="khalid">خالد علي</option>
          </optgroup>
          <optgroup label="🔍 جودة وبيع">
            <option value="quality">مسؤول الجودة</option>
            <option value="sales">إدارة البيع</option>
            <option value="technical">المكتب الفني</option>
          </optgroup>
          <optgroup label="📋 متابعة">
            <option value="mokhtar">محمد مختار</option>
          </optgroup>
        </select>
      </div>
      <div class="fld">
        <label class="inp-lbl">كلمة المرور</label>
        <input class="inp" type="password" id="lp" placeholder="demo" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn b-blue" onclick="doLogin()">🔐 دخول للنظام</button>
    </div>
  </div>
</div>

<!-- MODALS -->
<div class="ov" id="newSnagModal" style="display:none">
  <div class="modal">
    <div class="modal-title">➕ تسجيل عيب جديد</div>
    <div class="fld">
      <label class="inp-lbl">اسم العميل *</label>
      <input class="inp" id="ns-client" placeholder="مثال: TMG — كمبوند بلوم">
    </div>
    <div class="fld-row">
      <div>
        <label class="inp-lbl">رقم العقد *</label>
        <input class="inp" id="ns-contract" placeholder="2026-087">
      </div>
      <div>
        <label class="inp-lbl">المجموعة</label>
        <select class="inp" id="ns-team">
          <option value="A">A</option><option value="B">B</option>
          <option value="C">C</option><option value="D">D</option>
        </select>
      </div>
    </div>
    <div class="fld">
      <label class="inp-lbl">البند / القطعة المعيبة *</label>
      <input class="inp" id="ns-item" placeholder="مثال: خزانة غرفة النوم — باب رئيسي">
    </div>
    <div class="fld">
      <label class="inp-lbl">نوع العيب *</label>
      <select class="inp" id="ns-type">
        <option value="">— اختر —</option>
        <option>كسر</option><option>خدش</option><option>مشكلة دهان</option>
        <option>مقاس غلط</option><option>قطعة ناقصة</option>
        <option>تلف أثناء النقل</option><option>خطأ في التجميع</option>
        <option>اكسسوار ناقص</option><option>أخرى</option>
      </select>
    </div>
    <div class="fld">
      <label class="inp-lbl">درجة الخطورة *</label>
      <div style="display:flex;gap:8px">
        <button class="btn b-out b-sm" style="flex:1;border-color:#c62828;color:#c62828" onclick="setSev(this,'urgent')">🔴 عاجل</button>
        <button class="btn b-out b-sm" style="flex:1;border-color:#e65100;color:#e65100" onclick="setSev(this,'medium')">🟡 متوسط</button>
        <button class="btn b-out b-sm" style="flex:1;border-color:#2e7d32;color:#2e7d32" onclick="setSev(this,'low')">🟢 بسيط</button>
      </div>
      <input type="hidden" id="ns-sev" value="">
    </div>
    <div class="fld">
      <label class="inp-lbl">ملاحظات إضافية</label>
      <textarea class="inp" id="ns-notes" placeholder="وصف مختصر للعيب..."></textarea>
    </div>
    <div class="btn-row">
      <button class="btn b-orange" onclick="submitNewSnag()">✅ تسجيل العيب</button>
      <button class="btn b-out-gray" onclick="closeModal('newSnagModal')">إلغاء</button>
    </div>
  </div>
</div>

<div class="ov" id="analyzeModal" style="display:none">
  <div class="modal">
    <div class="modal-title">🔍 تحليل العيب</div>
    <div class="modal-info" id="am-info"></div>
    <div class="fld">
      <label class="inp-lbl">السبب الجذري *</label>
      <select class="inp" id="am-cause">
        <option value="">— اختر —</option>
        <option value="manufacturing">خطأ في التصنيع</option>
        <option value="transport">تلف أثناء النقل</option>
        <option value="installation">خطأ في التركيب</option>
        <option value="design">خطأ في التصميم</option>
        <option value="misuse">إساءة استخدام من العميل</option>
        <option value="unknown">غير محدد — يحتاج تحقيق</option>
      </select>
    </div>
    <div class="fld">
      <label class="inp-lbl">المصنع المسؤول</label>
      <select class="inp" id="am-factory">
        <option value="">— غير محدد —</option>
        <option>مصنع الخشب الطبيعي</option><option>مصنع الملامين</option>
        <option>مصنع المعدني</option><option>مصنع الألوميتال</option>
        <option>لا يتعلق بالمصنع</option>
      </select>
    </div>
    <div class="fld">
      <label class="inp-lbl">وصف تفصيلي للعيب *</label>
      <textarea class="inp" id="am-desc" placeholder="اشرح العيب بدقة — الحجم، الموقع، الشدة، التأثير..."></textarea>
    </div>
    <div class="fld">
      <label class="inp-lbl">الحل المقترح</label>
      <select class="inp" id="am-sol">
        <option value="">— اختر —</option>
        <option value="fix_site">إصلاح في الموقع (24 ساعة)</option>
        <option value="replace_part">استبدال قطعة (7 أيام)</option>
        <option value="replace_full">استبدال كامل للمنتج</option>
        <option value="maintenance">صيانة وطلاء</option>
      </select>
    </div>
    <div class="btn-row">
      <button class="btn b-purple" onclick="submitAnalysis()">📤 إرسال للاعتماد</button>
      <button class="btn b-out-gray" onclick="closeModal('analyzeModal')">إلغاء</button>
    </div>
  </div>
</div>

<div class="ov" id="approveModal" style="display:none">
  <div class="modal">
    <div class="modal-title">✅ اعتماد تقرير العيب</div>
    <div class="modal-info" id="apm-info"></div>
    <div class="fld">
      <label class="inp-lbl">ملاحظة الاعتماد (اختياري)</label>
      <textarea class="inp" id="apm-note" placeholder="أي تعليق على التقرير أو توجيه..."></textarea>
    </div>
    <div class="btn-row">
      <button class="btn b-green" onclick="submitApprove(true)">✅ اعتماد وإرسال للجودة</button>
      <button class="btn b-red" onclick="submitApprove(false)">❌ رفض مع سبب</button>
    </div>
    <button class="btn b-out-gray b-sm" style="margin-top:8px" onclick="closeModal('approveModal')">إلغاء</button>
  </div>
</div>

<div class="ov" id="qualityModal" style="display:none">
  <div class="modal">
    <div class="modal-title">🔬 مراجعة الجودة</div>
    <div class="modal-info" id="qm-info"></div>
    <div class="fld">
      <label class="inp-lbl">تأكيد المتسبب</label>
      <select class="inp" id="qm-cause">
        <option value="">— اختر —</option>
        <option>خطأ في التصنيع — مصنع الملامين</option>
        <option>خطأ في التصنيع — مصنع المعدني</option>
        <option>تلف أثناء النقل — إدارة التسليمات</option>
        <option>خطأ في التركيب — فريق التركيبات</option>
        <option>خطأ في التصميم — المكتب الفني</option>
        <option>إساءة استخدام من العميل</option>
      </select>
    </div>
    <div class="fld">
      <label class="inp-lbl">نتيجة التحقيق</label>
      <textarea class="inp" id="qm-result" placeholder="نتيجة المراجعة الميدانية..."></textarea>
    </div>
    <div class="btn-row">
      <button class="btn b-teal" onclick="submitQuality()">✅ اعتماد الجودة</button>
      <button class="btn b-out-gray" onclick="closeModal('qualityModal')">إلغاء</button>
    </div>
  </div>
</div>

<div class="ov" id="detailModal" style="display:none">
  <div class="modal">
    <div class="modal-title">📋 تفاصيل العيب</div>
    <div id="detail-body"></div>
    <button class="btn b-out-gray b-sm" style="margin-top:16px" onclick="closeModal('detailModal')">إغلاق</button>
  </div>
</div>

<div class="toast-box" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
// DEMO DATA
// ═══════════════════════════════════════════════
const DEMO_SNAGS = [
  {
    id:'SNR-2026-0001', date:'2026-02-25', client:'TMG — كمبوند بلوم', contract:'2026-041',

function switchRole(role){
  U = { role, ...ROLES[role] };
  renderApp();
  toast(`🔄 الدور: ${U.name}`);
}

function switchTab(name, btn){
  ['list','dash','guide'].forEach(t=>{
    const el=document.getElementById('tab-'+t);
    if(el) el.style.display=t===name?'':'none';
  });
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.bni').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  const bn=document.getElementById('bn-'+name);
  if(bn) bn.classList.add('on');
  if(name==='list')  renderList();
  if(name==='dash')  renderDash();
  if(name==='guide') renderGuide();
}

function checkAlerts(){
  const urgent = visibleSnags().filter(s=>s.severity==='urgent'&&s.status!=='closed').length;
  const pending = visibleSnags().filter(s=>canAct(s)).length;
  const bn = document.getElementById('bn-list');
  if(bn && (urgent||pending)) bn.classList.add('has-alert');
}

// RENDER LIST
// ═══════════════════════════════════════════════
function visibleSnags(){
  if(['field'].includes(U.role)) return SNAGS.filter(s=>s.created_by===U.name||s.team===U.team);
  if(U.role.startsWith('team_lead')) return SNAGS.filter(s=>s.team===U.team||s.created_by===U.name);
  return SNAGS;
}

function canAct(s){
  const r = U.role;
  if(r.startsWith('team_lead') && s.status==='new' && s.team===U.team) return true;
  if(['ashraf','fathy','khalid'].includes(r) && s.status==='analyzed') return true;
  if(r==='quality' && s.status==='quality_review') return true;
  if(r==='mokhtar' && ['approved','quality_approved','in_production','ready'].includes(s.status)) return true;
  return false;
}

function renderList(){
  const el = document.getElementById('tab-list');
  if(!el) return;
  const snags = visibleSnags();
  const canAdd = ['field','team_lead_a','team_lead_b','team_lead_c','team_lead_d'].includes(U.role);
  const myActions = snags.filter(canAct);

  let html = '';
  if(canAdd){
    html += `<button class="btn b-orange" style="margin-bottom:12px" onclick="openNewSnag()">➕ تسجيل عيب جديد</button>`;
  }

  if(myActions.length){
    html += `<div style="background:#fff3e0;border-radius:12px;padding:10px 14px;margin-bottom:12px;border-right:4px solid #e65100">
      <div style="font-weight:700;font-size:13px;color:#e65100">⚡ تحتاج إجراء منك (${myActions.length})</div>
      <div style="font-size:12px;color:#888;margin-top:2px">${myActions.map(s=>s.id).join(' • ')}</div>
    </div>`;
  }

  // فلاتر
  html += `<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">
    ${filterBtn('الكل',snags.length,'')}
    ${filterBtn('🔴 عاجل',snags.filter(s=>s.severity==='urgent').length,'urgent')}
    ${filterBtn('مفتوح',snags.filter(s=>s.status!=='closed').length,'open')}
    ${filterBtn('مغلق',snags.filter(s=>s.status==='closed').length,'closed')}
  </div>`;

  html += '<div id="cards-wrap">' + renderCards(snags) + '</div>';
  el.innerHTML = html;
}

function filterBtn(lbl, count, val){
  return `<button class="btn b-out b-xs" onclick="applyFilter('${val}')">${lbl} <span style="background:#f0f4ff;border-radius:10px;padding:1px 7px;font-size:10px">${count}</span></button>`;
}

function applyFilter(val){
  let snags = visibleSnags();
  if(val==='urgent') snags=snags.filter(s=>s.severity==='urgent');
  if(val==='open')   snags=snags.filter(s=>s.status!=='closed');
  if(val==='closed') snags=snags.filter(s=>s.status==='closed');
  document.getElementById('cards-wrap').innerHTML = renderCards(snags);
}

function renderCards(snags){
  if(!snags.length) return `<div class="empty"><div class="empty-ic">📭</div>لا توجد عيوب</div>`;
  return snags.sort((a,b)=>{
    const sevOrder={urgent:0,medium:1,low:2};
    if(a.status!=='closed'&&b.status==='closed') return -1;
    if(a.status==='closed'&&b.status!=='closed') return 1;
    return (sevOrder[a.severity]||1)-(sevOrder[b.severity]||1);
  }).map(snagCard).join('');
}

function snagCard(s){
  const st  = STATUS_CFG[s.status]||{label:s.status,badge:'b-new',icon:'❓',step:0};
  const sv  = SEV_CFG[s.severity]||{label:'—',badge:'sev-low',sla:7};
  const act = canAct(s);
  const stepIdx = st.step;
  const progress = Math.round((stepIdx/6)*100);
  const progColor = s.status==='closed'?'#2e7d32':s.severity==='urgent'?'#c62828':'#1565c0';
  const urgentBorder = s.severity==='urgent'&&s.status!=='closed' ? 'border-right:4px solid #c62828;' : '';

  // حساب الأيام
  const days = Math.floor((new Date()-new Date(s.created_at))/(1000*60*60*24));
  const slaExceeded = days > sv.sla && s.status!=='closed';

  let actionBtn = '';
  const r = U.role;
  if(r.startsWith('team_lead') && s.status==='new' && s.team===U.team)
    actionBtn = `<button class="btn b-purple b-xs" onclick="openAnalyze('${s.id}')">🔍 تحليل العيب</button>`;
  else if(['ashraf','fathy','khalid'].includes(r) && s.status==='analyzed')
    actionBtn = `<button class="btn b-green b-xs" onclick="openApprove('${s.id}')">✅ اعتماد / رفض</button>`;
  else if(r==='quality' && s.status==='quality_review')
    actionBtn = `<button class="btn b-teal b-xs" onclick="openQuality('${s.id}')">🔬 مراجعة الجودة</button>`;
  else if(r==='mokhtar'){
    if(s.status==='approved')
      actionBtn=`<button class="btn b-xs" style="background:#ff6f00;color:#fff" onclick="moveStatus('${s.id}','quality_review','إرسال للجودة')">🔬 إرسال للجودة</button>`;
    else if(s.status==='quality_approved')
      actionBtn=`<button class="btn b-xs" style="background:#3949ab;color:#fff" onclick="moveStatus('${s.id}','in_production','بدء التصنيع — SLA 7 أيام')">🏭 بدء التصنيع</button>`;
    else if(s.status==='in_production')
      actionBtn=`<button class="btn b-xs b-green" onclick="moveStatus('${s.id}','ready','جاهز للتوريد')">📦 جاهز للتوريد</button>`;
    else if(s.status==='ready')
      actionBtn=`<button class="btn b-xs b-green" onclick="closeSnag('${s.id}')">🟢 إغلاق العيب</button>`;
  }

  return `<div class="card" style="${urgentBorder}">
    <div class="card-top">
      <div>
        <div class="snr-id">${s.id}</div>
        <div class="snr-date">📅 ${s.date} ${slaExceeded?'<span style="color:#c62828;font-size:10px;font-weight:700">⚠️ تجاوز SLA</span>':''}</div>
      </div>
      <div class="badges">
        <span class="badge ${st.badge}">${st.icon} ${st.label}</span>
        <span class="badge ${sv.badge}">${sv.label}</span>
      </div>
    </div>
    <div style="font-weight:700;font-size:14px;margin-bottom:3px">🏢 ${s.client}</div>
    <div style="font-size:12px;color:#666;margin-bottom:3px">📋 ${s.contract} | ${s.item}</div>
    <div style="font-size:12px;color:#aaa;margin-bottom:8px">🔧 ${s.defect_type} | 👷 ${s.created_by} | مجموعة ${s.team}</div>
    <div class="prog-wrap">
      <div class="prog-labels">
        ${WORKFLOW.map(w=>`<span>${w.icon}</span>`).join('')}
      </div>
      <div class="prog"><div class="prog-fill" style="width:${progress}%;background:${progColor}"></div></div>
    </div>
    <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
      <button class="btn b-out b-xs" onclick="openDetail('${s.id}')">📋 التفاصيل والتاريخ</button>
      ${actionBtn}
    </div>
  </div>`;
}

function renderDash(){
  const el = document.getElementById('tab-dash');
  if(!el) return;
  const snags = SNAGS;
  const total   = snags.length;
  const open    = snags.filter(s=>s.status!=='closed').length;
  const closed  = snags.filter(s=>s.status==='closed').length;
  const urgent  = snags.filter(s=>s.severity==='urgent'&&s.status!=='closed').length;
  const byStatus= {};
  snags.forEach(s=>{ byStatus[s.status]=(byStatus[s.status]||0)+1; });
  const byTeam  = {};
  snags.forEach(s=>{ byTeam[s.team]=(byTeam[s.team]||0)+1; });
  const byType  = {};
  snags.forEach(s=>{ if(s.defect_type) byType[s.defect_type]=(byType[s.defect_type]||0)+1; });

  const closedSnags = snags.filter(s=>s.status==='closed'&&s.closed_at&&s.created_at);
  const avgDays = closedSnags.length
    ? (closedSnags.reduce((acc,s)=>{
        return acc + (new Date(s.closed_at)-new Date(s.created_at))/(1000*60*60*24);
      },0)/closedSnags.length).toFixed(1)
    : '—';

  const statCard=(ic,lbl,val,color,sub='')=>`
    <div class="stat-card">
      <div class="stat-ic">${ic}</div>
      <div class="stat-val" style="color:${color}">${val}</div>
      <div class="stat-lbl">${lbl}</div>
      ${sub?`<div style="font-size:10px;color:#bbb;margin-top:2px">${sub}</div>`:''}
    </div>`;

  const teamColors={A:'#1565c0',B:'#2e7d32',C:'#6a1b9a',D:'#e65100'};
  const typeIcons={'كسر':'💔','خدش':'🖊','مشكلة دهان':'🎨','مقاس غلط':'📐','قطعة ناقصة':'🧩','تلف أثناء النقل':'🚛','خطأ في التجميع':'🔩','اكسسوار ناقص':'🔧'};

  el.innerHTML = `
    <div class="sec-title">📊 ملخص اليوم</div>
    <div class="stats-grid">
      ${statCard('📋','إجمالي العيوب',total,'#1565c0')}
      ${statCard('🔴','عاجل مفتوح',urgent,'#c62828','يحتاج إجراء فوري')}
      ${statCard('⚙️','قيد المعالجة',open,'#e65100')}
      ${statCard('✅','تم إغلاقه',closed,'#2e7d32','avg '+avgDays+' يوم')}
    </div>

    <div class="card" style="margin-bottom:12px">
      <div class="sec-title">🔄 توزيع المراحل</div>
      ${Object.entries(STATUS_CFG).map(([key,cfg])=>{
        const count = byStatus[key]||0;
        const pct = total?Math.round(count/total*100):0;
        return count?`<div style="margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
            <span>${cfg.icon} ${cfg.label}</span>
            <span style="font-weight:700">${count} <span style="color:#bbb;font-weight:400">(${pct}%)</span></span>
          </div>
          <div class="prog"><div class="prog-fill" style="width:${pct}%;background:#1565c0"></div></div>
        </div>`:'';
      }).join('')}
    </div>

    <div class="card" style="margin-bottom:12px">
      <div class="sec-title">👥 توزيع المجموعات</div>
      ${['A','B','C','D'].map(t=>{
        const count=byTeam[t]||0;
        const pct=total?Math.round(count/total*100):0;
        return `<div style="margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
            <span style="font-weight:700;color:${teamColors[t]}">مجموعة ${t}</span>
            <span style="font-weight:700">${count}</span>
          </div>
          <div class="prog"><div class="prog-fill" style="width:${pct}%;background:${teamColors[t]}"></div></div>
        </div>`;
      }).join('')}
    </div>

    <div class="card" style="margin-bottom:12px">
      <div class="sec-title">🔧 أنواع العيوب الأكثر تكراراً</div>
      ${Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([type,count])=>`
        <div class="info-row">
          <span class="info-lbl">${typeIcons[type]||'🔧'} ${type}</span>
          <span class="info-val">${count} <span style="color:#bbb;font-size:11px">حالة</span></span>
        </div>`).join('')}
    </div>

    <div class="card">
      <div class="sec-title">⏱️ مؤشرات الأداء</div>
      <div class="info-row">
        <span class="info-lbl">متوسط وقت الإغلاق</span>
        <span class="info-val">${avgDays} ${avgDays!=='—'?'يوم':''}</span>
      </div>
      <div class="info-row">
        <span class="info-lbl">SLA compliance</span>
        <span class="info-val" style="color:#2e7d32">${closed?Math.round((closed/total)*100):0}%</span>
      </div>
      <div class="info-row">
        <span class="info-lbl">أعلى خطورة مفتوح</span>
        <span class="info-val" style="color:#c62828">${urgent} عيب عاجل</span>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════
// GUIDE
// ═══════════════════════════════════════════════
function renderGuide(){
  const el = document.getElementById('tab-guide');
  if(!el) return;
  el.innerHTML = `
    <div class="card">
      <div class="sec-title">📖 دليل استخدام النظام</div>
      <div style="font-size:13px;line-height:1.9;color:#444">
        <b>🆕 الخطوة 1 — تسجيل العيب (الفني/المشرف)</b><br>
        عند اكتشاف أي عيب في الموقع، اضغط "تسجيل عيب جديد" وأدخل بيانات العميل والقطعة وصور العيب. الـ app يولد رقم SNR تلقائي.<br><br>

        <b>🔍 الخطوة 2 — تحليل العيب (مدير المجموعة)</b><br>
        مدير المجموعة يستلم إشعار فوري، يفتح الـ SNR ويحدد السبب الجذري ويكتب وصفاً تفصيلياً ويقترح الحل.<br><br>

        <b>✅ الخطوة 3 — الاعتماد (إدارة التركيبات)</b><br>
        أشرف أو محمد فتحي أو خالد علي يراجع التقرير ويعتمده بضغطة واحدة. أول واحد يعتمد = التقرير يتحرك.<br><br>

        <b>🔬 الخطوة 4 — مراجعة الجودة</b><br>
        الجودة تتحقق وتحدد المتسبب الرسمي. محمد مختار يتابع ويرسل للجودة.<br><br>

        <b>🏭 الخطوة 5 — التصنيع</b><br>
        محمد مختار يتابع مع المصنع المختص. SLA: 7 أيام للعيوب المتوسطة، 3 أيام للعاجلة.<br><br>

        <b>🟢 الخطوة 6 — الإغلاق</b><br>
        بعد التوريد والتركيب، مدير المجموعة يؤكد الحل والـ SNR يُغلق تلقائياً.<br><br>

        <div style="background:#e8f5e9;border-radius:10px;padding:10px;margin-top:8px">
          ⚡ <b>SLA:</b> عاجل 3 أيام | متوسط 7 أيام | بسيط 14 يوم<br>
          📱 <b>الإشعارات:</b> كل خطوة تبعت إشعار تيليجرام لأصحاب الدور<br>
          📊 <b>التقارير:</b> تقرير أسبوعي تلقائي كل خميس
        </div>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════
// NEW SNAG
// ═══════════════════════════════════════════════
function openNewSnag(){
  ['ns-client','ns-contract','ns-item','ns-notes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('ns-type').value='';
  document.getElementById('ns-sev').value='';
  document.getElementById('ns-team').value = U.team||'A';
  document.querySelectorAll('[onclick^="setSev"]').forEach(b=>b.style.fontWeight='');
  document.getElementById('newSnagModal').style.display='flex';
}

function setSev(btn, val){
  document.getElementById('ns-sev').value = val;
  document.querySelectorAll('[onclick^="setSev"]').forEach(b=>{ b.style.background='#fff'; b.style.fontWeight=''; });
  btn.style.background = val==='urgent'?'#ffebee':val==='medium'?'#fff8e1':'#e8f5e9';
  btn.style.fontWeight = '800';
}

function submitNewSnag(){
  const client   = document.getElementById('ns-client').value.trim();
  const contract = document.getElementById('ns-contract').value.trim();
  const item     = document.getElementById('ns-item').value.trim();
  const type     = document.getElementById('ns-type').value;
  const sev      = document.getElementById('ns-sev').value;
  const team     = document.getElementById('ns-team').value;
  const notes    = document.getElementById('ns-notes').value.trim();
  if(!client||!contract||!item||!type||!sev) return toast('⚠️ أكمل البيانات المطلوبة');

  const now = new Date().toISOString();
  const id  = 'SNR-'+new Date().getFullYear()+'-'+String(SNAGS.length+1).padStart(4,'0');
  SNAGS.push({
    id, date:now.substring(0,10), client, contract, item,
    defect_type:type, severity:sev, status:'new', team,
    created_by:U.name, created_at:now, closed_at:'',
    root_cause:'', factory:'', analysis_desc:'', proposed_solution:'',
    analyzed_by:'', approved_by:'', approval_note:'',
    quality_result:'', quality_cause:'', notes,
    history:[{ step:'new', by:U.name, at:now, note:'تم تسجيل العيب' }]
  });
  saveSnags();
  toast(`✅ تم تسجيل ${id} — إشعار أُرسل لمدير المجموعة`);
  closeModal('newSnagModal');
  renderList();
}

// ═══════════════════════════════════════════════
// ANALYZE
// ═══════════════════════════════════════════════
function openAnalyze(id){
  _curId=id;
  const s=SNAGS.find(x=>x.id===id);
  if(!s) return;
  document.getElementById('am-info').innerHTML=
    `<b>${s.id}</b> | 🏢 ${s.client}<br>📋 ${s.contract} | ${s.item}<br>🔧 ${s.defect_type} | ${SEV_CFG[s.severity]?.label||'—'}${s.notes?`<br>📝 ${s.notes}`:''}`;
  ['am-cause','am-factory','am-sol'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('am-desc').value='';
  document.getElementById('analyzeModal').style.display='flex';
}

function submitAnalysis(){
  const cause   = document.getElementById('am-cause').value;
  const factory = document.getElementById('am-factory').value;
  const desc    = document.getElementById('am-desc').value.trim();
  const sol     = document.getElementById('am-sol').value;
  if(!cause||!desc) return toast('⚠️ حدد السبب وأكتب الوصف');
  const now=new Date().toISOString();
  const s=SNAGS.find(x=>x.id===_curId);
  if(!s) return;
  Object.assign(s,{ status:'analyzed', root_cause:cause, factory, analysis_desc:desc, proposed_solution:sol, analyzed_by:U.name });
  s.history.push({ step:'analyzed', by:U.name, at:now, note:`السبب: ${cause} | ${desc}` });
  saveSnags();
  toast('✅ تم التحليل — إشعار أُرسل لإدارة التركيبات');
  closeModal('analyzeModal');
  renderList();
}

// ═══════════════════════════════════════════════
// APPROVE
// ═══════════════════════════════════════════════
function openApprove(id){
  _curId=id;
  const s=SNAGS.find(x=>x.id===id);
  if(!s) return;
  const sv=SEV_CFG[s.severity]||{label:'—'};
  document.getElementById('apm-info').innerHTML=
    `<b>${s.id}</b> | 🏢 ${s.client}<br>📋 ${s.contract} | ${s.item}<br>
     🔧 ${s.defect_type} | ${sv.label}<br><div class="div"></div>
     🔍 <b>التحليل:</b> ${s.analysis_desc||'—'}<br>
     🎯 <b>السبب:</b> ${s.root_cause||'—'}<br>
     🏭 <b>المصنع:</b> ${s.factory||'—'}<br>
     💡 <b>الحل:</b> ${s.proposed_solution||'—'}<br>
     👷 <b>حلّله:</b> ${s.analyzed_by||'—'}`;
  document.getElementById('apm-note').value='';
  document.getElementById('approveModal').style.display='flex';
}

function submitApprove(approved){
  const note=document.getElementById('apm-note').value.trim();
  const now=new Date().toISOString();
  const s=SNAGS.find(x=>x.id===_curId);
  if(!s) return;
  const newStatus = approved?'approved':'rejected';
  Object.assign(s,{ status:newStatus, approved_by:U.name, approval_note:note });
  s.history.push({ step:newStatus, by:U.name, at:now, note:approved?'اعتماد: '+note:'رفض: '+note });
  saveSnags();
  toast(approved?'✅ تم الاعتماد — إيميل للجودة والبيع':'❌ تم الرفض مع إشعار');
  closeModal('approveModal');
  renderList();
}

// ═══════════════════════════════════════════════
// QUALITY
// ═══════════════════════════════════════════════
function openQuality(id){
  _curId=id;
  const s=SNAGS.find(x=>x.id===id);
  if(!s) return;
  document.getElementById('qm-info').innerHTML=
    `<b>${s.id}</b> | 🏢 ${s.client}<br>📋 ${s.item}<br>
     🎯 السبب المقترح: ${s.root_cause||'—'}<br>
     🏭 المصنع: ${s.factory||'—'}<br>
     💡 الحل: ${s.proposed_solution||'—'}`;
  document.getElementById('qm-cause').value='';
  document.getElementById('qm-result').value='';
  document.getElementById('qualityModal').style.display='flex';
}

function submitQuality(){
  const cause  = document.getElementById('qm-cause').value;
  const result = document.getElementById('qm-result').value.trim();
  if(!cause) return toast('⚠️ حدد المتسبب');
  const now=new Date().toISOString();
  const s=SNAGS.find(x=>x.id===_curId);
  if(!s) return;
  Object.assign(s,{ status:'quality_approved', quality_cause:cause, quality_result:result });
  s.history.push({ step:'quality_approved', by:U.name, at:now, note:`المتسبب: ${cause}` });
  saveSnags();
  toast('✅ اعتماد الجودة — إشعار لمحمد مختار');
  closeModal('qualityModal');
  renderList();
}

// ═══════════════════════════════════════════════
// MOVE STATUS
// ═══════════════════════════════════════════════
function moveStatus(id, newStatus, note){
  const s=SNAGS.find(x=>x.id===id);
  if(!s) return;
  const now=new Date().toISOString();
  s.status=newStatus;
  s.history.push({ step:newStatus, by:U.name, at:now, note });
  saveSnags();
  toast(`✅ ${note} — إشعار أُرسل`);
  renderList();
}

function closeSnag(id){
  const s=SNAGS.find(x=>x.id===id);
  if(!s) return;
  const now=new Date().toISOString();
  s.status='closed';
  s.closed_at=now;
  s.history.push({ step:'closed', by:U.name, at:now, note:'تم التوريد والتركيب — إغلاق العيب' });
  saveSnags();
  toast('🟢 تم إغلاق العيب بنجاح');
  renderList();
}

// ═══════════════════════════════════════════════
// DETAIL
// ═══════════════════════════════════════════════
function openDetail(id){
  const s=SNAGS.find(x=>x.id===id);
  if(!s) return;
  const st=STATUS_CFG[s.status]||{label:s.status,badge:'b-new',icon:'❓',step:0};
  const sv=SEV_CFG[s.severity]||{label:'—',badge:'sev-low'};

  const tlHtml=(s.history||[]).map((h,i)=>{
    const cfg=STATUS_CFG[h.step]||{icon:'•',label:h.step};
    const isLast=i===s.history.length-1;
    return `<li class="tl-item">
      <div class="tl-dot ${isLast?'tl-active':'tl-done'}">${cfg.icon}</div>
      <div class="tl-body">
        <div class="tl-title">${STATUS_CFG[h.step]?.label||h.step}</div>
        <div class="tl-meta">${h.by||'—'} | ${h.at?h.at.replace('T',' ').substring(0,16):'—'}</div>
        ${h.note?`<div class="tl-note">${h.note}</div>`:''}
      </div>
    </li>`;
  }).join('');

  document.getElementById('detail-body').innerHTML=`
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <span class="badge ${st.badge}">${st.icon} ${st.label}</span>
      <span class="badge ${sv.badge}">${sv.label}</span>
    </div>
    <div class="card" style="margin-bottom:12px">
      <div class="sec-title">بيانات العيب</div>
      <div class="info-row"><span class="info-lbl">رقم SNR</span><span class="info-val">${s.id}</span></div>
      <div class="info-row"><span class="info-lbl">العميل</span><span class="info-val">${s.client}</span></div>
      <div class="info-row"><span class="info-lbl">العقد</span><span class="info-val">${s.contract}</span></div>
      <div class="info-row"><span class="info-lbl">البند</span><span class="info-val">${s.item}</span></div>
      <div class="info-row"><span class="info-lbl">نوع العيب</span><span class="info-val">${s.defect_type}</span></div>
      <div class="info-row"><span class="info-lbl">المجموعة</span><span class="info-val">${s.team}</span></div>
      <div class="info-row"><span class="info-lbl">سجّله</span><span class="info-val">${s.created_by}</span></div>
      <div class="info-row"><span class="info-lbl">التاريخ</span><span class="info-val">${s.date}</span></div>
      ${s.notes?`<div class="info-row"><span class="info-lbl">ملاحظات</span><span class="info-val">${s.notes}</span></div>`:''}
    </div>
    ${s.analysis_desc?`<div class="card" style="margin-bottom:12px">
      <div class="sec-title">🔍 نتيجة التحليل</div>
      <div class="info-row"><span class="info-lbl">السبب</span><span class="info-val">${s.root_cause||'—'}</span></div>
      <div class="info-row"><span class="info-lbl">المصنع</span><span class="info-val">${s.factory||'—'}</span></div>
      <div class="info-row"><span class="info-lbl">الوصف</span><span class="info-val">${s.analysis_desc}</span></div>
      <div class="info-row"><span class="info-lbl">الحل المقترح</span><span class="info-val">${s.proposed_solution||'—'}</span></div>
      <div class="info-row"><span class="info-lbl">حلّله</span><span class="info-val">${s.analyzed_by||'—'}</span></div>
    </div>`:''}
    ${s.quality_cause?`<div class="card" style="margin-bottom:12px">
      <div class="sec-title">🔬 قرار الجودة</div>
      <div class="info-row"><span class="info-lbl">المتسبب</span><span class="info-val">${s.quality_cause}</span></div>
      ${s.quality_result?`<div class="info-row"><span class="info-lbl">النتيجة</span><span class="info-val">${s.quality_result}</span></div>`:''}
    </div>`:''}
    ${tlHtml?`<div class="sec-title" style="margin-bottom:8px">📜 سجل التقدم</div><ul class="timeline">${tlHtml}</ul>`:''}`;

  document.getElementById('detailModal').style.display='flex';
}

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
function closeModal(id){ document.getElementById(id).style.display='none'; }

function resetDemo(){
  localStorage.removeItem('snag_demo_v2');
  SNAGS = JSON.parse(JSON.stringify(DEMO_SNAGS));
  toast('🔄 تم إعادة ضبط البيانات التجريبية');
  renderList();
}

let _tt;
function toast(msg,ms=3500){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('show'),ms);
}
</script>
</body>
</html>
